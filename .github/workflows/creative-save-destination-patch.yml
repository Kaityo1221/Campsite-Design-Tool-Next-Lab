name: creative-save-destination-patch

on:
  push:
    branches:
      - agent/creative-preserve-kml-export

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-preserve-kml-export
      - name: Patch save destination flow only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('creative/index.html')
          s=p.read_text()
          old="""async function exportKmz(){closeMenus();const kml=buildMyMapsKml();let zip;if(sourceZip){const raw=await sourceZip.generateAsync({type:'uint8array'});zip=await JSZip.loadAsync(raw)}else zip=new JSZip();zip.file(sourceKmlPath||'doc.kml',kml);const bytes=await zip.generateAsync({type:'uint8array',compression:'DEFLATE'}),filename=sourceName+'_creative.kmz',blob=new Blob([bytes],{type:'application/vnd.google-earth.kmz'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();const href=a.href;a.remove();setTimeout(()=>URL.revokeObjectURL(href),1500);msg('My Maps用KMZを書き出しました')}$('save').onclick=exportKmz;"""
          new="""let saveChooser=null;
function closeSaveChooser(){if(saveChooser){saveChooser.remove();saveChooser=null}}
function downloadKmzBlob(blob,filename){const a=document.createElement('a'),href=URL.createObjectURL(blob);a.href=href;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1500)}
function shareableKmzFile(blob,filename){if(typeof File==='undefined'||!navigator.canShare)return null;for(const type of ['application/vnd.google-earth.kmz','application/zip','']){const f=new File([blob],filename,type?{type}:{});try{if(navigator.canShare({files:[f]}))return f}catch{}}return null}
function showSaveChooser(blob,filename){closeSaveChooser();const wrap=document.createElement('div'),choose=document.createElement('button'),download=document.createElement('button'),close=document.createElement('button');Object.assign(wrap.style,{position:'fixed',left:'50%',transform:'translateX(-50%)',bottom:'calc(132px + env(safe-area-inset-bottom))',zIndex:'1600',display:'flex',gap:'8px',alignItems:'center',padding:'8px',borderRadius:'16px',background:'rgba(48,40,29,.95)',boxShadow:'0 8px 24px rgba(0,0,0,.28)'});choose.type='button';choose.textContent='保存先を選ぶ';Object.assign(choose.style,{minWidth:'168px',height:'52px',padding:'0 16px',border:'2px solid #8a6b31',borderRadius:'15px',background:'#fff8e6',color:'#37270c',fontWeight:'950',fontSize:'16px'});download.type='button';download.textContent='⬇';download.title='通常ダウンロード';Object.assign(download.style,{width:'46px',height:'46px',border:'2px solid #8a6b31',borderRadius:'14px',background:'rgba(255,253,247,.96)',color:'#5d4630',fontWeight:'950',fontSize:'20px'});close.type='button';close.textContent='×';Object.assign(close.style,{width:'46px',height:'46px',border:'2px solid #8a6b31',borderRadius:'14px',background:'rgba(255,253,247,.96)',color:'#5d4630',fontWeight:'950',fontSize:'24px'});wrap.append(choose,download,close);document.body.appendChild(wrap);saveChooser=wrap;choose.onclick=async()=>{try{if('showSaveFilePicker' in window){const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'KMZ ファイル',accept:{'application/vnd.google-earth.kmz':['.kmz']}}]});const writable=await handle.createWritable();await writable.write(blob);await writable.close();closeSaveChooser();msg('保存しました');return}const file=shareableKmzFile(blob,filename);if(file&&navigator.share){await navigator.share({files:[file],title:filename});closeSaveChooser();msg('保存先へ渡しました');return}downloadKmzBlob(blob,filename);closeSaveChooser();msg('通常ダウンロードで保存しました')}catch(e){if(e?.name==='AbortError'){msg('保存をキャンセルしました');return}try{const file=shareableKmzFile(blob,filename);if(file&&navigator.share){await navigator.share({files:[file],title:filename});closeSaveChooser();msg('保存先へ渡しました');return}}catch(e2){if(e2?.name==='AbortError'){msg('保存をキャンセルしました');return}}downloadKmzBlob(blob,filename);closeSaveChooser();msg('通常ダウンロードで保存しました')}};download.onclick=()=>{downloadKmzBlob(blob,filename);closeSaveChooser();msg('ダウンロードしました')};close.onclick=()=>{closeSaveChooser();msg('保存をキャンセルしました')}}
async function exportKmz(){closeMenus();closeSaveChooser();msg('KMZを準備中…',0);const kml=buildMyMapsKml();let zip;if(sourceZip){const raw=await sourceZip.generateAsync({type:'uint8array'});zip=await JSZip.loadAsync(raw)}else zip=new JSZip();zip.file(sourceKmlPath||'doc.kml',kml);const bytes=await zip.generateAsync({type:'uint8array',compression:'DEFLATE'}),filename=sourceName+'_creative.kmz',blob=new Blob([bytes],{type:'application/vnd.google-earth.kmz'});showSaveChooser(blob,filename);msg('保存先を選んでください',0)}$('save').onclick=exportKmz;"""
          if s.count(old)!=1:
              raise SystemExit(f'expected old export block once, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('creative/index.html').read_text()
          m=re.search(r'<script>\s*(\(\(\)=>\{.*?\}\)\(\);)\s*</script>',s,re.S)
          if not m: raise SystemExit('inline app script not found')
          Path('/tmp/creative-app.js').write_text(m.group(1))
          PY
          node --check /tmp/creative-app.js
      - name: Commit exact patch
        run: |
          test "$(git diff --name-only)" = "creative/index.html"
          git config user.name "creative-lab-bot"
          git config user.email "creative-lab-bot@users.noreply.github.com"
          git add creative/index.html
          git commit -m "Add mobile save destination chooser for KMZ"
          git push origin HEAD:agent/creative-preserve-kml-export
