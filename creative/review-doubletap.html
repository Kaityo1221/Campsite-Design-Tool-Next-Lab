<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>CREATIVE MODE | Double Tap Review</title>
</head>
<body>
<script>
(async()=>{
  const review='https://raw.githubusercontent.com/Kaityo1221/Campsite-Design-Tool-Next-Lab/agent/creative-dev-batch/creative/review-release-notes.html';
  const res=await fetch(review,{cache:'no-store'});
  if(!res.ok){document.body.textContent='レビュー画面の読み込みに失敗しました。';return;}
  let src=await res.text();
  const anchor="html=html.replace('ファイルを選択してください。','編集するCSV / KMZを選択してください。');";
  const extra=`\n  /* Safe mobile double-tap zoom. POI / shapes / UI are excluded. */\n  html=html.replace(\"const map=L.map('map',{zoomControl:false}).setView\",\"const map=L.map('map',{zoomControl:false,doubleClickZoom:false}).setView\");\n  html=html.replace(\"const circleRenderer=L.canvas({padding:.5,pane:'distance'});\",\`\n  const unsafeDoubleTapTarget=t=>!!(t&&t.closest&&t.closest('.leaflet-marker-icon,.leaflet-interactive,button,input,textarea,select,a,.panel,.toolmenu,.bottom-bar,.save,.toolbox,.leaflet-popup'));\n  (()=>{\n    const el=map.getContainer();\n    let startX=0,startY=0,moved=false,lastTapAt=0,lastX=0,lastY=0;\n    const MAX_MOVE=10,MAX_GAP=340,MAX_DISTANCE=28;\n    el.addEventListener('touchstart',e=>{\n      if(e.touches.length!==1){moved=true;return}\n      const t=e.touches[0];startX=t.clientX;startY=t.clientY;moved=false;\n    },{passive:true});\n    el.addEventListener('touchmove',e=>{\n      if(e.touches.length!==1){moved=true;return}\n      const t=e.touches[0];\n      if(Math.hypot(t.clientX-startX,t.clientY-startY)>MAX_MOVE)moved=true;\n    },{passive:true});\n    el.addEventListener('touchend',e=>{\n      if(moved||e.changedTouches.length!==1)return;\n      const t=e.changedTouches[0];\n      const target=document.elementFromPoint(t.clientX,t.clientY);\n      if(unsafeDoubleTapTarget(target)){lastTapAt=0;return}\n      const now=Date.now(),gap=now-lastTapAt,dist=Math.hypot(t.clientX-lastX,t.clientY-lastY);\n      if(lastTapAt&&gap<=MAX_GAP&&dist<=MAX_DISTANCE){\n        lastTapAt=0;\n        const rect=el.getBoundingClientRect();\n        const point=L.point(t.clientX-rect.left,t.clientY-rect.top);\n        const ll=map.containerPointToLatLng(point);\n        const z=Math.min(map.getZoom()+1,map.getMaxZoom());\n        map.setView(ll,z,{animate:true});\n        return;\n      }\n      lastTapAt=now;lastX=t.clientX;lastY=t.clientY;\n    },{passive:true});\n  })();\n  map.on('dblclick',e=>{\n    if(unsafeDoubleTapTarget(e.originalEvent?.target))return;\n    const z=Math.min(map.getZoom()+1,map.getMaxZoom());\n    map.setView(e.latlng,z,{animate:true});\n  });\n  const circleRenderer=L.canvas({padding:.5,pane:'distance'});\`);`;
  if(!src.includes(anchor)){document.body.textContent='レビュー画面の更新位置が見つかりません。';return;}
  src=src.replace(anchor,anchor+extra);
  document.open();document.write(src);document.close();
})().catch(()=>{document.body.textContent='レビュー画面の読み込みに失敗しました。';});
</script>
</body>
</html>
