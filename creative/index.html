async function readFile(file){sourceName=file.name.replace(/\.(kmz|kml|zip)$/i,'')||'campsite';const ext=file.name.split('.').pop().toLowerCase();if(ext==='kml')return await file.text();if(!['kmz','zip'].includes(ext))throw Error('KMZ / KML / ZIP を選択してください');const zip=await JSZip.loadAsync(await file.arrayBuffer()),name=Object.keys(zip.files).find(n=>/doc\.kml$/i.test(n))||Object.keys(zip.files).find(n=>/\.kml$/i.test(n));if(!name)throw Error('KMLが見つかりません');return await zip.file(name).async('text')}
function folder(pm){let n=pm.parentElement;while(n){if(n.localName==='Folder'){const x=[...n.children].find(e=>e.localName==='name');return x?.textContent?.trim()||''}n=n.parentElement}return''}function child(pm,t){return[...pm.children].find(x=>x.localName===t)?.textContent?.trim()||''}
function parse(kml){records=[];const doc=new DOMParser().parseFromString(kml,'application/xml'),bounds=[];[...doc.getElementsByTagNameNS('*','Placemark')].forEach(pm=>{const pt=pm.getElementsByTagNameNS('*','Point')[0],co=pt?.getElementsByTagNameNS('*','coordinates')[0];if(!co)return;const a=co.textContent.trim().split(',').map(Number);if(!Number.isFinite(a[0])||!Number.isFinite(a[1]))return;const title=child(pm,'name')||'名称なし',f=folder(pm),layer=inferLayer(f,title),r={id:crypto.randomUUID?.()||String(Math.random()),layer,latlng:[a[1],a[0]],title,memo:'',deleted:false,source:true};records.push(r);bounds.push(r.latlng)});drawAll();if(bounds.length)map.fitBounds(bounds,{padding:[28,28],maxZoom:18});msg(`読込完了：${records.length}地点`,1800)}
function beginEditor(){entry.classList.add('hidden');setTimeout(()=>map.invalidateSize(),50)}entryFile.onchange=()=>{const f=entryFile.files?.[0];if(!f)return;pendingFile=f;$('entryFileName').textContent=f.name;const ok=/\.(kmz|kml|zip)$/i.test(f.name);start.disabled=!ok;start.classList.toggle('ready',ok);$('entryState').textContent=ok?'ファイルを読み込めます。':'KMZ / KML / ZIP を選択してください。'};start.onclick=async()=>{if(!pendingFile)return;try{parse(await readFile(pendingFile));snapshot();beginEditor()}catch(e){$('entryState').textContent=e.message||'読み込み失敗'}};
function restore(){try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(!s)return false;sourceName=s.sourceName||'campsite';records=s.records||[];polygons=s.polygons||[];activeLayer=s.activeLayer||'new-pokestop';circleMode=s.circleMode||'both';drawAll();renderLayerPanel();if(s.center)map.setView(s.center,s.zoom||16);return true}catch{return false}}if(localStorage.getItem(STORE))resume.classList.add('show');resume.onclick=()=>{if(restore()){beginEditor();msg('前回作業を復元しました',1400)}};$('back').onclick=()=>{snapshot();entry.classList.remove('hidden')};
function kesc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}async function exportKmz(){const folders=layerDefs.map(([k,label])=>`<Folder><name>${kesc(label)}</name>${records.filter(r=>r.layer===k&&!r.deleted).map(r=>`<Placemark><name>${kesc(r.title)}</name><description>${kesc(r.memo)}</description><Point><coordinates>${r.latlng[1]},${r.latlng[0]},0</coordinates></Point></Placemark>`).join('')}</Folder>`).join('');const poly=polygons.filter(p=>!p.deleted).map((p,i)=>`<Placemark><name>ポリゴン ${i+1}</name><Polygon><outerBoundaryIs><LinearRing><coordinates>${[...p.points,p.points[0]].map(x=>`${x[1]},${x[0]},0`).join(' ')}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`).join('');const kml=`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${kesc(sourceName)}</name>${folders}<Folder><name>ポリゴン</name>${poly}</Folder></Document></kml>`;const zip=new JSZip();zip.file('doc.kml',kml);const blob=await zip.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=sourceName+'_creative.kmz';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);msg('KMZを書き出しました',1600)}$('save').onclick=exportKmz;
})();
