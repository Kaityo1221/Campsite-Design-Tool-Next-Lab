<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow,noarchive">
<title>CREATIVE MODE | Next Lab</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#382d1d;--paper:#fffaf0;--gold:#d8b766;--edge:#8a6b31}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e8e0cf;color:var(--ink)}
#map{position:fixed;inset:0;z-index:1}.leaflet-control-zoom{display:none!important}.leaflet-control-attribution{font-size:8px!important}
.crosshair{position:fixed;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);z-index:600;pointer-events:none}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#7b4d00;box-shadow:0 0 0 2px rgba(255,255,255,.9)}.crosshair:before{width:2px;height:46px;left:22px}.crosshair:after{height:2px;width:46px;top:22px}.crosshair i{position:absolute;left:17px;top:17px;width:12px;height:12px;border:3px solid #7b4d00;border-radius:50%;background:white}
.lab{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top));z-index:1000;width:46px;height:46px;border:1px solid var(--edge);border-radius:13px;background:rgba(255,253,247,.97);box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:21px}.map-toggle{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:1000;min-height:42px;padding:0 12px;border:1px solid var(--edge);border-radius:12px;background:rgba(255,253,247,.97);color:var(--ink);font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.status{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:900;max-width:52vw;padding:7px 11px;border-radius:999px;background:rgba(59,49,37,.9);color:#fff8e8;font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{position:fixed;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:1000;width:132px;display:flex;flex-direction:column;gap:7px}.controls button{min-height:44px;border:1px solid var(--edge);border-radius:14px;background:rgba(255,253,247,.97);color:var(--ink);font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.18)}#place{background:var(--gold);color:#34260e}
.drawer{position:fixed;left:10px;top:calc(66px + env(safe-area-inset-top));z-index:1100;width:min(270px,78vw);padding:10px;border:1px solid rgba(73,57,30,.3);border-radius:16px;background:rgba(59,49,37,.94);box-shadow:0 8px 26px rgba(0,0,0,.25);display:none}.drawer.open{display:block}.drawer h3{margin:0 0 8px;color:#fff5db;font-size:13px}.drawer button,.drawer label{width:100%;min-height:40px;margin:4px 0;border:1px solid #b89a57;border-radius:11px;background:#fff8e6;color:var(--ink);font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px}.drawer input{display:none}.drawer small{display:block;color:#e7dbc1;font-size:10px;line-height:1.5;margin:7px 2px}
.selection{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:800;max-width:calc(100% - 310px);padding:7px 10px;border-radius:999px;background:rgba(255,253,247,.94);box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}.selection.show{display:block}
@media(max-width:520px){.status{top:calc(64px + env(safe-area-inset-top));max-width:70vw}.selection{left:10px;transform:none;max-width:calc(100% - 164px)}}
</style>
</head>
<body>
<div id="map"></div><div class="crosshair"><i></i></div>
<button id="toolbox" class="lab" aria-label="道具箱">🧰</button>
<div id="status" class="status">KMZ / KMLを読み込んでください</div>
<button id="mapToggle" class="map-toggle">地図切り替え</button>
<div id="drawer" class="drawer">
  <h3>CREATIVE 道具箱</h3>
  <label>📂 KMZ / KMLを読み込む<input id="file" type="file" accept=".kmz,.kml,.zip"></label>
  <button id="move">🎯 選択POIを十字へ移動</button>
  <button id="delete">🗑 選択POIを削除</button>
  <button id="undo">↶ 戻る</button>
  <button id="redo">↷ 進む</button>
  <button id="export">💾 KMZを書き出す</button>
  <small>Next Lab専用。中央の十字を基準に配置します。50m円は自動表示します。</small>
</div>
<div class="controls"><button id="type">ポケストップ</button><button id="place">＋ 設置</button></div>
<div id="selection" class="selection"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{'use strict';
const R=50,map=L.map('map',{zoomControl:false}).setView([35.6812,139.7671],16);map.attributionControl.setPosition('bottomleft');
const base=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const aerial=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri'});
const data=L.layerGroup().addTo(map);let aerialOn=false,xmlDoc=null,sourceName='campsite',records=[],selected=null,type='pokestop';const undo=[],redo=[];
const $=id=>document.getElementById(id),status=$('status'),sel=$('selection'),drawer=$('drawer');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dist(a,b){return map.distance(L.latLng(a),L.latLng(b));}function label(t){return t==='gym'?'ジム':t==='power'?'パワースポット':'ポケストップ';}
function folder(pm){let n=pm.parentElement;while(n){if(n.localName==='Folder'){const x=[...n.children].find(e=>e.localName==='name');return x?.textContent?.trim()||'';}n=n.parentElement;}return'';}
function text(pm,tag){const e=[...pm.children].find(x=>x.localName===tag);return e?.textContent?.trim()||'';}
function added(folder,name){return /追加|追加予定|追加希望|追加候補|候補|新設|add|planned|candidate|proposed/i.test(folder+' '+name)}
function inferredType(folder,name){const h=(folder+' '+name).toLowerCase();if(/ジム|\bgym\b/.test(h))return'gym';if(/パワー|power/.test(h))return'power';return'pokestop';}
function drawRecord(r){const isAdd=r.added||r.isNew,c=isAdd?'#d58b00':'#375f87',f=isAdd?'#ffd35c':'#78b9ed';r.circle=L.circle(r.latlng,{radius:R,color:c,weight:2,opacity:.7,fillColor:f,fillOpacity:.035,interactive:false,dashArray:isAdd?'6 5':null}).addTo(data);r.marker=L.circleMarker(r.latlng,{radius:isAdd?9:7,weight:3,color:c,fillColor:f,fillOpacity:.92}).addTo(data);r.marker.bindTooltip(r.name||label(r.type));r.marker.on('click',()=>select(r));}
function select(r){if(selected?.marker)selected.marker.setStyle({weight:3});selected=r;r.marker.setStyle({weight:6});sel.textContent='選択中：'+(r.name||label(r.type));sel.classList.add('show');map.panTo(r.latlng);}
function setPos(r,p){r.latlng=[p[0],p[1]];r.marker.setLatLng(r.latlng);r.circle.setLatLng(r.latlng);if(selected===r)sel.textContent='選択中：'+(r.name||label(r.type));}
function nearby(p,exclude){let m=Infinity;for(const r of records){if(r===exclude||r.deleted)continue;m=Math.min(m,dist(p,r.latlng));}status.textContent=m<R?'⚠ 50m未満：最短 '+m.toFixed(1)+'m':'● 50m以上を確保';}
map.on('move',()=>nearby([map.getCenter().lat,map.getCenter().lng],selected));
function place(){if(!xmlDoc){status.textContent='先にKMZ / KMLを読み込んでください';return}const c=map.getCenter(),r={name:label(type)+' 追加',folder:'追加希望POI',latlng:[c.lat,c.lng],original:null,added:true,isNew:true,type,deleted:false};records.push(r);drawRecord(r);select(r);undo.push({k:'add',r});redo.length=0;nearby(r.latlng,r);}
function move(){if(!selected||selected.deleted){status.textContent='先にPOIを選択してください';return}const from=[...selected.latlng],c=map.getCenter(),to=[c.lat,c.lng];undo.push({k:'move',r:selected,from,to});redo.length=0;setPos(selected,to);nearby(to,selected);}
function del(){if(!selected||selected.deleted){status.textContent='先にPOIを選択してください';return}selected.deleted=true;data.removeLayer(selected.marker);data.removeLayer(selected.circle);undo.push({k:'delete',r:selected});redo.length=0;sel.classList.remove('show');selected=null;status.textContent='削除しました';}
function restore(r){r.deleted=false;r.marker.addTo(data);r.circle.addTo(data);select(r)}
function doUndo(){const a=undo.pop();if(!a)return;if(a.k==='add'){a.r.deleted=true;data.removeLayer(a.r.marker);data.removeLayer(a.r.circle);if(selected===a.r){selected=null;sel.classList.remove('show')}}else if(a.k==='move')setPos(a.r,a.from);else if(a.k==='delete')restore(a.r);redo.push(a)}
function doRedo(){const a=redo.pop();if(!a)return;if(a.k==='add')restore(a.r);else if(a.k==='move')setPos(a.r,a.to);else if(a.k==='delete'){a.r.deleted=true;data.removeLayer(a.r.marker);data.removeLayer(a.r.circle);if(selected===a.r){selected=null;sel.classList.remove('show')}}undo.push(a)}
async function read(file){sourceName=file.name.replace(/\.(kmz|kml|zip)$/i,'')||'campsite';if(/\.kml$/i.test(file.name))return await file.text();const zip=await JSZip.loadAsync(await file.arrayBuffer()),names=Object.keys(zip.files);const name=names.find(n=>/doc\.kml$/i.test(n))||names.find(n=>/\.kml$/i.test(n));if(!name)throw Error('KMLが見つかりません');return await zip.file(name).async('text')}
function parse(kml){xmlDoc=new DOMParser().parseFromString(kml,'application/xml');if(xmlDoc.querySelector('parsererror'))throw Error('KMLを解析できません');data.clearLayers();records=[];selected=null;sel.classList.remove('show');const bounds=[];[...xmlDoc.getElementsByTagNameNS('*','Placemark')].forEach(pm=>{const p=pm.getElementsByTagNameNS('*','Point')[0],coord=p?.getElementsByTagNameNS('*','coordinates')[0];if(!coord)return;const a=coord.textContent.trim().split(',').map(Number);if(!Number.isFinite(a[0])||!Number.isFinite(a[1]))return;const name=text(pm,'name')||'名称なし',fo=folder(pm),r={pm,coord,name,folder:fo,latlng:[a[1],a[0]],original:[a[1],a[0]],added:added(fo,name),isNew:false,type:inferredType(fo,name),deleted:false};records.push(r);drawRecord(r);bounds.push(r.latlng)});if(bounds.length)map.fitBounds(bounds,{padding:[24,24],maxZoom:18});status.textContent='読込完了：'+records.length+'地点 ／ 50m円表示';}
function buildExportXml(){const doc=new DOMParser().parseFromString(new XMLSerializer().serializeToString(xmlDoc),'application/xml');const src=[...doc.getElementsByTagNameNS('*','Placemark')].filter(pm=>pm.getElementsByTagNameNS('*','Point')[0]);let i=0;for(const r of records.filter(x=>!x.isNew)){const pm=src[i++];if(!pm)continue;if(r.deleted){pm.parentNode?.removeChild(pm);continue}const c=pm.getElementsByTagNameNS('*','coordinates')[0];if(c)c.textContent=r.latlng[1]+','+r.latlng[0]+',0'}const documentNode=doc.getElementsByTagNameNS('*','Document')[0]||doc.documentElement;for(const r of records.filter(x=>x.isNew&&!x.deleted)){const pm=doc.createElementNS('http://www.opengis.net/kml/2.2','Placemark'),n=doc.createElementNS('http://www.opengis.net/kml/2.2','name'),d=doc.createElementNS('http://www.opengis.net/kml/2.2','description'),p=doc.createElementNS('http://www.opengis.net/kml/2.2','Point'),c=doc.createElementNS('http://www.opengis.net/kml/2.2','coordinates');n.textContent=r.name;d.textContent='CREATIVE MODE追加 / '+label(r.type);c.textContent=r.latlng[1]+','+r.latlng[0]+',0';p.appendChild(c);pm.append(n,d,p);documentNode.appendChild(pm)}return new XMLSerializer().serializeToString(doc)}
async function exportKmz(){if(!xmlDoc)return;const zip=new JSZip();zip.file('doc.kml',buildExportXml());const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=sourceName+'_creative.kmz';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);status.textContent='KMZを書き出しました'}
$('toolbox').onclick=()=>drawer.classList.toggle('open');$('mapToggle').onclick=()=>{if(aerialOn){map.removeLayer(aerial);base.addTo(map);aerialOn=false;$('mapToggle').textContent='地図切り替え'}else{map.removeLayer(base);aerial.addTo(map);aerialOn=true;$('mapToggle').textContent='航空写真 → 地図'}};$('type').onclick=()=>{type=type==='pokestop'?'gym':type==='gym'?'power':'pokestop';$('type').textContent=label(type)};$('place').onclick=place;$('move').onclick=move;$('delete').onclick=del;$('undo').onclick=doUndo;$('redo').onclick=doRedo;$('export').onclick=exportKmz;$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;status.textContent='読込中…';try{parse(await read(f));drawer.classList.remove('open')}catch(err){console.error(err);status.textContent='⚠ '+(err.message||'読込失敗')}};
})();
</script>
</body></html>
