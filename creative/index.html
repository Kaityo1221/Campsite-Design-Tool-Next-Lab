te;inset:0;width:100%;height:100%;opacity:0}.start,.resume{min-height:58px;border:1px solid rgba(255,239,200,.5);border-radius:20px;font-weight:950;letter-spacing:.04em}.start{background:rgba(46,39,29,.76);color:rgba(255,248,232,.55)}.start.ready{background:linear-gradient(180deg,#f3d77f 0%,#ddb13e 52%,#c58c1f 100%);color:#37270c;border-color:#fff0b1;box-shadow:0 0 0 1px rgba(255,244,197,.68),0 0 34px rgba(237,190,73,.78),0 12px 28px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.5);animation:goldGlow 1.7s ease-in-out infinite}.start.ready:before{content:"✣";margin-right:9px;color:#fff8df}.resume{display:none;background:rgba(31,28,24,.86);color:#fff8e8;box-shadow:0 8px 22px rgba(0,0,0,.28)}.resume.show{display:block}.entry-state{min-height:16px;color:#fff;font-size:11px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.9)}.entry-note{font-size:10px;color:rgba(255,248,232,.82);text-shadow:0 2px 8px #000}.lablink{display:inline-block;margin-top:8px;color:#f0d38d;text-decoration:none;font-size:12px;font-weight:900;text-shadow:0 3px 9px #000}.transition{position:fixed;inset:0;z-index:5100;display:none;place-items:center;background:radial-gradient(circle,rgba(255,222,128,.92) 0%,rgba(196,139,35,.72) 20%,rgba(49,37,23,.96) 72%);color:#fff9e7;font-size:clamp(22px,7vw,44px);font-weight:950;letter-spacing:.12em;text-align:center}.transition.go{display:grid;animation:startFlash .62s ease-out forwards}@keyframes startFlash{0%{opacity:0;transform:scale(.94)}35%{opacity:1}100%{opacity:0;transform:scale(1.06)}}@keyframes goldGlow{50%{box-shadow:0 0 0 1px rgba(255,244,197,.76),0 0 46px rgba(237,190,73,.96),0 12px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.55)}}@media(max-width:520px){.entry-panel{margin-top:14px}.entry-title{font-size:clamp(34px,11vw,48px)}.entry-copy{font-size:clamp(14px,4.7vw,19px)}.selection{left:10px;transform:none;max-width:calc(100% - 164px)}}@media(max-height:650px){.entry-inner{padding-top:calc(10px + env(safe-area-inset-top))}.entry-title{font- <div id="entry" class="entry"><div class="entry-inner"><h1 class="entry-title">CREATIVE MODE</h1><p class="entry-copy">地図をひらいて、キャンプサイトを描こう。</p><div class="entry-panel"><label class="filebar"><span class="icon">📂</span><strong>KMZ / KMLを選択</strong><span id="entryFileName" class="filename">未選択</span><input id="entryFile" type="file" accept=".kmz,.kml,.zip"></label><button id="startButton" class="start" type="button" disabled>CREATIVE MODEを開始</button><button id="resumeButton" class="resume" type="button">前回の続きから</button><div id="entryState" class="entry-state">ファイルを選択してください。</div><div class="entry-note">選択したファイルは端末内だけで処理します。編集中の状態は自動保存されます。</div><a class="lablink" href="../index.html">← Next Labへ戻る</a></div></div></div><div id="transition" class="transition">CREATIVE MODE</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{'use strict';const R=50,STORE='next-lab-creative-autosave-v2';const map=L.map('map',{zoomControl:false}).setView([35.6812,139.7671],16);map.attributionControl.setPosition('bottomleft');const base=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(map),aerial=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri'}),data=L.layerGroup().addTo(map);let aerialOn=false,xmlText='',xmlDoc=null,sourceName='campsite',records=[],selected=null,type='pokestop',pendingFile=null;const undo=[],redo=[],$=id=>document.getElementById(id),status=$('status'),sel=$('selection'),drawer=$('drawer'),entry=$('entry'),entryFile=$('entryFile'),entryFileName=$('entryFileName'),start=$('startButton'),resume=$('resumeButton'),entryState=$('entryState'),transition=$('transition');function dist(a,b){return map.distance(L.latLng(a),L.latLng(b))}function label(t){return t==='gym'?'ジム':t==='power'?'パワースポット':'ポケストップ'}function folder(pm){let n=pm.parentElement;while(n){if(n.localName==='Folder'){const x=[...n.children].find(e=>e.localName==='name');return x?.textContent?.trim()||''}n=n.parentElement}return''}function text(pm,tag){const e=[...pm.children].find(x=>x.localName===tag);return e?.textContent?.trim()||''}function added(f,n){return /追加|追加予定|追加希望|追加候補|候補|新設|add|planned|candidate|proposed/i.test(f+' '+n)}function inferredType(f,n){const h=(f+' '+n).toLowerCase();if(/ジム|\bgym\b/.test(h))return'gym';if(/パワー|power/.test(h))return'power';return'pokestop'}function snapshot(){try{localStorage.setItem(STORE,JSON.stringify({sourceName,xmlText,records:records.map(r=>({name:r.name,folder:r.folder,latlng:r.latlng,original:r.original,added:r.added,isNew:r.isNew,type:r.type,deleted:r.deleted})),center:[map.getCenter().lat,map.getCenter().lng],zoom:map.getZoom(),savedAt:Date.now()}));resume.classList.add('show')}catch(e){console.warn(e)}}function drawRecord(r){if(r.deleted)return;const isAdd=r.added||r.isNew,c=isAdd?'#d58b00':'#375f87',f=isAdd?'#ffd35c':'#78b9ed';r.circle=L.circle(r.latlng,{radius:R,color:c,weight:2,opacity:.7,fillColor:f,fillOpacity:.035,interactive:false,dashArray:isAdd?'6 5':null}).addTo(data);r.marker=L.circleMarker(r.latlng,{radius:isAdd?9:7,weight:3,color:c,fillColor:f,fillOpacity:.92}).addTo(data);r.marker.bindTooltip(r.name||label(r.type));r.marker.on('click',()=>select(r))}function select(r){if(selected?.marker)selected.marker.setStyle({weight:3});selected=r;if(r.marker)r.marker.setStyle({weight:6});sel.textContent='選択中：'+(r.name||label(r.type));sel.classList.add('show');map.panTo(r.latlng)}function setPos(r,p){r.latlng=[p[0],p[1]];r.marker?.setLatLng(r.latlng);r.circle?.setLatLng(r.latlng);snapshot()}function nearby(p,exclude){let m=Infinity;for(const r of records){if(r===exclude||r.deleted)continue;m=Math.min(m,dist(p,r.latlng))}status.textContent=m<R?'⚠ 50m未満：最短 '+m.toFixed(1)+'m':'● 50m以上を確保'}map.on('move',()=>nearby([map.getCenter().lat,map.getCenter().lng],selected));function place(){if(!xmlDoc){status.textContent='先にファイルを読み込んでください';return}const c=map.getCenter(),r={name:label(type)+' 追加',folder:'追加希望POI',latlng:[c.lat,c.lng],original:null,added:true,isNew:true,type,deleted:false};records.push(r);drawRecord(r);select(r);undo.push({k:'add',r});redo.length=0;nearby(r.latlng,r);snapshot()}function move(){if(!selected||selected.deleted){status.textContent='先にPOIを選択してください';return}const from=[...selected.latlng],c=map.getCenter(),to=[c.lat,c.lng];undo.push({k:'move',r:selected,from,to});redo.length=0;setPos(selected,to);nearby(to,selected)}function del(){if(!selected||selected.deleted){status.textContent='先にPOIを選択してください';return}selected.deleted=true;data.removeLayer(selected.marker);data.removeLayer(selected.circle);undo.push({k:'delete',r:selected});redo.length=0;sel.classList.remove('show');selected=null;status.textContent='削除しました';snapshot()}function restore(r){r.deleted=false;drawRecord(r);select(r);snapshot()}function doUndo(){const a=undo.pop();if(!a)return;if(a.k==='add'){a.r.deleted=true;data.removeLayer(a.r.marker);data.removeLayer(a.r.circle);if(selected===a.r){selected=null;sel.classList.remove('show')}}else if(a.k==='move')setPos(a.r,a.from);else if(a.k==='delete')restore(a.r);redo.push(a);snapshot()}function doRedo(){const a=redo.pop();if(!a)return;if(a.k==='add')restore(a.r);else if(a.k==='move')setPos(a.r,a.to);else if(a.k==='delete'){a.r.deleted=true;data.removeLayer(a.r.marker);data.removeLayer(a.r.circle);if(selected===a.r){selected=null;sel.classList.remove('show')}}undo.push(a);snapshot()}async function read(file){sourceName=file.name.replace(/\.(kmz|kml|zip)$/i,'')||'campsite';if(/\.kml$/i.test(file.name))return await file.text();const zip=await JSZip.loadAsync(await file.arrayBuffer()),names=Object.keys(zip.files),name=names.find(n=>/doc\.kml$/i.test(n))||names.find(n=>/\.kml$/i.test(n));if(!name)throw Error('KMLが見つかりません');return await zip.file(name).async('text')}function parse(kml){xmlText=kml;xmlDoc=new DOMParser().parseFromString(kml,'application/xml');if(xmlDoc.querySelector('parsererror'))throw Error('KMLを解析できません');data.clearLayers();records=[];selected=null;sel.classList.remove('show');const bounds=[];[...xmlDoc.getElementsByTagNameNS('*','Placemark')].forEach(pm=>{const p=pm.getElementsByTagNameNS('*','Point')[0],coord=p?.getElementsByTagNameNS('*','coordinates')[0];if(!coord)return;const a=coord.textContent.trim().split(',').map(Number);if(!Number.isFinite(a[0])||!Number.isFinite(a[1]))return;const name=text(pm,'name')||'名称なし',fo=folder(pm),r={name,folder:fo,latlng:[a[1],a[0]],original:[a[1],a[0]],added:added(fo,name),isNew:false,type:inferredType(fo,name),deleted:false};records.push(r);drawRecord(r);bounds.push(r.latlng)});if(bounds.length)map.fitBounds(bounds,{padding:[24,24],maxZoom:18});status.textContent='読込完了：'+records.length+'地点 ／ 50m円表示';snapshot()}function restoreSnapshot(){const s=JSON.parse(localStorage.getItem(STORE)||'null');if(!s||!s.xmlText)return false;sourceName=s.sourceName||'campsite';xmlText=s.xmlText;xmlDoc=new DOMParser().parseFromString(xmlText,'application/xml');data.clearLayers();records=(s.records||[]).map(r=>({...r}));records.forEach(drawRecord);if(s.center)map.setView(s.center,s.zoom||16);status.textContent='自動保存データを復元しました';return true}function buildExportXml(){const doc=new DOMParser().parseFromString(xmlText,'application/xml'),src=[...doc.getElementsByTagNameNS('*','Placemark')].filter(pm=>pm.getElementsByTagNameNS('*','Point')[0]);let i=0;for(const r of records.filter(x=>!x.isNew)){const pm=src[i++];if(!pm)continue;if(r.deleted){pm.parentNode?.removeChild(pm);continue}const c=pm.getElementsByTagNameNS('*','coordinates')[0];if(c)c.textContent=r.latlng[1]+','+r.latlng[0]+',0'}const dn=doc.getElementsByTagNameNS('*','Document')[0]||doc.documentElement;for(const r of records.filter(x=>x.isNew&&!x.deleted)){const pm=doc.createElementNS('http://www.opengis.net/kml/2.2','Placemark'),n=doc.createElementNS('http://www.opengis.net/kml/2.2','name'),d=doc.createElementNS('http://www.opengis.net/kml/2.2','description'),p=doc.createElementNS('http://www.opengis.net/kml/2.2','Point'),c=doc.createElementNS('http://www.opengis.net/kml/2.2','coordinates');n.textContent=r.name;d.textContent='CREATIVE MODE追加 / '+label(r.type);c.textContent=r.latlng[1]+','+r.latlng[0]+',0';p.appendChild(c);pm.append(n,d,p);dn.appendChild(pm)}return new XMLSerializer().serializeToString(doc)}async function exportKmz(){if(!xmlDoc){status.textContent='保存するデータがありません';return}snapshot();const zip=new JSZip();zip.file('doc.kml',buildExportXml());const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=sourceName+'_creative.kmz';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);status.textContent='💾 KMZを保存しました'}function enterMap(){entry.classList.add('hidden');transition.classList.add('go');setTimeout(()=>{transition.classList.remove('go');map.invalidateSize()},650)}entryFile.onchange=()=>{pendingFile=entryFile.files?.[0]||null;entryFileName.textContent=pendingFile?.name||'未選択';start.disabled=!pendingFile;start.classList.toggle('ready',!!pendingFile);entryState.textContent=pendingFile?'選択済み。STARTできます。':'ファイルを選択してください。'};start.onclick=async()=>{if(!pendingFile)return;start.disabled=true;entryState.textContent='読み込み中…';try{parse(await read(pendingFile));enterMap()}catch(e){entryState.textContent='⚠ '+(e.message||'読み込みに失敗しました');start.disabled=false}};resume.onclick=()=>{try{if(restoreSnapshot())enterMap();else entryState.textContent='復元できるデータがありません。'}catch(e){entryState.textContent='復元に失敗しました。'}};$('back').onclick=()=>{snapshot();entry.classList.remove('hidden');resume.classList.add('show');entryState.textContent='編集状態を自動保存しました。'};$('toolbox').onclick=()=>drawer.classList.toggle('open');$('mapToggle').onclick=()=>{if(aerialOn){map.removeLayer(aerial);base.addTo(map);aerialOn=false;$('mapToggle').textContent='地図切り替え'}else{map.removeLayer(base);aerial.addTo(map);aerialOn=true;$('mapToggle').textContent='航空写真 → 地図'}};$('type').onclick=()=>{type=type==='pokestop'?'gym':type==='gym'?'power':'pokestop';$('type').textContent=label(type)};$('place').onclick=place;$('move').onclick=move;$('delete').onclick=del;$('undo').onclick=doUndo;$('redo').onclick=doRedo;$('save').onclick=exportKmz;if(localStorage.getItem(STORE))resume.classList.add('show');setInterval(()=>{if(entry.classList.contains('hidden')&&xmlDoc)snapshot()},3000);window.addEventListener('pagehide',()=>{if(xmlDoc)snapshot()});})();
