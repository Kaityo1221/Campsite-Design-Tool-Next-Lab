  const csvHelpers=`
function csvRows(text){
  const rows=[];let row=[],value='',quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"'&&quoted&&next==='"'){value+='"';i++;continue}
    if(ch==='"'){quoted=!quoted;continue}
    if(ch===','&&!quoted){row.push(value);value='';continue}
    if((ch==='\\n'||ch==='\\r')&&!quoted){if(ch==='\\r'&&next==='\\n')i++;row.push(value);if(row.some(x=>String(x).trim()!==''))rows.push(row);row=[];value='';continue}
    value+=ch;
  }
  row.push(value);if(row.some(x=>String(x).trim()!==''))rows.push(row);return rows;
}
function csvPick(obj,keys){for(const k of keys){if(obj[k]!==undefined&&obj[k]!==null&&String(obj[k]).trim()!=='')return obj[k]}return''}
function csvLayer(fileName,title,type,status){
  const h=(fileName+' '+title+' '+type+' '+status).toLowerCase(),fresh=/追加|新規|候補|add|new|planned/.test(h);
  if(/gym|ジム/.test(h))return fresh?'new-gym':'existing-gym';

  return fresh?'new-pokestop':'existing-pokestop';
}

  for(const file of files){
    const rows=csvRows(await file.text());if(rows.length<2)continue;
    const headers=rows[0].map(x=>String(x||'').trim());
    for(const row of rows.slice(1)){
      const obj={};headers.forEach((h,i)=>obj[h]=row[i]??'');
      const title=String(csvPick(obj,['title','Title','name','Name','wayspotTitle','Wayspot Title','タイトル','名前'])||row[0]||'名称なし').trim()||'名称なし';

      const type=String(csvPick(obj,['gameEntity','GameEntity','game_entity','Game Entity','type','Type','category','Category','種類'])||'');
      const status=String(csvPick(obj,['gameStatus','GameStatus','game_status','Game Status','status','Status'])||'');

      const key=guid?'g:'+guid:'c:'+lat.toFixed(7)+','+lng.toFixed(7)+':'+title;
      if(seen.has(key))continue;seen.add(key);
      const layer=csvLayer(file.name,title,type,status);
      const r={id:crypto.randomUUID?.()||String(Math.random()),layer,latlng:[lat,lng],title,memo:'',deleted:false,source:true};
      records.push(r);bounds.push(r.latlng);
    }
  }
  polygonVisible=false;drawAll();renderLayerPanel();if(bounds.length)map.fitBounds(bounds,{padding:[28,28],maxZoom:18});
  return records.length;
}
function exportLayerCount(){
  let count=layerDefs.filter(([k])=>records.some(r=>r.layer===k&&!r.deleted)).length;
  if(polygons.some(p=>!p.deleted))count++;
  return count;
}
function estimatedKmlBytes(){try{return new TextEncoder().encode(buildMyMapsKml()).length}catch{return 0}}

  html=html.replace('function beginEditor(){',csvHelpers+'\nfunction beginEditor(){');

  if(!html.includes(oldFlow)){document.body.textContent='CSV / KMZレビューの更新位置が見つかりません。';return;}

  const patch=`<style>

  .lab-release-modal{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,8,6,.52);backdrop-filter:blur(4px)}.lab-release-modal.open{display:flex}.lab-release-card{width:min(100%,430px);padding:18px;border:1px solid rgba(255,239,200,.55);border-radius:22px;background:rgba(38,33,25,.90);color:#fff8e8;box-shadow:0 18px 50px rgba(0,0,0,.38);text-align:left}.lab-release-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px}.lab-release-badge{padding:4px 7px;border-radius:999px;background:linear-gradient(180deg,#f3d77f,#c58c1f);color:#37270c;font-size:9px;font-weight:950}.lab-release-title{font-size:13px;font-weight:950}.lab-release-ver{font-size:10px;font-weight:850;color:#f7dfaa}.lab-release-card ul{margin:15px 0 8px;padding-left:20px}.lab-release-card li{margin:6px 0;font-size:12px;line-height:1.55;font-weight:800}.lab-release-close{width:100%;min-height:42px;margin-top:14px;border:1px solid rgba(255,239,200,.42);border-radius:12px;background:rgba(255,248,232,.10);color:#fff8e8;font-size:11px;font-weight:900}
  .save-name-modal,.file-help-modal{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,8,6,.52);backdrop-filter:blur(3px)}.save-name-modal.open,.file-help-modal.open{display:flex}.save-name-card,.file-help-card{width:min(100%,420px);padding:18px;border:1px solid #b89a57;border-radius:20px;background:#fffdf7;color:#382d1d;box-shadow:0 18px 50px rgba(0,0,0,.35)}.save-name-card h2,.file-help-card h2{margin:0 0 6px;font-size:20px}.save-name-card p,.file-help-card p{margin:0 0 14px;color:#71634e;font-size:12px;line-height:1.6}.save-name-row{display:grid;grid-template-columns:1fr auto;align-items:center;border:2px solid #d7c394;border-radius:14px;background:#fff;padding:0 12px}.save-name-row:focus-within{border-color:#c58c1f}.save-name-row input{width:100%;height:52px;border:0;outline:0;background:transparent;font-size:16px;font-weight:800;min-width:0}.save-name-ext{font-weight:900;color:#8a6b31}.save-name-actions{display:grid;grid-template-columns:1fr 1.35fr;gap:9px;margin-top:14px}.save-name-actions button,.file-help-close{min-height:48px;border-radius:13px;font:inherit;font-weight:900}.save-name-cancel{border:1px solid #c8bda8;background:#fff;color:#5d5141}.save-name-ok,.file-help-close{border:1px solid #8a6b31;background:linear-gradient(180deg,#f3d77f,#c58c1f);color:#37270c}.file-help-close{width:100%}
  </style>
  <div id="saveNameModal" class="save-name-modal"><div class="save-name-card"><h2>ファイル名を決める</h2><p>複数パターンを分けて保存できます。拡張子は自動で <strong>.kmz</strong> になります。</p><div class="save-name-row"><input id="saveNameInput" autocomplete="off" maxlength="100"><span class="save-name-ext">.kmz</span></div><div class="save-name-actions"><button id="saveNameCancel" class="save-name-cancel">キャンセル</button><button id="saveNameOk" class="save-name-ok">この名前で保存</button></div></div></div>
  <div id="fileHelpModal" class="file-help-modal"><div class="file-help-card"><h2>このファイルは読み込めません</h2><p id="fileHelpText">CSVまたはKMZを選択してください。</p><button id="fileHelpClose" class="file-help-close">OK</button></div></div>
  <script>
  (()=>{'use strict';
    const entry=document.getElementById('entry');
    if(entry){const pill=document.createElement('button');pill.type='button';pill.className='lab-update-pill';pill.innerHTML='<span class="new">NEW</span><span>LAB UPDATE</span><span class="ver">vNext</span>';const modal=document.createElement('div');modal.className='lab-release-modal';modal.innerHTML='<div class="lab-release-card"><div class="lab-release-head"><span class="lab-release-badge">NEW</span><span class="lab-release-title">LAB UPDATE</span><span class="lab-release-ver">vNext</span></div><ul><li>保存時にファイル名を変更できます。</li><li>CSVは複数選択、KMZは1ファイルで読み込めます。</li><li>5MB・10レイヤーのMy Maps上限を事前チェックします。</li></ul><button type="button" class="lab-release-close">閉じる</button></div>';entry.append(pill,modal);const close=modal.querySelector('.lab-release-close');pill.onclick=()=>modal.classList.add('open');close.onclick=()=>{modal.classList.remove('open');localStorage.setItem('next-lab-release-seen-20260820-c','1')};if(localStorage.getItem('next-lab-release-seen-20260820-c')!=='1')modal.classList.add('open')}
    const fi=document.getElementById('entryFile'),help=document.getElementById('fileHelpModal'),helpText=document.getElementById('fileHelpText'),helpClose=document.getElementById('fileHelpClose');if(fi)fi.addEventListener('change',e=>{const files=Array.from(fi.files||[]);if(!files.length||files.every(f=>/[.](csv|kmz)$/i.test(f.name)))return;const f=files.find(x=>!/[.](csv|kmz)$/i.test(x.name));e.preventDefault();e.stopImmediatePropagation();helpText.innerHTML=/[.](mht|mhtml|eml)$/i.test(f.name)?'これは<strong>Google My Mapsのページを保存したファイル</strong>の可能性があります。<br><br>My Mapsから<strong>KMZを書き出して</strong>読み込んでください。':'Creative Modeでは<strong>CSVまたはKMZ</strong>を選択してください。KMLは正式サポート対象外です。';help.classList.add('open')},true);if(helpClose)helpClose.onclick=()=>help.classList.remove('open');
    const save=document.getElementById('save'),sm=document.getElementById('saveNameModal'),input=document.getElementById('saveNameInput'),cancel=document.getElementById('saveNameCancel'),ok=document.getElementById('saveNameOk');if(!save||!sm)return;const original=save.onclick;let desired='';const clean=s=>String(s||'').replace(/[\\\\/:*?\"<>|]/g,'_').replace(/\\.kmz$/i,'').trim();function fallback(){const src=(document.getElementById('entryFileName')?.textContent||'').trim();return clean(src.replace(/\\.(csv|kmz|kml|zip)$/i,'')+'_creative')||'campsite_creative'}save.onclick=()=>{input.value=fallback();sm.classList.add('open')};cancel.onclick=()=>{desired='';sm.classList.remove('open')};ok.onclick=()=>{desired=clean(input.value)||fallback();sm.classList.remove('open');if(typeof original==='function')original.call(save)};const nativeClick=HTMLAnchorElement.prototype.click;HTMLAnchorElement.prototype.click=function(){if(this.download&&desired)this.download=desired+'.kmz';return nativeClick.call(this)};if(navigator.share&&typeof File!=='undefined'){const ns=navigator.share.bind(navigator);try{navigator.share=async data=>{if(desired&&data?.files?.length)data={...data,files:data.files.map(f=>new File([f],desired+'.kmz',{type:f.type,lastModified:f.lastModified}))};return ns(data)}catch{}}
  })();
