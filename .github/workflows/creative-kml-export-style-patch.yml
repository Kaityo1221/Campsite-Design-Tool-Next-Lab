name: creative-kml-export-style-patch

on:
  push:
    branches:
      - agent/creative-dev-patches

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-dev-patches

      - name: Add distinct KML icon styles for My Maps export
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('creative/index.html')
          s=p.read_text()
          old="[...doc.children].filter(x=>x.localName==='Folder').forEach(x=>x.remove());const docName="
          new="[...doc.children].filter(x=>x.localName==='Folder').forEach(x=>x.remove());[...doc.children].filter(x=>x.localName==='Style'&&(x.getAttribute('id')||'').startsWith('creative-')).forEach(x=>x.remove());const exportIcons={'existing-pokestop':'https://maps.google.com/mapfiles/ms/icons/blue-dot.png','existing-gym':'https://maps.google.com/mapfiles/ms/icons/red-dot.png','existing-power':'https://maps.google.com/mapfiles/ms/icons/purple-dot.png','new-pokestop':'https://maps.google.com/mapfiles/kml/pushpin/blue-pushpin.png','new-gym':'https://maps.google.com/mapfiles/kml/pushpin/ylw-pushpin.png','new-power':'https://maps.google.com/mapfiles/kml/pushpin/purple-pushpin.png'};Object.entries(exportIcons).forEach(([k,href])=>{const style=makeEl(xml,'Style'),iconStyle=makeEl(xml,'IconStyle'),scale=makeEl(xml,'scale',k.startsWith('new-')?'1.15':'0.9'),icon=makeEl(xml,'Icon');style.setAttribute('id','creative-'+k);icon.appendChild(makeEl(xml,'href',href));iconStyle.append(scale,icon);style.appendChild(iconStyle);doc.appendChild(style)});const docName="
          if s.count(old)!=1: raise SystemExit(f'document style insertion match count={s.count(old)}')
          s=s.replace(old,new,1)
          old="pm.appendChild(makeEl(xml,'name',r.title||label));if(r.memo)pm.appendChild(makeEl(xml,'description',r.memo));const pt="
          new="pm.appendChild(makeEl(xml,'name',r.title||label));if(r.memo)pm.appendChild(makeEl(xml,'description',r.memo));pm.appendChild(makeEl(xml,'styleUrl','#creative-'+k));const pt="
          if s.count(old)!=1: raise SystemExit(f'placemark styleUrl match count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('creative/index.html').read_text()
          m=re.search(r'<script>\s*(\(\(\)=>\{.*?\}\)\(\);)\s*</script>',s,re.S)
          if not m: raise SystemExit('inline app script not found')
          Path('/tmp/creative-app.js').write_text(m.group(1))
          PY
          node --check /tmp/creative-app.js
          git config user.name "creative-lab-bot"
          git config user.email "creative-lab-bot@users.noreply.github.com"
          git add creative/index.html
          git commit -m "Export distinct game spot styles to KML"
          git push origin HEAD:agent/creative-dev-patches
