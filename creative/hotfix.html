<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>CREATIVE MODE Hotfix</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17130f}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.hotfix-note{position:fixed;right:8px;bottom:8px;z-index:99999;padding:5px 8px;border-radius:8px;background:rgba(35,31,25,.78);color:#fff8e8;font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;pointer-events:none}</style></head><body><iframe id="app"></iframe><div class="hotfix-note">HOTFIX preview v3</div><script>(()=>{const frame=document.getElementById('app');frame.src='./index.html?hotfix='+Date.now();function patch(){try{const w=frame.contentWindow,d=w.document,input=d.getElementById('entryFile'),name=d.getElementById('entryFileName'),start=d.getElementById('startButton'),state=d.getElementById('entryState');if(!input||!name||!start)return false;input.setAttribute('accept','.kmz,.kml,.zip,application/vnd.google-earth.kmz,application/vnd.google-earth.kml+xml,application/zip');if(input.dataset.hotfixBound==='1')return true;input.dataset.hotfixBound='1';const paint=()=>{const f=input.files&&input.files[0];if(!f)return;name.textContent=f.name;const ok=/\.(kmz|kml|zip)$/i.test(f.name);start.disabled=!ok;start.classList.toggle('ready',ok);if(state)state.textContent=ok?'ファイルを読み込めます。':'KMZ / KML / ZIP を選択してください。'};input.addEventListener('input',paint);input.addEventListener('change',paint);return true}catch(e){return false}}frame.addEventListener('load',()=>{let n=0;const timer=setInterval(()=>{n++;if(patch()||n>50)clearInterval(timer)},100)});})();</script></body></html>
