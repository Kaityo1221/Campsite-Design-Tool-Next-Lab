name: creative-embed-colored-existing-icons

on:
  push:
    branches:
      - agent/creative-dev-patches

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-dev-patches

      - name: Embed colored existing spot icons into exported KMZ
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('creative/index.html')
          s=p.read_text()

          old="const exportIcons={'existing-pokestop':'https://maps.google.com/mapfiles/kml/shapes/placemark_circle.png','existing-gym':'https://maps.google.com/mapfiles/kml/shapes/placemark_circle.png','existing-power':'https://maps.google.com/mapfiles/kml/shapes/placemark_circle.png','new-pokestop':'https://maps.google.com/mapfiles/ms/icons/blue-dot.png','new-gym':'https://maps.google.com/mapfiles/ms/icons/yellow-dot.png','new-power':'https://maps.google.com/mapfiles/ms/icons/purple-dot.png'},exportColors={'existing-pokestop':'ffc9893f','existing-gym':'ff5454d8','existing-power':'ffb85686'};"
          new="const exportIcons={'existing-pokestop':'creative-icons/existing-pokestop.png','existing-gym':'creative-icons/existing-gym.png','existing-power':'creative-icons/existing-power.png','new-pokestop':'https://maps.google.com/mapfiles/ms/icons/blue-dot.png','new-gym':'https://maps.google.com/mapfiles/ms/icons/yellow-dot.png','new-power':'https://maps.google.com/mapfiles/ms/icons/purple-dot.png'};"
          if s.count(old)!=1:
              raise SystemExit(f'exportIcons block match count={s.count(old)}')
          s=s.replace(old,new,1)

          tint="if(exportColors[k])iconStyle.appendChild(makeEl(xml,'color',exportColors[k]));"
          if s.count(tint)!=1:
              raise SystemExit(f'tint line match count={s.count(tint)}')
          s=s.replace(tint,'',1)

          needle="zip.file(sourceKmlPath||'doc.kml',kml);const bytes=await zip.generateAsync({type:'uint8array',compression:'DEFLATE'})"
          icons={
            'existing-pokestop':'',
            'existing-gym':'',
            'existing-power':''
          }
          payload="const kmlDir=(sourceKmlPath||'doc.kml').replace(/[^/]+$/,'');const existingIconPngs="+repr(icons).replace(' ', '')+";Object.entries(existingIconPngs).forEach(([name,b64])=>zip.file(kmlDir+'creative-icons/'+name+'.png',b64,{base64:true}));"
          repl="zip.file(sourceKmlPath||'doc.kml',kml);"+payload+"const bytes=await zip.generateAsync({type:'uint8array',compression:'DEFLATE'})"
          if s.count(needle)!=1:
              raise SystemExit(f'export insertion match count={s.count(needle)}')
          s=s.replace(needle,repl,1)
          p.write_text(s)
          PY

          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('creative/index.html').read_text()
          m=re.search(r'<script>\s*(\(\(\)=>\{.*?\}\)\(\);)\s*</script>',s,re.S)
          if not m: raise SystemExit('inline app script not found')
          Path('/tmp/creative-app.js').write_text(m.group(1))
          PY
          node --check /tmp/creative-app.js

          git config user.name "creative-lab-bot"
          git config user.email "creative-lab-bot@users.noreply.github.com"
          git add creative/index.html
          git commit -m "Embed colored existing spot icons in KMZ export"
          git push origin HEAD:agent/creative-dev-patches
