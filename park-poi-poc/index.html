<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Park POI PoC | Campsite Design Tool Next Lab</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#15130f;color:#fff8e8}main{max-width:980px;margin:auto;padding:20px}.badge{display:inline-block;padding:6px 10px;border:1px solid #b58a3d;border-radius:999px;color:#f0cc7b;font-size:12px;font-weight:800}.panel{background:#211d17;border:1px solid #4d4438;border-radius:18px;padding:16px;margin-top:14px}h1{font-size:26px;margin:14px 0 6px}p{color:#d2c6b5;line-height:1.6}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;border-radius:12px;border:1px solid #5b5041;padding:12px 14px}input{flex:1;min-width:220px;background:#17140f;color:#fff}button{background:#c8953f;color:#17140f;font-weight:800;cursor:pointer}button.secondary{background:#2b261e;color:#fff8e8}button:disabled{opacity:.45;cursor:not-allowed}#map{height:52vh;min-height:420px;border-radius:16px;overflow:hidden;margin-top:12px}.status{font-size:13px;color:#e2d7c7}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.stat{background:#17140f;border:1px solid #433a30;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px;color:#f0cc7b}.warn{color:#f4c56b}.ok{color:#9ee6a8}pre{white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;background:#0f0e0b;padding:12px;border-radius:12px;font-size:11px}a{color:#f0cc7b}</style>
</head>
<body><main>
<span class="badge">NEXT LAB / PoC</span>
<h1>公園指定 → 範囲取得 → POI抽出</h1>
<p>まずは「ユーザーがポリゴンを描かなくても、公園名から境界候補を得て、その範囲内のPOIを抽出できるか」を検証します。現在のPOI供給元はOSMです。Wayfarer/WFMM接続は別Adapterとして後から交換します。</p>
<div class="panel">
<div class="row"><input id="q" value="葛西臨海公園" aria-label="公園名"><button id="searchBtn">公園を検索</button><button id="poiBtn" class="secondary" disabled>この範囲のPOIを取得</button><button id="exportBtn" class="secondary" disabled>標準POI JSON</button></div>
<div id="status" class="status" style="margin-top:10px">待機中</div>
<div class="stats"><div class="stat"><span>境界</span><b id="boundaryStat">未取得</b></div><div class="stat"><span>範囲内POI</span><b id="poiStat">0</b></div><div class="stat"><span>データ形式</span><b>v1</b></div></div>
<div id="map"></div>
</div>
<div class="panel"><strong>PoCログ</strong><pre id="log">Ready.</pre></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([35.6405,139.8610],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const state={feature:null,boundaryLayer:null,poiLayer:L.layerGroup().addTo(map),pois:[]};
const $=id=>document.getElementById(id);const log=(m,o)=>{$('log').textContent=new Date().toLocaleTimeString()+'  '+m+(o?'\n'+JSON.stringify(o,null,2):'')};
function flattenCoords(g){if(!g)return[];if(g.type==='Polygon')return g.coordinates.flat();if(g.type==='MultiPolygon')return g.coordinates.flat(2);return[]}
function pointInRing(pt,ring){const [x,y]=pt;let inside=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const [xi,yi]=ring[i],[xj,yj]=ring[j];const hit=((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi+Number.EPSILON)+xi);if(hit)inside=!inside}return inside}
function pointInPolygon(pt,g){if(g.type==='Polygon')return pointInRing(pt,g.coordinates[0])&&!g.coordinates.slice(1).some(r=>pointInRing(pt,r));if(g.type==='MultiPolygon')return g.coordinates.some(p=>pointInRing(pt,p[0])&&!p.slice(1).some(r=>pointInRing(pt,r)));return false}
async function searchPark(){const q=$('q').value.trim();if(!q)return;$('status').textContent='公園境界を検索中…';$('searchBtn').disabled=true;try{const url='https://nominatim.openstreetmap.org/search?format=jsonv2&polygon_geojson=1&limit=6&countrycodes=jp&q='+encodeURIComponent(q);const r=await fetch(url,{headers:{'Accept-Language':'ja'}});const rows=await r.json();const row=rows.find(x=>x.geojson&&(x.geojson.type==='Polygon'||x.geojson.type==='MultiPolygon'))||rows[0];if(!row||!row.geojson)throw new Error('ポリゴン境界を取得できませんでした');state.feature={type:'Feature',properties:{display_name:row.display_name,osm_type:row.osm_type,osm_id:row.osm_id},geometry:row.geojson};if(state.boundaryLayer)map.removeLayer(state.boundaryLayer);state.boundaryLayer=L.geoJSON(state.feature,{style:{weight:3,fillOpacity:.12}}).addTo(map);map.fitBounds(state.boundaryLayer.getBounds(),{padding:[20,20]});state.poiLayer.clearLayers();state.pois=[];$('poiStat').textContent='0';$('boundaryStat').textContent='取得済';$('poiBtn').disabled=false;$('exportBtn').disabled=true;$('status').innerHTML='<span class="ok">境界候補を取得しました。</span> 内容を確認してPOI取得へ。';log('boundary found',state.feature.properties)}catch(e){$('status').innerHTML='<span class="warn">'+e.message+'</span>';log('boundary error',{message:e.message})}finally{$('searchBtn').disabled=false}}
async function fetchPois(){if(!state.boundaryLayer)return;const b=state.boundaryLayer.getBounds();$('status').textContent='周辺POIを取得し、境界内に絞り込み中…';$('poiBtn').disabled=true;try{const bbox=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].join(',');const query=`[out:json][timeout:25];(node["name"](${bbox});way["name"](${bbox});relation["name"](${bbox}););out center tags;`;const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:new URLSearchParams({data:query})});const data=await r.json();const unique=new Map();for(const e of data.elements){const lat=e.lat??e.center?.lat,lng=e.lon??e.center?.lon;if(lat==null||lng==null)continue;if(!pointInPolygon([lng,lat],state.feature.geometry))continue;const sourceId=`osm:${e.type}:${e.id}`;if(unique.has(sourceId))continue;const tags=e.tags||{};unique.set(sourceId,{schemaVersion:'1.0',poiId:'csp_'+sourceId.replaceAll(':','_'),source:{type:'osm-poc',sourceId,observedAt:new Date().toISOString()},location:{lat,lng},name:{original:tags.name||'',normalized:tags.name||''},description:tags.description||'',media:{mainImageUrl:null},game:{pokemonGo:{type:'unknown',status:'unknown'}},classification:{category:'UNKNOWN',confidence:null,method:'unclassified'},campsite:{role:'unknown',eligible:null,excluded:false,excludeReason:null},quality:{duplicateStatus:'unchecked',locationConfidence:1}})}state.pois=[...unique.values()];state.poiLayer.clearLayers();for(const p of state.pois){L.circleMarker([p.location.lat,p.location.lng],{radius:5,weight:1,fillOpacity:.8}).bindPopup('<strong>'+escapeHtml(p.name.original)+'</strong><br>'+p.source.sourceId).addTo(state.poiLayer)}$('poiStat').textContent=state.pois.length;$('exportBtn').disabled=!state.pois.length;$('status').innerHTML='<span class="ok">'+state.pois.length+'件を境界内POIとして抽出しました。</span>';$('poiBtn').disabled=false;log('POI extraction completed',{count:state.pois.length,source:'OSM PoC'})}catch(e){$('status').innerHTML='<span class="warn">POI取得失敗: '+e.message+'</span>';$('poiBtn').disabled=false;log('POI error',{message:e.message})}}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function exportJson(){const payload={schemaVersion:'1.0',site:{name:$('q').value.trim(),boundarySource:state.feature?.properties||null,boundary:state.feature?.geometry||null},pois:state.pois};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='campsite-standard-poi-v1.json';a.click();URL.revokeObjectURL(a.href)}
$('searchBtn').onclick=searchPark;$('poiBtn').onclick=fetchPois;$('exportBtn').onclick=exportJson;
</script></body></html>
