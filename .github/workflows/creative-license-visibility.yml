name: creative-license-visibility

on:
  push:
    branches:
      - agent/creative-dev-patches

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-dev-patches

      - name: Make map attribution clearly visible
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('creative/index.html')
          s=p.read_text()
          old=".leaflet-control-attribution{font-size:7px!important;line-height:1.1!important;padding:1px 3px!important;margin:0 0 calc(64px + env(safe-area-inset-bottom)) 2px!important;background:rgba(255,255,255,.68)!important;color:#555!important;max-width:calc(100vw - 20px)!important;white-space:normal!important}.leaflet-control-attribution a{font-size:inherit!important;color:inherit!important}@media(max-width:520px){.leaflet-control-attribution{font-size:6px!important;max-width:76vw!important}}"
          new=".leaflet-control-attribution{font-size:9px!important;line-height:1.2!important;padding:2px 5px!important;margin:0 0 calc(64px + env(safe-area-inset-bottom)) 3px!important;background:rgba(255,255,255,.88)!important;color:#4b4b4b!important;border-radius:3px 3px 0 0!important;max-width:calc(100vw - 16px)!important;white-space:normal!important;box-shadow:0 1px 4px rgba(0,0,0,.16)!important}.leaflet-control-attribution a{font-size:inherit!important;color:inherit!important;text-decoration:none!important}@media(max-width:520px){.leaflet-control-attribution{font-size:8px!important;max-width:82vw!important;padding:2px 4px!important}}"
          if s.count(old)!=1:
              raise SystemExit(f'attribution css match count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY

          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('creative/index.html').read_text()
          m=re.search(r'<script>\s*(\(\(\)=>\{.*?\}\)\(\);)\s*</script>',s,re.S)
          if not m: raise SystemExit('inline app script not found')
          Path('/tmp/creative-app.js').write_text(m.group(1))
          PY
          node --check /tmp/creative-app.js

          git config user.name "creative-lab-bot"
          git config user.email "creative-lab-bot@users.noreply.github.com"
          git add creative/index.html
          git commit -m "Improve map license attribution visibility"
          git push origin HEAD:agent/creative-dev-patches
