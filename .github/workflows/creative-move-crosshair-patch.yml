name: creative-move-crosshair-patch

on:
  push:
    branches:
      - agent/creative-preserve-kml-export
    paths:
      - .github/workflows/creative-move-crosshair-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-preserve-kml-export
      - name: Patch beginMove only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('creative/index.html')
          text=p.read_text(encoding='utf-8')
          start=text.index('function beginMove(r){')
          end=text.index('\nlet polyDraft=', start)
          new="""function beginMove(r){clearDraft();map.closePopup();closeMenus();const old=[...r.latlng];map.setView(r.latlng,map.getZoom(),{animate:false});const c=map.getCenter(),cs=circlesAt(c),marker=L.marker(c,{icon:draftIcon(true),pane:'placement',interactive:false,zIndexOffset:2400}).addTo(map),bar=document.createElement('div'),save=document.createElement('button'),close=document.createElement('button');Object.assign(bar.style,{position:'fixed',left:'50%',transform:'translateX(-50%)',bottom:'calc(132px + env(safe-area-inset-bottom))',zIndex:'1450',display:'flex',gap:'8px',alignItems:'center'});save.type='button';save.textContent='この位置に確定';Object.assign(save.style,{minWidth:'170px',height:'52px',padding:'0 18px',border:'2px solid #8a6b31',borderRadius:'15px',background:'#fff8e6',color:'#37270c',fontWeight:'950',fontSize:'16px',boxShadow:'0 5px 16px rgba(0,0,0,.28)'});close.type='button';close.textContent='×';Object.assign(close.style,{width:'46px',height:'46px',border:'2px solid #8a6b31',borderRadius:'14px',background:'rgba(255,253,247,.96)',color:'#5d4630',fontWeight:'950',fontSize:'24px',boxShadow:'0 5px 16px rgba(0,0,0,.22)'});bar.append(save,close);document.body.appendChild(bar);draft={marker,...cs,action:bar,onMove:null};updateDraftCircles();updateNearestHint(r.id);const onMove=()=>{if(!draft||draft.marker!==marker)return;const ll=map.getCenter();marker.setLatLng(ll);draft.c50.setLatLng(ll);draft.c40.setLatLng(ll);updateNearestHint(r.id)};draft.onMove=onMove;map.on('move',onMove);save.onclick=()=>{if(!draft||draft.marker!==marker)return;const ll=map.getCenter(),to=[ll.lat,ll.lng];clearDraft();r.latlng=to;pushHistory({type:'move',id:r.id,from:old,to});drawAll();snapshot();msg('位置を調整しました')};close.onclick=()=>{clearDraft();msg('位置調整をキャンセルしました')};msg('十字を合わせて「この位置に確定」を押してください',2200)}"""
          p.write_text(text[:start]+new+text[end:],encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('creative/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S)
          inline=[b for b in blocks if b.strip()]
          Path('/tmp/creative-inline.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/creative-inline.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "creative-lab-bot"
          git config user.email "creative-lab-bot@users.noreply.github.com"
          git add creative/index.html
          git commit -m "Use center crosshair for POI position adjustment"
          git push origin HEAD:agent/creative-preserve-kml-export
