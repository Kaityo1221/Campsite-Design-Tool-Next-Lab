<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>CREATIVE MODE | Next Lab</title>
</head>
<body>
<script>
(async()=>{
  const res=await fetch('./runtime-vnext.html',{cache:'no-store'});
  if(!res.ok){document.body.textContent='Creative Modeの読み込みに失敗しました。';return;}
  let src=await res.text();
  src=src.replace('multiple accept=".csv,.kmz"','multiple');
  const old="const layer=inferLayer(file.name,title);";
  const replacement="const explicit=String(csvPick(o,['nextlab-layer','nextlab_layer','layer','Layer'])||'').trim(),type=String(csvPick(o,['gameEntity','GameEntity','game_entity','Game Entity','type','Type','category','Category','種類'])||''),state=String(csvPick(o,['gameStatus','GameStatus','game_status','Game Status','status','Status'])||''),hint=(file.name+' '+title+' '+type+' '+state).toLowerCase(),fresh=/追加|新規|候補|add|new|planned/.test(hint);const layer=layerKeys.has(explicit)?explicit:(layerByLabel.get(explicit)||(/gym|ジム/.test(hint)?(fresh?'new-gym':'existing-gym'):/power|パワー/.test(hint)?(fresh?'new-power':'existing-power'):(fresh?'new-pokestop':'existing-pokestop')));";
  if(!src.includes(old)){document.body.textContent='CSV互換パッチの適用位置が見つかりません。';return;}
  src=src.replace(old,replacement);

  const oldDistanceHint="function updateNearestHint(excludeId){if(!draft)return;const ll=draft.marker.getLatLng(),near=nearestRecord(ll,excludeId);if(!near||near.distance>=50){draft.marker.closeTooltip();return}const title=(near.record.title||layerDefs.find(x=>x[0]===near.record.layer)?.[1]||'スポット').replace(/\\s+/g,' ');const short=title.length>10?title.slice(0,10)+'…':title;const text=`${short}まで ${near.distance.toFixed(1)}m`;if(!draft.marker.getTooltip())draft.marker.bindTooltip(text,{permanent:true,direction:'bottom',offset:[0,13],className:'distance-hint',opacity:.82});else draft.marker.setTooltipContent(text);draft.marker.openTooltip()}";
  const newDistanceHint="async function copyDistanceHint(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}}catch(e){}try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');Object.assign(ta.style,{position:'fixed',left:'-9999px',top:'0'});document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}}function updateNearestHint(excludeId){if(!draft)return;const ll=draft.marker.getLatLng(),near=nearestRecord(ll,excludeId);if(!near||near.distance>=50){draft.marker.closeTooltip();return}const title=(near.record.title||layerDefs.find(x=>x[0]===near.record.layer)?.[1]||'スポット').replace(/\\s+/g,' ');const short=title.length>10?title.slice(0,10)+'…':title;const text=short+'まで '+near.distance.toFixed(1)+'m';const copyText=title+'まで '+near.distance.toFixed(1)+'m';let tip=draft.marker.getTooltip(),box=tip&&tip.getContent&&tip.getContent();if(!tip||!(box instanceof HTMLElement)){box=document.createElement('div');const label=document.createElement('span'),btn=document.createElement('button');label.className='distance-hint-label';btn.type='button';btn.className='distance-hint-copy';Object.assign(box.style,{display:'flex',alignItems:'center',gap:'6px'});Object.assign(btn.style,{border:'1px solid rgba(255,255,255,.45)',borderRadius:'7px',padding:'2px 6px',background:'rgba(255,255,255,.14)',color:'#fff',fontSize:'10px',fontWeight:'900'});btn.textContent='コピー';btn.onclick=async e=>{L.DomEvent.stopPropagation(e);const ok=await copyDistanceHint(btn.dataset.copy||'');btn.textContent=ok?'コピーしました ✓':'コピー失敗';setTimeout(()=>{if(btn.isConnected)btn.textContent='コピー'},1400)};box.append(label,btn);draft.marker.bindTooltip(box,{permanent:true,direction:'bottom',offset:[0,13],className:'distance-hint',opacity:.9,interactive:true});tip=draft.marker.getTooltip()}box.querySelector('.distance-hint-label').textContent=text;box.querySelector('.distance-hint-copy').dataset.copy=copyText;draft.marker.openTooltip()}";

  const oldRecordPopup="function recordPopup(r){closeMenus();const wrap=document.createElement('div');wrap.className='popup-form';wrap.innerHTML=`<div class=\"popup-head\"><button id=\"editBtn\">✏️ 編集</button><button id=\"deleteBtn\" class=\"danger\">Delete</button></div><div class=\"popup-title\">${esc(r.title||'名称なし')}</div><div class=\"popup-layer\">${esc(layerDefs.find(x=>x[0]===r.layer)?.[1]||r.layer)}</div><div class=\"popup-edit\"><input id=\"editTitle\" placeholder=\"タイトル\"><textarea id=\"editMemo\" placeholder=\"メモ\"></textarea><button id=\"saveEdit\">保存</button></div><div class=\"popup-actions\"><select id=\"moveLayer\">${layerDefs.map(([k,l])=>`<option value=\"${k}\" ${k===r.layer?'selected':''}>${l}</option>`).join('')}</select><button id=\"applyLayer\">このレイヤーへ移動</button>${isNew(r.layer)?'<button id=\"movePos\">位置を調整</button>':''}</div>`;const p=L.popup({offset:[0,-8],closeButton:false}).setLatLng(r.latlng).setContent(wrap).openOn(map);setTimeout(()=>{wrap.querySelector('#editBtn').onclick=()=>editRecordView(wrap,r,p);wrap.querySelector('#deleteBtn').onclick=()=>{if(!confirm('このスポットを削除しますか？'))return;r.deleted=true;pushHistory({type:'delete',id:r.id});drawAll();snapshot();map.closePopup(p);msg('削除しました')};wrap.querySelector('#applyLayer').onclick=()=>{const from=r.layer,to=wrap.querySelector('#moveLayer').value;if(from!==to){r.layer=to;pushHistory({type:'layer',id:r.id,from,to});drawAll();snapshot();msg('レイヤーを移動しました')}map.closePopup(p)};const mp=wrap.querySelector('#movePos');if(mp)mp.onclick=()=>{map.closePopup(p);beginMove(r)}},0)}";
  const newRecordPopup="function recordPopup(r){closeMenus();const wrap=document.createElement('div');wrap.className='popup-form';const near=isNew(r.layer)?nearestRecord(r.latlng,r.id):null,under=!!(near&&near.distance<50),nearTitle=under?(near.record.title||layerDefs.find(x=>x[0]===near.record.layer)?.[1]||'ゲームスポット'):'',commentText=under?('最寄りのゲームスポット「'+nearTitle+'」まで '+near.distance.toFixed(1)+'m（50m未満）'):'';wrap.innerHTML=`<div class=\"popup-head\"><button id=\"editBtn\">✏️ 編集</button><button id=\"deleteBtn\" class=\"danger\">Delete</button></div><div class=\"popup-title\">${esc(r.title||'名称なし')}</div><div class=\"popup-layer\">${esc(layerDefs.find(x=>x[0]===r.layer)?.[1]||r.layer)}</div>${under?`<div class=\"under50-comment\" style=\"margin-top:8px;padding:9px 10px;border:1px solid #d9bd72;border-radius:12px;background:#fff9e8\"><div class=\"under50-head\" style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;margin-bottom:4px\"><button id=\"toggleUnder50\" type=\"button\" style=\"width:auto;min-height:28px;margin:0;padding:2px 0;border:0;background:transparent;color:#7c5a16;font-size:11px;font-weight:900;text-align:left;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">申請時コメント</button><button id=\"copyUnder50\" type=\"button\" style=\"width:auto;min-height:30px;margin:0;padding:3px 10px;border-radius:9px;font-size:11px;line-height:1;flex:0 0 auto;white-space:nowrap\">📋 コピー</button></div><div class=\"under50-text\" style=\"font-size:12px;line-height:1.45\">${esc(commentText)}</div><div id=\"under50Editor\"><textarea id=\"under50FreeText\" maxlength=\"300\" placeholder=\"申請時の理由や補足を入力してください\" style=\"width:100%;min-height:74px;margin-top:8px;padding:8px;border:1px solid #c9b993;border-radius:9px;resize:vertical;font-size:12px;line-height:1.45\">${esc(r.applicationComment||'')}</textarea><div class=\"under50-foot\" style=\"display:flex;justify-content:space-between;gap:8px;margin-top:4px;color:#7a6c56;font-size:10px\"><span>※ コピー時に上の距離情報と一緒に使用します。</span><span id=\"under50Count\" style=\"white-space:nowrap\">${String(r.applicationComment||'').length} / 300</span></div></div></div>`:''}<div class=\"popup-edit\"><input id=\"editTitle\" placeholder=\"タイトル\"><textarea id=\"editMemo\" placeholder=\"メモ\"></textarea><button id=\"saveEdit\">保存</button></div><div class=\"popup-actions\"><select id=\"moveLayer\">${layerDefs.map(([k,l])=>`<option value=\"${k}\" ${k===r.layer?'selected':''}>${l}</option>`).join('')}</select><button id=\"applyLayer\">このレイヤーへ移動</button>${isNew(r.layer)?'<button id=\"movePos\">位置を調整</button>':''}</div>`;const p=L.popup({offset:[-18,-8],closeButton:false,maxWidth:320,minWidth:0,autoPan:true,autoPanPaddingTopLeft:[18,145],autoPanPaddingBottomRight:[112,118]}).setLatLng(r.latlng).setContent(wrap).openOn(map);let compactExpanded=false;const applyZoomLayout=()=>{if(!wrap.isConnected)return;const z=map.getZoom(),mode=z>=18?'high':z>=13?'mid':'low',editor=wrap.querySelector('#under50Editor'),toggle=wrap.querySelector('#toggleUnder50'),card=wrap.querySelector('.under50-comment'),foot=wrap.querySelector('.under50-foot'),ft=wrap.querySelector('#under50FreeText'),head=wrap.querySelector('.popup-head'),title=wrap.querySelector('.popup-title'),layer=wrap.querySelector('.popup-layer'),actions=wrap.querySelector('.popup-actions');wrap.dataset.zoomMode=mode;wrap.style.boxSizing='border-box';wrap.style.width=mode==='high'?'290px':mode==='mid'?'250px':'212px';wrap.style.fontSize=mode==='low'?'11px':'';if(card){card.style.marginTop=mode==='high'?'8px':'6px';card.style.padding=mode==='high'?'9px 10px':mode==='mid'?'7px 8px':'6px 7px';card.style.borderRadius=mode==='low'?'9px':'12px'}if(toggle){toggle.textContent=mode==='high'?'申請時コメント':(compactExpanded?'申請時コメント ▲':'申請時コメント ▼');toggle.style.cursor=mode==='high'?'default':'pointer';toggle.disabled=mode==='high'}if(editor){editor.style.display=mode==='high'||compactExpanded?'block':'none'}if(ft){ft.style.minHeight=mode==='high'?'74px':mode==='mid'?'58px':'52px';ft.style.marginTop=mode==='low'?'5px':'8px';ft.style.padding=mode==='low'?'6px':'8px';ft.style.fontSize=mode==='low'?'11px':'12px'}if(foot)foot.style.fontSize=mode==='low'?'9px':'10px';if(head){head.style.marginBottom=mode==='low'?'2px':''}if(title){title.style.fontSize=mode==='low'?'12px':'';title.style.lineHeight=mode==='low'?'1.25':''}if(layer){layer.style.fontSize=mode==='low'?'10px':'';layer.style.marginBottom=mode==='low'?'4px':''}if(actions){actions.style.gap=mode==='low'?'5px':''}wrap.querySelectorAll('button,select,input,textarea').forEach(el=>{if(mode==='low'&&el.id!=='under50FreeText'){el.style.minHeight='32px';el.style.fontSize='11px'}else if(mode!=='low'&&el.id!=='under50FreeText'){el.style.minHeight='';el.style.fontSize=''}});p.options.maxWidth=mode==='high'?310:mode==='mid'?270:230;p.update()};const onZoomEnd=()=>applyZoomLayout();map.on('zoomend',onZoomEnd);p.on('remove',()=>map.off('zoomend',onZoomEnd));setTimeout(()=>{wrap.querySelector('#editBtn').onclick=()=>editRecordView(wrap,r,p);wrap.querySelector('#deleteBtn').onclick=()=>{if(!confirm('このスポットを削除しますか？'))return;r.deleted=true;pushHistory({type:'delete',id:r.id});drawAll();snapshot();map.closePopup(p);msg('削除しました')};wrap.querySelector('#applyLayer').onclick=()=>{const from=r.layer,to=wrap.querySelector('#moveLayer').value;if(from!==to){r.layer=to;pushHistory({type:'layer',id:r.id,from,to});drawAll();snapshot();msg('レイヤーを移動しました')}map.closePopup(p)};const mp=wrap.querySelector('#movePos');if(mp)mp.onclick=()=>{map.closePopup(p);beginMove(r)};const ft=wrap.querySelector('#under50FreeText'),ct=wrap.querySelector('#under50Count');if(ft){ft.oninput=()=>{r.applicationComment=ft.value.slice(0,300);if(ct)ct.textContent=r.applicationComment.length+' / 300';snapshot()}}const tg=wrap.querySelector('#toggleUnder50');if(tg)tg.onclick=()=>{if(map.getZoom()>=18)return;compactExpanded=!compactExpanded;applyZoomLayout();if(compactExpanded&&ft)setTimeout(()=>ft.focus(),0)};const cp=wrap.querySelector('#copyUnder50');if(cp)cp.onclick=async()=>{const free=String(r.applicationComment||'').trim(),copyText=free?commentText+'\\n'+free:commentText;let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(copyText);ok=true}}catch(e){}if(!ok)try{const ta=document.createElement('textarea');ta.value=copyText;ta.setAttribute('readonly','');Object.assign(ta.style,{position:'fixed',left:'-9999px'});document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);ok=document.execCommand('copy');ta.remove()}catch(e){}cp.textContent=ok?'コピーしました ✓':'コピー失敗';setTimeout(()=>{if(cp.isConnected)cp.textContent='📋 コピー'},1400)};applyZoomLayout()},0)}";

  const runtimeNeedle="  document.open();document.write(html);document.close();";
  if(!src.includes(runtimeNeedle)){document.body.textContent='距離コメント機能の適用位置が見つかりません。';return;}
  const runtimePatch="  const oldDistanceHint="+JSON.stringify(oldDistanceHint)+";\n  const newDistanceHint="+JSON.stringify(newDistanceHint)+";\n  if(html.includes(oldDistanceHint))html=html.replace(oldDistanceHint,newDistanceHint);\n  const oldRecordPopup="+JSON.stringify(oldRecordPopup)+";\n  const newRecordPopup="+JSON.stringify(newRecordPopup)+";\n  if(html.includes(oldRecordPopup))html=html.replace(oldRecordPopup,newRecordPopup);\n";
  src=src.replace(runtimeNeedle,runtimePatch+runtimeNeedle);

  document.open();document.write(src);document.close();
})().catch(()=>{document.body.textContent='Creative Modeの読み込みに失敗しました。';});
</script>
</body>
</html>
