<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>おまけ | FIELD IMMERSIVE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#fff8e8;--muted:#cfc4b2;--edge:rgba(255,239,200,.28);--glass:rgba(32,27,21,.92);--blue:#9ecfff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#17130f;color:var(--ink)}button,input{font:inherit}button{touch-action:manipulation}#map{position:fixed;inset:0;z-index:1}.leaflet-control-attribution{font-size:8px}.veil{position:fixed;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(15,12,9,.28),transparent 22%,transparent 76%,rgba(15,12,9,.34))}
.top{position:fixed;z-index:1000;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}.top>*{pointer-events:auto}.top button,.bonus{min-height:42px;border:1px solid var(--edge);border-radius:13px;background:rgba(28,24,19,.92);color:var(--ink);font-weight:900;box-shadow:0 6px 18px rgba(0,0,0,.2)}.top button{padding:0 12px}.bonus{display:grid;place-items:center;min-height:0;padding:7px 10px;color:#ffe19b;font-size:11px;letter-spacing:.08em}
.radarbar{position:fixed;z-index:999;top:calc(66px + env(safe-area-inset-top));left:10px;right:10px;padding:8px 10px;border:1px solid rgba(180,220,255,.28);border-radius:15px;background:rgba(20,25,30,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(0,0,0,.24)}.radarhead{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.radarhead button{min-height:34px;padding:0 10px;border:1px solid rgba(158,207,255,.38);border-radius:10px;background:rgba(55,92,128,.58);color:#eff8ff;font-size:11px;font-weight:900}.radartitle{font-size:11px;font-weight:950}.radartime{font-size:10px;color:#bfe2ff;text-align:right;white-space:nowrap}.radarrange{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:6px}.radarrange span{font-size:9px;color:#c7d5df}.radarrange input{width:100%;accent-color:#78bfff}.radarstatus{margin-top:3px;font-size:9px;color:#becbd4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{position:fixed;z-index:1000;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-height:60dvh;overflow:auto;padding:0 13px 13px;border:1px solid var(--edge);border-radius:20px;background:var(--glass);box-shadow:0 16px 45px rgba(0,0,0,.34);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:transform .24s ease;will-change:transform}.sheet.collapsed{transform:translateY(calc(100% - 58px));overflow:hidden}.sheet-handle{position:sticky;top:0;z-index:2;width:100%;min-height:56px;border:0;background:linear-gradient(180deg,rgba(32,27,21,.98),rgba(32,27,21,.92));color:var(--ink);font-weight:950;display:flex;align-items:center;justify-content:center;gap:8px}.sheet-handle:before{content:"";position:absolute;top:7px;width:48px;height:5px;border-radius:999px;background:rgba(255,255,255,.25)}.sheet-body{padding-top:2px}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.13em;color:var(--blue)}h1{margin:3px 0 5px;font-size:22px}.lead{margin:0;color:var(--muted);font-size:11px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.file{position:relative;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border:1px dashed rgba(158,207,255,.55);border-radius:13px;background:rgba(44,118,190,.10);font-weight:900;overflow:hidden}.file span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file input{position:absolute;inset:0;width:100%;height:100%;opacity:0}.action{min-height:48px;padding:0 12px;border:1px solid var(--edge);border-radius:13px;background:#fff8e6;color:#382d1d;font-weight:950}.action:disabled{opacity:.42}.status{margin-top:8px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.06);font-size:11px;line-height:1.5}.rain{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,239,200,.15)}.rain-head{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.rain-title{font-size:11px;font-weight:950}.rain button{min-height:42px;padding:0 14px;border:1px solid rgba(158,207,255,.55);border-radius:11px;background:#9ecfff;color:#15334e;font-weight:950}.rain button:disabled{opacity:.4}.timeline{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}.slot{flex:0 0 66px;padding:7px 5px;border:1px solid rgba(255,239,200,.16);border-radius:10px;background:rgba(255,255,255,.045);text-align:center}.slot time{display:block;font-size:9px;color:var(--muted)}.slot b{display:block;margin-top:4px;font-size:13px}.advice{margin-top:8px;font-size:11px;font-weight:850;line-height:1.5}.foot{margin-top:7px;color:#b9ae9c;font-size:9px;line-height:1.45}.poi-label{background:rgba(32,27,21,.9)!important;color:#fff8e8!important;border:0!important;border-radius:8px!important;box-shadow:none!important;padding:3px 6px!important;font-size:10px!important}.poi-label:before{display:none!important}@media(max-width:520px){.grid{grid-template-columns:1fr}.action{width:100%}.radarbar{right:76px}.radarhead{grid-template-columns:auto 1fr}.radartime{grid-column:1/-1;text-align:left}}
</style>
</head>
<body>
<div id="map"></div><div class="veil"></div>
<div class="top"><button type="button" onclick="location.href='./index.html'">← 戻る</button><span class="bonus">おまけ</span><button id="locate" type="button">◎ 現在地</button></div>
<div class="radarbar">
  <div class="radarhead"><button id="radarToggle" type="button">☔ 雨雲 ON</button><div class="radartitle">全国 雨雲接近レーダー</div><div id="radarTime" class="radartime">取得中…</div></div>
  <div class="radarrange"><span>実況</span><input id="radarSlider" type="range" min="0" max="0" value="0" disabled><span>+60分</span></div>
  <div id="radarStatus" class="radarstatus">気象庁 高解像度降水ナウキャストを読み込み中</div>
</div>
<section id="sheet" class="sheet collapsed">
  <button id="sheetToggle" class="sheet-handle" type="button" aria-expanded="false">▲ 現地メニュー</button>
  <div class="sheet-body">
    <div class="eyebrow">FIELD IMMERSIVE / WALK MODE</div>
    <h1>🧭 現地を歩く</h1>
    <p class="lead">日本全国の雨雲を地図に重ね、My Mapsや現地モードなどで作ったKMZ / KMLと現在地を同時に見られます。</p>
    <div class="grid"><label class="file">🗺️ <span id="fileLabel">KMZ / KMLを開く</span><input id="fileInput" type="file" accept=".kmz,.kml"></label><button id="fit" class="action" type="button" disabled>全体表示</button></div>
    <div class="grid"><button id="japan" class="action" type="button">🇯🇵 全国表示</button><button id="radarNow" class="action" type="button">☔ 実況へ</button></div>
    <div id="status" class="status">雨雲レーダーは自動で表示します。現在地やKMZは必要な時だけ重ねてください。</div>
    <div class="rain">
      <div class="rain-head"><div class="rain-title">地点の降水量</div><button id="rainButton" type="button" disabled>雨を見る</button></div>
      <div id="rainTimeline" class="timeline"></div><div id="rainAdvice" class="advice"></div>
      <div class="foot">全国の雨雲は気象庁、現在地またはKMZ中心のmm/h確認はYahoo! JAPAN 気象情報APIを利用します。</div>
    </div>
  </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://azkshxjgsbtjgwbapcfw.supabase.co';
const JMA_TILE='https://www.jma.go.jp/bosai/jmatile/data/nowc';
const map=L.map('map',{zoomControl:false}).setView([35.6812,139.7671],10);L.control.zoom({position:'topright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const sheet=document.getElementById('sheet'),sheetToggle=document.getElementById('sheetToggle'),fileInput=document.getElementById('fileInput'),fileLabel=document.getElementById('fileLabel'),fit=document.getElementById('fit'),status=document.getElementById('status'),locate=document.getElementById('locate'),japan=document.getElementById('japan'),radarNow=document.getElementById('radarNow'),rainButton=document.getElementById('rainButton'),rainTimeline=document.getElementById('rainTimeline'),rainAdvice=document.getElementById('rainAdvice'),radarToggle=document.getElementById('radarToggle'),radarSlider=document.getElementById('radarSlider'),radarTime=document.getElementById('radarTime'),radarStatus=document.getElementById('radarStatus');
const group=L.featureGroup().addTo(map);let kmzCenter=null,currentPoint=null,currentMarker=null,currentAccuracy=null;
let radarFrames=[],radarLayer=null,radarEnabled=true,radarIndex=0;
function setSheet(open){sheet.classList.toggle('collapsed',!open);sheetToggle.setAttribute('aria-expanded',String(open));sheetToggle.textContent=open?'▼ 畳む':'▲ 現地メニュー';setTimeout(()=>map.invalidateSize(),260)}
sheetToggle.onclick=()=>setSheet(sheet.classList.contains('collapsed'));
function readyRain(){rainButton.disabled=!(currentPoint||kmzCenter)}
function parseJmaTime(s){return new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10),+s.slice(10,12),+s.slice(12,14)))}
function jstTime(s){return parseJmaTime(s).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false})}
function radarLabel(frame){if(!frame)return'未取得';const lead=Math.round((parseJmaTime(frame.validtime)-parseJmaTime(frame.basetime))/60000);return `${lead>0?`+${lead}分`:'実況'} ${jstTime(frame.validtime)}`}
function setRadarFrame(index){if(!radarFrames.length)return;radarIndex=Math.max(0,Math.min(index,radarFrames.length-1));radarSlider.value=String(radarIndex);const f=radarFrames[radarIndex];radarTime.textContent=radarLabel(f);if(radarLayer){map.removeLayer(radarLayer);radarLayer=null}if(!radarEnabled)return;const url=`${JMA_TILE}/${f.basetime}/none/${f.validtime}/surf/hrpns/{z}/{x}/{y}.png`;radarLayer=L.tileLayer(url,{minNativeZoom:4,maxNativeZoom:10,maxZoom:20,opacity:.68,zIndex:420,attribution:'気象データ © 気象庁'}).addTo(map);radarLayer.on('tileerror',()=>{radarStatus.textContent='一部の雨雲タイルを取得できませんでした。地図を少し縮小して確認してください。'})}
function buildFrames(data){const obs=(Array.isArray(data.observations)?data.observations:[]).slice().sort((a,b)=>a.validtime.localeCompare(b.validtime));const latest=obs[obs.length-1];if(!latest)return[];const fcAll=(Array.isArray(data.forecasts)?data.forecasts:[]);const latestBase=fcAll.map(x=>x.basetime).sort().pop();const end=parseJmaTime(latest.validtime).getTime()+60*60000;const fc=fcAll.filter(x=>x.basetime===latestBase&&x.validtime>latest.validtime&&parseJmaTime(x.validtime).getTime()<=end).sort((a,b)=>a.validtime.localeCompare(b.validtime));const unique=new Map();[latest,...fc].forEach(x=>unique.set(x.validtime,x));return [...unique.values()]}
async function loadRadar(){radarStatus.textContent='気象庁の最新時刻を取得中…';try{const res=await fetch(`${SUPABASE_URL}/functions/v1/jma-radar-index`,{cache:'no-store'}),data=await res.json();if(!res.ok)throw new Error(data?.error||'取得失敗');const wasLatest=!radarFrames.length||radarIndex===radarFrames.length-1||radarIndex===0;radarFrames=buildFrames(data);if(!radarFrames.length)throw new Error('雨雲時刻データがありません。');radarSlider.max=String(radarFrames.length-1);radarSlider.disabled=false;radarStatus.textContent='気象庁 高解像度降水ナウキャスト / 全国';setRadarFrame(wasLatest?0:Math.min(radarIndex,radarFrames.length-1))}catch(e){radarStatus.textContent=e.message||'雨雲レーダーを取得できませんでした。';radarTime.textContent='取得失敗'}}
radarSlider.addEventListener('input',()=>setRadarFrame(Number(radarSlider.value)));
radarToggle.onclick=()=>{radarEnabled=!radarEnabled;radarToggle.textContent=radarEnabled?'☔ 雨雲 ON':'☁️ 雨雲 OFF';if(radarEnabled)setRadarFrame(radarIndex);else if(radarLayer){map.removeLayer(radarLayer);radarLayer=null}};
radarNow.onclick=()=>{if(radarFrames.length)setRadarFrame(0);setSheet(false)};
japan.onclick=()=>{map.fitBounds([[24,122],[46,146]],{padding:[8,8]});setSheet(false)};
async function textFrom(file){if(/\.kml$/i.test(file.name))return file.text();if(!/\.kmz$/i.test(file.name))throw new Error('KMZ / KMLを選択してください。');const z=await JSZip.loadAsync(file),names=Object.keys(z.files).filter(n=>/\.kml$/i.test(n)&&!z.files[n].dir),name=names.find(n=>/(^|\/)doc\.kml$/i.test(n))||names[0];if(!name)throw new Error('KMZ内にKMLが見つかりません。');return z.files[name].async('text')}
function parseKml(text){const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw new Error('KMLを解析できません。');const pts=[];doc.querySelectorAll('Placemark').forEach(pm=>{const name=pm.querySelector('name')?.textContent?.trim()||'POI';const point=pm.querySelector('Point coordinates');if(point){const p=point.textContent.trim().split(',').map(Number);if(Number.isFinite(p[0])&&Number.isFinite(p[1])){const ll=[p[1],p[0]];pts.push(ll);L.circleMarker(ll,{radius:7,weight:2,color:'#fff',fillColor:'#d8b766',fillOpacity:.95}).bindTooltip(name,{className:'poi-label',direction:'top'}).addTo(group)}}pm.querySelectorAll('LineString coordinates,Polygon coordinates').forEach(n=>{const ll=String(n.textContent||'').trim().split(/\s+/).map(t=>{const p=t.split(',').map(Number);return[p[1],p[0]]}).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));if(ll.length){pts.push(...ll);L.polyline(ll,{weight:3,color:'#e0bd62',opacity:.82}).addTo(group)}})});if(!pts.length)throw new Error('座標が見つかりません。');const b=L.latLngBounds(pts);return {bounds:b,center:b.getCenter(),count:pts.length}}
fileInput.addEventListener('change',async()=>{const f=fileInput.files?.[0];if(!f)return;fileLabel.textContent=f.name;status.textContent='読み込み中…';group.clearLayers();try{const r=parseKml(await textFrom(f));kmzCenter={lat:r.center.lat,lng:r.center.lng};map.fitBounds(r.bounds,{padding:[30,30],maxZoom:18});fit.disabled=false;status.textContent=`${f.name} を表示中。${r.count}座標を読み込みました。`;readyRain();setSheet(false)}catch(e){kmzCenter=null;fit.disabled=true;status.textContent=e.message||'読み込み失敗';readyRain()}});
fit.onclick=()=>{if(group.getLayers().length)map.fitBounds(group.getBounds(),{padding:[30,30],maxZoom:18})};
locate.onclick=()=>{if(!navigator.geolocation){status.textContent='位置情報を利用できません。';return}status.textContent='現在地を取得中…';navigator.geolocation.getCurrentPosition(p=>{currentPoint={lat:p.coords.latitude,lng:p.coords.longitude};if(currentMarker)map.removeLayer(currentMarker);if(currentAccuracy)map.removeLayer(currentAccuracy);currentAccuracy=L.circle([currentPoint.lat,currentPoint.lng],{radius:p.coords.accuracy||0,color:'#6bb7f4',weight:1,fillColor:'#6bb7f4',fillOpacity:.08}).addTo(map);currentMarker=L.circleMarker([currentPoint.lat,currentPoint.lng],{radius:8,weight:3,color:'#fff',fillColor:'#2c76be',fillOpacity:1}).addTo(map);map.setView([currentPoint.lat,currentPoint.lng],12);status.textContent=`現在地 ±${Math.round(p.coords.accuracy||0)}m`;readyRain();setSheet(false)},()=>{status.textContent='現在地を取得できませんでした。'},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})};
function advice(max){if(max>=20)return'強い雨に注意。屋根付き退避地点と移動時間を先に確認。';if(max>=10)return'まとまった雨の可能性。雨宿り場所と滑りやすい区間を確認。';if(max>=5)return'このあと雨が強まる可能性あり。退避先を意識して歩く。';if(max>0)return'弱い雨の可能性あり。';return'60分以内は大きな降水シグナルなし。'}
async function fetchRain(point){const res=await fetch(`${SUPABASE_URL}/functions/v1/yahoo-rain`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(point)});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data?.error||`雨予報を取得できませんでした (${res.status})`);return Array.isArray(data.weather)?data.weather:[]}
rainButton.onclick=async()=>{const p=currentPoint||kmzCenter;if(!p)return;rainButton.disabled=true;rainButton.textContent='取得中';rainTimeline.innerHTML='';rainAdvice.textContent='';try{const rows=await fetchRain(p),future=rows.filter(x=>String(x.type||'').toLowerCase()!=='observation').slice(-13),shown=(future.length?future:rows.slice(-13));if(!shown.length)throw new Error('雨予報データがありません。');rainTimeline.innerHTML=shown.map(x=>`<div class="slot"><time>${String(x.date).slice(8,10)}:${String(x.date).slice(10,12)}</time><b>${Number(x.rainfall).toFixed(1)}</b><small> mm/h</small></div>`).join('');const max=Math.max(0,...shown.map(x=>Number(x.rainfall)||0));rainAdvice.textContent=advice(max)}catch(e){rainAdvice.textContent=e.message||'取得に失敗しました。'}finally{rainButton.textContent='雨を見る';readyRain()}};
readyRain();loadRadar();setInterval(loadRadar,5*60*1000);
})();
</script>
</body>
</html>
