<div id="entry" class="entry"><div class="entry-inner"><h1 class="entry-title">CREATIVE MODE</h1><p class="entry-copy">地図をひらいて、キャンプサイトを描こう。</p><div class="entry-panel"><label class="filebar"><span class="icon">📂</span><strong>KMZ / KMLを選択</strong><span id="entryFileName" class="filename">未選択</span><input id="entryFile" type="file"></label><div class="handed"><button id="rightHand" class="active" type="button">右利き</button><button id="leftHand" type="button">左利き</button></div><button id="startButton" class="start" type="button" disabled>CREATIVE MODEを開始</button><button id="resumeButton" class="resume" type="button">前回の続きから</button><div id="entryState" class="entry-state">ファイルを選択してください。</div><div class="entry-note">KMZ / KML / ZIP を端末内で処理します。編集内容は自動保存されます。</div><a class="lablink" href="../index.html">← Next Labへ戻る</a></div></div></div>
<div id="transition" class="transition">CREATIVE MODE</div>
<div id="map"></div>
<button id="back" class="topbtn back">← 戻る</button><button id="mapToggle" class="topbtn map-toggle">地図切り替え</button><button id="layerButton" class="topbtn layer-btn">▱ レイヤー</button><button id="circleButton" class="topbtn circle-btn">◎ 距離円</button><div id="status" class="status">準備中</div>
<button id="toolbox" class="toolbox" aria-label="道具箱">🧰</button><div id="toolMenu" class="toolmenu"><button data-tool="add">＋ 追加</button><button data-tool="move">位置調整</button><button data-tool="polygon">ポリゴン</button><button data-tool="ruler">物差し</button></div>
<div id="layerPanel" class="panel"><h3>▱ レイヤー</h3><div id="layerRows"></div></div><div id="circlePanel" class="panel circle-panel"><h3>◎ 距離円</h3><button data-circle="50">50m</button><button data-circle="40">40m</button><button data-circle="both" class="active">50m + 40m</button><button data-circle="off">非表示</button></div>

<script>
(()=>{'use strict';
const STORE='next-lab-creative-v3',HAND='next-lab-creative-hand';const layerDefs=[['existing-pokestop','既存 PokéStop','#3f89c9'],['existing-gym','既存 Gym','#d85454'],['existing-power','既存 PowerSpot','#8656b8'],['new-pokestop','新規 PokéStop','#e6a400'],['new-gym','新規 Gym','#d06b2f'],['new-power','新規 PowerSpot','#9d6bd1']];
const $=id=>document.getElementById(id),entry=$('entry'),entryFile=$('entryFile'),entryFileName=$('entryFileName'),entryState=$('entryState'),start=$('startButton'),resume=$('resumeButton'),status=$('status'),toolMenu=$('toolMenu'),layerPanel=$('layerPanel'),circlePanel=$('circlePanel');
const map=L.map('map',{zoomControl:false}).setView([35.6812,139.7671],16);map.attributionControl.setPosition('bottomleft');const base=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(map),aerial=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri'});let aerialOn=false,sourceName='campsite',xmlText='',pendingFile=null,activeLayer='new-pokestop',circleMode='both',activeTool='',draft=null,records=[],polygons=[];const groups={},undoStack=[],redoStack=[];
layerDefs.forEach(([k])=>groups[k]=L.layerGroup().addTo(map));
function setHand(hand){document.body.classList.toggle('left-hand',hand==='left');document.body.classList.toggle('right-hand',hand!=='left');localStorage.setItem(HAND,hand);$('leftHand').classList.toggle('active',hand==='left');$('rightHand').classList.toggle('active',hand!=='left')}
setHand(localStorage.getItem(HAND)||'right');$('leftHand').onclick=()=>setHand('left');$('rightHand').onclick=()=>setHand('right');
function layerColor(k){return layerDefs.find(x=>x[0]===k)?.[2]||'#777'}function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function isNewLayer(k){return k.startsWith('new-')}function inferLayer(folder,name){const h=(folder+' '+name).toLowerCase(),isNew=/追加|新規|候補|add|new|planned/.test(h);if(/gym|ジム/.test(h))return isNew?'new-gym':'existing-gym';if(/power|パワー/.test(h))return isNew?'new-power':'existing-power';return isNew?'new-pokestop':'existing-pokestop'}
function renderLayerPanel(){const root=$('layerRows');root.innerHTML='';layerDefs.forEach(([k,label])=>{const row=document.createElement('div');row.className='layer-row';const b=document.createElement('button');b.textContent=label;b.classList.toggle('active',activeLayer===k);b.onclick=()=>{activeLayer=k;renderLayerPanel();status.textContent='追加先：'+label};const c=document.createElement('input');c.type='checkbox';c.checked=map.hasLayer(groups[k]);c.onchange=()=>c.checked?groups[k].addTo(map):map.removeLayer(groups[k]);row.append(b,c);root.appendChild(row)})}renderLayerPanel();
function drawRecord(r){if(r.deleted)return;const color=layerColor(r.layer),icon=L.divIcon({className:'',html:`<div class="poi-dot" style="background:${color}"></div>`,iconSize:[16,16],iconAnchor:[8,8]});r.marker=L.marker(r.latlng,{icon}).addTo(groups[r.layer]);r.marker.bindPopup(()=>`<b>${safe(r.title||'名称なし')}</b>${r.memo?`<br>${safe(r.memo)}`:''}<br><small>${safe(layerDefs.find(x=>x[0]===r.layer)?.[1]||r.layer)}</small>`);r.marker.on('click',()=>{if(activeTool==='move'&&isNewLayer(r.layer)){beginMove(r)}else r.marker.openPopup()})}
function drawAll(){layerDefs.forEach(([k])=>groups[k].clearLayers());records.forEach(drawRecord);polygons.forEach(p=>{p.layerObj=L.polygon(p.points,{color:'#9a6a22',weight:3,fillOpacity:.08}).addTo(map)})}
function snapshot(){try{localStorage.setItem(STORE,JSON.stringify({sourceName,xmlText,records:records.map(({marker,...r})=>r),polygons:polygons.map(({layerObj,...p})=>p),activeLayer,circleMode,center:[map.getCenter().lat,map.getCenter().lng],zoom:map.getZoom(),savedAt:Date.now()}));resume.classList.add('show')}catch(e){console.warn(e)}}setInterval(snapshot,2500);window.addEventListener('pagehide',snapshot);
function pushHistory(action){undoStack.push(action);redoStack.length=0;updateHistory()}function updateHistory(){$('undo').disabled=!undoStack.length;$('redo').disabled=!redoStack.length}updateHistory();
function addDraft(){clearDraft();const c=map.getCenter();const touch=L.divIcon({className:'draft-touch',html:'<div class="draft-dot"></div>',iconSize:[44,44],iconAnchor:[22,22]});const marker=L.marker(c,{draggable:true,icon:touch,zIndexOffset:1000}).addTo(map),c50=L.circle(c,{radius:50,color:'#d18a00',weight:2,fillOpacity:.025}),c40=L.circle(c,{radius:40,color:'#8d62c1',weight:2,dashArray:'5 4',fillOpacity:.015});draft={marker,c50,c40};updateDraftCircles();marker.on('drag',e=>{c50.setLatLng(e.target.getLatLng());c40.setLatLng(e.target.getLatLng())});marker.on('dragend',()=>openDraftForm());status.textContent='円をドラッグして配置位置を決めてください'}
function updateDraftCircles(){if(!draft)return;[draft.c50,draft.c40].forEach(x=>map.removeLayer(x));if(circleMode==='50'||circleMode==='both')draft.c50.addTo(map);if(circleMode==='40'||circleMode==='both')draft.c40.addTo(map)}function clearDraft(){if(!draft)return;map.removeLayer(draft.marker);map.removeLayer(draft.c50);map.removeLayer(draft.c40);draft=null}
function openDraftForm(){if(!draft)return;const ll=draft.marker.getLatLng(),wrap=document.createElement('div');wrap.className='popup-form';wrap.innerHTML='<b>ゲームスポットを追加</b><input id="ptitle" placeholder="タイトル"><textarea id="pmemo" placeholder="メモ"></textarea><button id="psave">この場所に追加</button>';const pop=L.popup({closeOnClick:false,autoClose:false}).setLatLng(ll).setContent(wrap).openOn(map);setTimeout(()=>{wrap.querySelector('#psave').onclick=()=>{const r={id:crypto.randomUUID?.()||String(Date.now()),layer:activeLayer,latlng:[ll.lat,ll.lng],title:wrap.querySelector('#ptitle').value.trim()||layerDefs.find(x=>x[0]===activeLayer)?.[1]||'新規POI',memo:wrap.querySelector('#pmemo').value.trim(),deleted:false};records.push(r);drawRecord(r);pushHistory({type:'add',id:r.id});map.closePopup(pop);clearDraft();snapshot();status.textContent='追加しました'}},0)}
function beginMove(r){clearDraft();const old=[...r.latlng],touch=L.divIcon({className:'draft-touch',html:'<div class="draft-dot"></div>',iconSize:[44,44],iconAnchor:[22,22]});const marker=L.marker(r.latlng,{draggable:true,icon:touch,zIndexOffset:1000}).addTo(map),c50=L.circle(r.latlng,{radius:50,color:'#d18a00',weight:2,fillOpacity:.025}),c40=L.circle(r.latlng,{radius:40,color:'#8d62c1',weight:2,dashArray:'5 4',fillOpacity:.015});draft={marker,c50,c40};updateDraftCircles();marker.on('drag',e=>{c50.setLatLng(e.target.getLatLng());c40.setLatLng(e.target.getLatLng())});marker.on('dragend',()=>{const n=marker.getLatLng();r.latlng=[n.lat,n.lng];pushHistory({type:'move',id:r.id,from:old,to:[n.lat,n.lng]});drawAll();clearDraft();snapshot();status.textContent='位置を調整しました'});status.textContent='円をドラッグして位置を調整してください'}
let polyDraft=[];function polygonTap(e){if(activeTool!=='polygon')return;polyDraft.push([e.latlng.lat,e.latlng.lng]);renderPolyDraft()}let polyLine=null;function renderPolyDraft(){if(polyLine)map.removeLayer(polyLine);if(polyDraft.length===1)polyLine=L.circleMarker(polyDraft[0],{radius:5,color:'#9a6a22'}).addTo(map);else if(polyDraft.length===2)polyLine=L.polyline(polyDraft,{color:'#9a6a22',weight:3}).addTo(map);else polyLine=L.polygon(polyDraft,{color:'#9a6a22',weight:3,fillOpacity:.08}).addTo(map);if(polyDraft.length>=3)status.textContent='ポリゴン作成中。🧰→ポリゴンをもう一度押すと確定'}map.on('click',polygonTap);
let rulerPts=[],rulerLayer=null;function rulerTap(e){if(activeTool!=='ruler')return;rulerPts.push([e.latlng.lat,e.latlng.lng]);if(rulerPts.length>2)rulerPts=[rulerPts.at(-2),rulerPts.at(-1)];if(rulerLayer)map.removeLayer(rulerLayer);if(rulerPts.length===2){rulerLayer=L.polyline(rulerPts,{color:'#344e84',weight:4}).addTo(map);const d=map.distance(rulerPts[0],rulerPts[1]);status.textContent=`距離 ${d.toFixed(1)}m`}}map.on('click',rulerTap);
function selectTool(tool){if(tool==='polygon'&&activeTool==='polygon'&&polyDraft.length>=3){polygons.push({id:String(Date.now()),points:[...polyDraft]});pushHistory({type:'polygon-add',id:polygons.at(-1).id});polyDraft=[];if(polyLine)map.removeLayer(polyLine);polyLine=null;drawAll();snapshot();status.textContent='ポリゴンを確定しました';activeTool='';renderTools();return}activeTool=activeTool===tool?'':tool;clearDraft();if(activeTool==='add')addDraft();if(activeTool==='polygon'){polyDraft=[];status.textContent='地図を2点以上タップして線を描きます'}if(activeTool==='ruler'){rulerPts=[];if(rulerLayer){map.removeLayer(rulerLayer);rulerLayer=null}status.textContent='2点をタップすると距離を測れます'}if(activeTool==='move')status.textContent='移動したい新規スポットをタップしてください';renderTools()}
function renderTools(){toolMenu.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tool===activeTool))}toolMenu.querySelectorAll('button').forEach(b=>b.onclick=()=>selectTool(b.dataset.tool));$('toolbox').onclick=()=>toolMenu.classList.toggle('open');
$('layerButton').onclick=()=>{layerPanel.classList.toggle('open');circlePanel.classList.remove('open')};$('circleButton').onclick=()=>{circlePanel.classList.toggle('open');layerPanel.classList.remove('open')};circlePanel.querySelectorAll('button').forEach(b=>b.onclick=()=>{circleMode=b.dataset.circle;circlePanel.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));updateDraftCircles();snapshot()});
$('mapToggle').onclick=()=>{if(aerialOn){map.removeLayer(aerial);base.addTo(map);aerialOn=false;$('mapToggle').textContent='地図切り替え'}else{map.removeLayer(base);aerial.addTo(map);aerialOn=true;$('mapToggle').textContent='航空写真'} };
$('locate').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],18);status.textContent='現在地へ移動しました'},()=>status.textContent='現在地を取得できませんでした',{enableHighAccuracy:true,timeout:10000}):null;
function byId(id){return records.find(r=>r.id===id)}function doUndo(){const a=undoStack.pop();if(!a)return;if(a.type==='add'){const r=byId(a.id);if(r)r.deleted=true}else if(a.type==='move'){const r=byId(a.id);if(r)r.latlng=a.from}else if(a.type==='polygon-add'){const p=polygons.find(x=>x.id===a.id);if(p)p.deleted=true}redoStack.push(a);records=records.filter(r=>!r.deleted||r.id!==a.id);polygons=polygons.filter(p=>!p.deleted);drawAll();snapshot();updateHistory()}function doRedo(){const a=redoStack.pop();if(!a)return;if(a.type==='add'){const r=byId(a.id);if(r)r.deleted=false}else if(a.type==='move'){const r=byId(a.id);if(r)r.latlng=a.to}undoStack.push(a);drawAll();snapshot();updateHistory()}$('undo').onclick=doUndo;$('redo').onclick=doRedo;
async function readFile(file){sourceName=file.name.replace(/\.(kmz|kml|zip)$/i,'')||'campsite';const ext=file.name.split('.').pop().toLowerCase();if(ext==='kml')return await file.text();if(!['kmz','zip'].includes(ext))throw Error('KMZ / KML / ZIP を選択してください');const zip=await JSZip.loadAsync(await file.arrayBuffer()),names=Object.keys(zip.files),name=names.find(n=>/doc\.kml$/i.test(n))||names.find(n=>/\.kml$/i.test(n));if(!name)throw Error('KMLが見つかりません');return await zip.file(name).async('text')}
function folder(pm){let n=pm.parentElement;while(n){if(n.localName==='Folder'){const x=[...n.children].find(e=>e.localName==='name');return x?.textContent?.trim()||''}n=n.parentElement}return''}function childText(pm,tag){const e=[...pm.children].find(x=>x.localName===tag);return e?.textContent?.trim()||''}
function parse(kml){xmlText=kml;records=[];const doc=new DOMParser().parseFromString(kml,'application/xml'),bounds=[];[...doc.getElementsByTagNameNS('*','Placemark')].forEach(pm=>{const pt=pm.getElementsByTagNameNS('*','Point')[0],co=pt?.getElementsByTagNameNS('*','coordinates')[0];if(!co)return;const a=co.textContent.trim().split(',').map(Number);if(!Number.isFinite(a[0])||!Number.isFinite(a[1]))return;const title=childText(pm,'name')||'名称なし',f=folder(pm),layer=inferLayer(f,title),r={id:crypto.randomUUID?.()||String(Math.random()),layer,latlng:[a[1],a[0]],title,memo:'',deleted:false,source:true};records.push(r);bounds.push(r.latlng)});drawAll();if(bounds.length)map.fitBounds(bounds,{padding:[28,28],maxZoom:18});status.textContent=`読込完了：${records.length}地点`}
function beginEditor(){entry.classList.add('hidden');$('transition').classList.add('go');setTimeout(()=>{$('transition').classList.remove('go');map.invalidateSize()},650)}
entryFile.onchange=()=>{const f=entryFile.files?.[0];if(!f)return;pendingFile=f;entryFileName.textContent=f.name;const ext=f.name.split('.').pop().toLowerCase();if(!['kmz','kml','zip'].includes(ext)){pendingFile=null;start.disabled=true;start.classList.remove('ready');entryState.textContent='KMZ / KML / ZIP を選択してください。';return}start.disabled=false;start.classList.add('ready');entryState.textContent='ファイルを読み込めます。'};
start.onclick=async()=>{if(!pendingFile)return;start.disabled=true;entryState.textContent='読み込み中…';try{parse(await readFile(pendingFile));snapshot();beginEditor()}catch(e){entryState.textContent=e.message||'読み込みに失敗しました';start.disabled=false}};
function restore(){try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(!s)return false;sourceName=s.sourceName||'campsite';xmlText=s.xmlText||'';records=s.records||[];polygons=s.polygons||[];activeLayer=s.activeLayer||'new-pokestop';circleMode=s.circleMode||'both';drawAll();renderLayerPanel();if(s.center)map.setView(s.center,s.zoom||16);return true}catch(e){return false}}
if(localStorage.getItem(STORE))resume.classList.add('show');resume.onclick=()=>{if(restore()){beginEditor();status.textContent='前回作業を復元しました'}};$('back').onclick=()=>{snapshot();entry.classList.remove('hidden')};
function kmlEscape(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}async function exportKmz(){const folders=layerDefs.map(([k,label])=>{const items=records.filter(r=>r.layer===k&&!r.deleted).map(r=>`<Placemark><name>${kmlEscape(r.title)}</name><description>${kmlEscape(r.memo)}</description><Point><coordinates>${r.latlng[1]},${r.latlng[0]},0</coordinates></Point></Placemark>`).join('');return `<Folder><name>${kmlEscape(label)}</name>${items}</Folder>`}).join('');const poly=polygons.map((p,i)=>`<Placemark><name>ポリゴン ${i+1}</name><Polygon><outerBoundaryIs><LinearRing><coordinates>${[...p.points,p.points[0]].map(x=>`${x[1]},${x[0]},0`).join(' ')}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`).join('');const kml=`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${kmlEscape(sourceName)}</name>${folders}<Folder><name>ポリゴン</name>${poly}</Folder></Document></kml>`;const zip=new JSZip();zip.file('doc.kml',kml);const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=sourceName+'_creative.kmz';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);status.textContent='KMZを書き出しました'}$('save').onclick=exportKmz;
})();
