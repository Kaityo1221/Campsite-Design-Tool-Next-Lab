<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>FIELD MODE | Next Lab</title>
</head>
<body>
<script>
(async()=>{
  const VERSION='20260910-01';
  const res=await fetch('./prototype.html?v='+VERSION,{cache:'no-store'});
  if(!res.ok){document.body.textContent='FIELD MODEの読み込みに失敗しました。';return;}
  let html=await res.text();

  // Expose only the rendered map instance to the read-only FIELD consumer.
  // The consumer never triggers Core AI execution.
  html=html.replace('const map=new maplibregl.Map','const map=window.__FIELD_MAP__=new maplibregl.Map');

  const target="document.body.classList.add('park-open');";
  const replacement="const params=new URLSearchParams({park:p.name,distance:String(p.distance),rank:p.rank,poi:String(p.poi),lng:String(p.lng),lat:String(p.lat),originLng:String(origin.lng),originLat:String(origin.lat)});const inherited=new URLSearchParams(location.search);const fieldPayloadUrl=inherited.get('fieldPayloadUrl');if(fieldPayloadUrl)params.set('fieldPayloadUrl',fieldPayloadUrl);const fieldBind=inherited.get('fieldBind');if(fieldBind)params.set('fieldBind',fieldBind);location.href='./explore-shell.html?'+params.toString();return;";
  html=html.replace(target,replacement);
  html=html.replace('</body>',`<script type="module" src="./field-mode-consumer.js?v=${VERSION}"><\/script></body>`);

  document.open();document.write(html);document.close();
})().catch(err=>{console.error(err);document.body.textContent='FIELD MODEの読み込みに失敗しました。';});
</script>
</body>
</html>
