<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>CREATIVE MODE | Next Lab</title>
</head>
<body>
<script>
(async()=>{
  const CACHE_VERSION='20260909-01';
  const [runtimeRes,patchRes,patchV3Res,patchV4Res,trackingRes,backfillRes]=await Promise.all([
    fetch('./runtime-vnext.html?v='+CACHE_VERSION,{cache:'no-store'}),
    fetch('./creative-patches-v2.js?v='+CACHE_VERSION,{cache:'no-store'}),
    fetch('./creative-patches-v3.js?v='+CACHE_VERSION,{cache:'no-store'}),
    fetch('./creative-patches-v4.js?v='+CACHE_VERSION,{cache:'no-store'}),
    fetch('./creative-tracking-patch.js?v='+CACHE_VERSION,{cache:'no-store'}),
    fetch('./creative-backfill-upload.js?v='+CACHE_VERSION,{cache:'no-store'})
  ]);
  if(!runtimeRes.ok||!patchRes.ok||!patchV3Res.ok||!patchV4Res.ok||!trackingRes.ok||!backfillRes.ok){document.body.textContent='Creative Modeの読み込みに失敗しました。';return;}
  let src=await runtimeRes.text();

  // runtime-vnext が base-v7.html を読み込んだ直後に、削除済み旧main参照を固定コミットへ差し替える。
  const oldBg='https://raw.githubusercontent.com/Kaityo1221/campsite-design-tool-adv-lab/main/creative/runtime/assets/creative-mode-opening.png';
  const fixedBg='https://raw.githubusercontent.com/Kaityo1221/campsite-design-tool-adv-lab/1c27ca3ef14f423688f755d350ecc602bee1c573/creative/runtime/assets/creative-mode-opening.png';
  const immersiveNeedle='<div class="entry-note">編集内容は自動保存されます。</div>';
  const immersiveButton='<a href="./field-immersive-dev.html" style="display:grid;place-items:center;min-height:38px;margin-top:2px;border:1px solid rgba(255,239,200,.28);border-radius:12px;background:rgba(36,31,24,.64);color:#ffe19b;font-size:11px;font-weight:950;letter-spacing:.06em;text-decoration:none">🧭 おまけ</a>';
  const baseLoadNeedle='let html=await res.text();';
  if(src.includes(baseLoadNeedle)){
    const runtimePatch=`\n  html=html.replace(${JSON.stringify(oldBg)},${JSON.stringify(fixedBg)});\n  const immersiveNeedle=${JSON.stringify(immersiveNeedle)};\n  const immersiveButton=${JSON.stringify(immersiveButton)};\n  if(html.includes(immersiveNeedle))html=html.replace(immersiveNeedle,immersiveNeedle+immersiveButton);`;
    src=src.replace(baseLoadNeedle,baseLoadNeedle+runtimePatch);
  }

  Function(await patchRes.text())();
  Function(await patchV3Res.text())();
  Function(await patchV4Res.text())();
  Function(await trackingRes.text())();
  Function(await backfillRes.text())();
  if(typeof window.applyCreativePatches!=='function'||typeof window.applyCreativeTrackingPatch!=='function'||typeof window.applyCreativeBackfillUpload!=='function'){document.body.textContent='Creative Modeの拡張機能を読み込めませんでした。';return;}
  src=window.applyCreativePatches(src);
  src=window.applyCreativeTrackingPatch(src);
  src=window.applyCreativeBackfillUpload(src);

  // 編集フォームの「保存」でタイトル・メモ・レイヤーをまとめて反映する。
  const editRecordNeedle="function editRecordView(wrap,r,popup){const edit=wrap.querySelector('.popup-edit');edit.classList.add('open');wrap.querySelector('#editTitle').value=r.title||'';wrap.querySelector('#editMemo').value=r.memo||'';wrap.querySelector('#saveEdit').onclick=()=>{r.title=wrap.querySelector('#editTitle').value.trim()||layerDefs.find(x=>x[0]===r.layer)?.[1]||'名称なし';r.memo=wrap.querySelector('#editMemo').value.trim();drawAll();snapshot();map.closePopup(popup);msg('編集しました')}}";
  const editRecordReplacement="function editRecordView(wrap,r,popup){const edit=wrap.querySelector('.popup-edit');edit.classList.add('open');wrap.querySelector('#editTitle').value=r.title||'';wrap.querySelector('#editMemo').value=r.memo||'';wrap.querySelector('#saveEdit').onclick=()=>{const from=r.layer,to=wrap.querySelector('#moveLayer')?.value||from;r.title=wrap.querySelector('#editTitle').value.trim()||layerDefs.find(x=>x[0]===to)?.[1]||'名称なし';r.memo=wrap.querySelector('#editMemo').value.trim();if(from!==to){r.layer=to;pushHistory({type:'layer',id:r.id,from,to})}drawAll();snapshot();map.closePopup(popup);msg(from!==to?'編集・レイヤー変更を保存しました':'編集しました')}}";
  if(src.includes(editRecordNeedle))src=src.replace(editRecordNeedle,editRecordReplacement);

  // iPhoneではKMZがZIP系MIMEとして扱われ、accept指定があると選択不能になることがある。
  // 選択後のCreative Mode側判定は維持し、ファイルピッカー入口のaccept制限だけ外す。
  src=src.replace(/multiple accept="[^"]*"/g,'multiple');

  // 旧マニュアル互換：My Mapsへnearby-wayspots CSVを個別投入したKMZでも、
  // ExtendedDataのgameEntity（POKESTOP / GYM / POWERSPOT）を優先して正式レイヤーへ振り分ける。
  const runtimeWriteNeedle='document.open();document.write(html);document.close();';
  const legacyLayerPatch=`const legacyInferNeedle="function inferLayer(pm,f,n){const explicit=explicitLayer(pm);if(explicit)return explicit;const exact=layerByLabel.get(String(f||'').trim());if(exact)return exact;const style=(child(pm,'styleUrl')||'').replace(/^#/,'');if(style.startsWith('creative-')){const styled=style.slice('creative-'.length);if(layerKeys.has(styled))return styled}const h=(f+' '+n).toLowerCase(),fresh=/追加|新規|候補|add|new|planned/.test(h);if(/gym|ジム/.test(h))return fresh?'new-gym':'existing-gym';if(/power|パワー/.test(h))return fresh?'new-power':'existing-power';return fresh?'new-pokestop':'existing-pokestop'}";\nconst legacyInferReplacement="function legacyGameEntity(pm){for(const data of pm.getElementsByTagNameNS('*','Data')){const key=String(data.getAttribute('name')||'').replace(/^\\uFEFF/,'').trim().toLowerCase();if(key!=='gameentity')continue;const value=[...data.children].find(x=>x.localName==='value')?.textContent?.trim()||data.textContent?.trim()||'';return String(value).trim().toUpperCase()}return''}function inferLayer(pm,f,n){const explicit=explicitLayer(pm);if(explicit)return explicit;const exact=layerByLabel.get(String(f||'').trim());if(exact)return exact;const style=(child(pm,'styleUrl')||'').replace(/^#/,'');if(style.startsWith('creative-')){const styled=style.slice('creative-'.length);if(layerKeys.has(styled))return styled}const h=(f+' '+n).toLowerCase(),fresh=/追加|新規|候補|add|new|planned/.test(h),entity=legacyGameEntity(pm);if(entity==='GYM')return fresh?'new-gym':'existing-gym';if(entity==='POWERSPOT'||entity==='POWER_SPOT'||entity==='POWER SPOT')return fresh?'new-power':'existing-power';if(entity==='POKESTOP'||entity==='POKÉSTOP'||entity==='POKE_STOP')return fresh?'new-pokestop':'existing-pokestop';if(/gym|ジム/.test(h))return fresh?'new-gym':'existing-gym';if(/power|パワー/.test(h))return fresh?'new-power':'existing-power';return fresh?'new-pokestop':'existing-pokestop'}";\nif(html.includes(legacyInferNeedle))html=html.replace(legacyInferNeedle,legacyInferReplacement);`;
  if(src.includes(runtimeWriteNeedle))src=src.replace(runtimeWriteNeedle,legacyLayerPatch+runtimeWriteNeedle);

  document.open();document.write(src);document.close();
})().catch(err=>{console.error(err);document.body.textContent='Creative Modeの読み込みに失敗しました。';});
</script>
</body>
</html>
