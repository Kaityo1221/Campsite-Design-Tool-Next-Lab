name: creative-color-patch

on:
  push:
    branches:
      - agent/creative-dev-patches

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-dev-patches

      - name: Patch new game spot colors only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('creative/index.html')
          s=p.read_text()
          old="const layerDefs=[['existing-pokestop','既存 PokéStop','#3f89c9'],['existing-gym','既存 Gym','#d85454'],['existing-power','既存 PowerSpot','#8656b8'],['new-pokestop','新規 PokéStop','#e6a400'],['new-gym','新規 Gym','#d06b2f'],['new-power','新規 PowerSpot','#9d6bd1']];"
          new="const layerDefs=[['existing-pokestop','既存 PokéStop','#3f89c9'],['existing-gym','既存 Gym','#d85454'],['existing-power','既存 PowerSpot','#8656b8'],['new-pokestop','新規 PokéStop','#2F80ED'],['new-gym','新規 Gym','#C69200'],['new-power','新規 PowerSpot','#9D6BD1']];"
          if s.count(old)!=1:
              raise SystemExit(f'layerDefs match count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('creative/index.html').read_text()
          m=re.search(r'<script>\s*(\(\(\)=>\{.*?\}\)\(\);)\s*</script>',s,re.S)
          if not m: raise SystemExit('inline app script not found')
          Path('/tmp/creative-app.js').write_text(m.group(1))
          PY
          node --check /tmp/creative-app.js
          git config user.name "creative-lab-bot"
          git config user.email "creative-lab-bot@users.noreply.github.com"
          git add creative/index.html
          git commit -m "Set new game spot marker colors"
          git push origin HEAD:agent/creative-dev-patches
