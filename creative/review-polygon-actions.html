<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>CREATIVE MODE | Polygon Actions Review</title>
</head>
<body>
<script>
(async()=>{
  const raw='https://raw.githubusercontent.com/Kaityo1221/Campsite-Design-Tool-Next-Lab/agent/creative-dev-batch/creative/index.html';
  const res=await fetch(raw,{cache:'no-store'});
  if(!res.ok){document.body.textContent='レビュー画面の読み込みに失敗しました。';return;}
  let html=await res.text();

  const rowOld="b.disabled=true;b.title='表示 / 非表示のみ';";
  const rowNew="b.disabled=count===0;b.title='やり直し';b.onclick=()=>openPolygonActions();";
  if(!html.includes(rowOld)){document.body.textContent='ポリゴン操作の更新位置が見つかりません。';return;}
  html=html.replace(rowOld,rowNew);

  const drawAnchor='function drawAll(){';
  const actions=`
let polygonActionMenu=null;
function closePolygonActions(){if(polygonActionMenu){polygonActionMenu.remove();polygonActionMenu=null}}
function openPolygonActions(){
  closeMenus();closePolygonActions();
  const target=polygons.find(p=>!p.deleted);
  if(!target){msg('ポリゴンはありません');return}
  const wrap=document.createElement('div'),redo=document.createElement('button'),close=document.createElement('button');
  Object.assign(wrap.style,{position:'fixed',left:'50%',transform:'translateX(-50%)',bottom:'calc(132px + env(safe-area-inset-bottom))',zIndex:'1600',display:'grid',gridTemplateColumns:'1fr auto',gap:'8px',alignItems:'center',padding:'8px',borderRadius:'16px',background:'rgba(48,40,29,.96)',boxShadow:'0 8px 24px rgba(0,0,0,.28)'});
  const common={height:'48px',padding:'0 18px',border:'2px solid #8a6b31',borderRadius:'13px',fontWeight:'950',fontSize:'14px'};
  redo.type='button';redo.textContent='↻ やり直し';Object.assign(redo.style,common,{background:'#fff8e6',color:'#37270c',minWidth:'180px'});
  close.type='button';close.textContent='×';Object.assign(close.style,{width:'44px',height:'44px',border:'2px solid #8a6b31',borderRadius:'13px',background:'#fffdf7',color:'#5d4630',fontWeight:'950',fontSize:'22px'});
  wrap.append(redo,close);document.body.appendChild(wrap);polygonActionMenu=wrap;
  close.onclick=closePolygonActions;
  redo.onclick=()=>{
    if(!confirm('現在のポリゴンを削除して、最初から描き直しますか？'))return;
    target.deleted=true;closePolygonActions();drawAll();renderLayerPanel();snapshot();
    activeTool='polygon';renderTools();beginCrosshairPolygon();msg('ポリゴンを最初から描き直してください',2200);
  };
}
`;
  if(!html.includes(drawAnchor)){document.body.textContent='ポリゴン操作の関数位置が見つかりません。';return;}
  html=html.replace(drawAnchor,actions+drawAnchor);

  document.open();document.write(html);document.close();
})().catch(()=>{document.body.textContent='レビュー画面の読み込みに失敗しました。';});
</script>
</body>
</html>
