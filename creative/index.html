<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>CREATIVE MODE | Next Lab</title>
</head>
<body>
<script>
(async()=>{
  const [runtimeRes,patchRes]=await Promise.all([
    fetch('./runtime-vnext.html',{cache:'no-store'}),
    fetch('./creative-patches-v2.js',{cache:'no-store'})
  ]);
  if(!runtimeRes.ok||!patchRes.ok){document.body.textContent='Creative Modeの読み込みに失敗しました。';return;}
  let src=await runtimeRes.text();
  const patchCode=await patchRes.text();
  Function(patchCode)();
  if(typeof window.applyCreativePatches!=='function'){document.body.textContent='Creative Modeの拡張機能を読み込めませんでした。';return;}
  src=window.applyCreativePatches(src);
  document.open();document.write(src);document.close();
})().catch(()=>{document.body.textContent='Creative Modeの読み込みに失敗しました。';});
</script>
</body>
</html>
