name: creative-display-match-export

on:
  push:
    branches:
      - agent/creative-dev-patches

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-dev-patches

      - name: Match CREATIVE MODE spot display to KMZ export icons
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('creative/index.html')
          s=p.read_text()
          old="function recordIcon(r){const src={'existing-pokestop':'assets/pokestop.png','existing-gym':'assets/gym.png','existing-power':'assets/powerspot.png'}[r.layer];if(src)return L.divIcon({className:'',html:`<img class=\"poi-image-icon\" src=\"${src}\" alt=\"\">`,iconSize:[36,36],iconAnchor:[18,18]});return L.divIcon({className:'',html:`<div class=\"poi-dot\" style=\"background:${color(r.layer)}\"></div>`,iconSize:[16,16],iconAnchor:[8,8]})}"
          new="function recordIcon(r){const pin={'new-pokestop':'https://maps.google.com/mapfiles/ms/icons/blue-dot.png','new-gym':'https://maps.google.com/mapfiles/ms/icons/yellow-dot.png','new-power':'https://maps.google.com/mapfiles/ms/icons/purple-dot.png'}[r.layer];if(pin)return L.icon({iconUrl:pin,iconSize:[32,32],iconAnchor:[16,32],popupAnchor:[0,-30]});const c=color(r.layer);return L.divIcon({className:'',html:`<svg width=\"28\" height=\"28\" viewBox=\"0 0 28 28\" aria-hidden=\"true\"><circle cx=\"14\" cy=\"14\" r=\"11\" fill=\"${c}\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"14\" cy=\"14\" r=\"5.5\" fill=\"#fff\"/></svg>`,iconSize:[28,28],iconAnchor:[14,14]})}"
          if s.count(old)!=1:
              raise SystemExit(f'recordIcon match count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('creative/index.html').read_text()
          m=re.search(r'<script>\s*(\(\(\)=>\{.*?\}\)\(\);)\s*</script>',s,re.S)
          if not m: raise SystemExit('inline app script not found')
          Path('/tmp/creative-app.js').write_text(m.group(1))
          PY
          node --check /tmp/creative-app.js
          git config user.name "creative-lab-bot"
          git config user.email "creative-lab-bot@users.noreply.github.com"
          git add creative/index.html
          git commit -m "Match CREATIVE MODE icons to KMZ export"
          git push origin HEAD:agent/creative-dev-patches
