name: creative-existing-circle-new-pushpin-patch

on:
  push:
    branches:
      - agent/creative-dev-patches

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-dev-patches

      - name: Use Google circle icons for existing spots and Google pushpins for new spots
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('creative/index.html')
          s=p.read_text()
          old="const exportIcons={'existing-pokestop':'https://maps.google.com/mapfiles/ms/icons/blue-dot.png','existing-gym':'https://maps.google.com/mapfiles/ms/icons/red-dot.png','existing-power':'https://maps.google.com/mapfiles/ms/icons/purple-dot.png','new-pokestop':'https://maps.google.com/mapfiles/kml/pushpin/blue-pushpin.png','new-gym':'https://maps.google.com/mapfiles/kml/pushpin/ylw-pushpin.png','new-power':'https://maps.google.com/mapfiles/kml/pushpin/purple-pushpin.png'};Object.entries(exportIcons).forEach(([k,href])=>{const style=makeEl(xml,'Style'),iconStyle=makeEl(xml,'IconStyle'),scale=makeEl(xml,'scale',k.startsWith('new-')?'1.15':'0.9'),icon=makeEl(xml,'Icon');style.setAttribute('id','creative-'+k);icon.appendChild(makeEl(xml,'href',href));iconStyle.append(scale,icon);style.appendChild(iconStyle);doc.appendChild(style)})"
          new="const exportIcons={'existing-pokestop':'https://maps.google.com/mapfiles/kml/shapes/placemark_circle.png','existing-gym':'https://maps.google.com/mapfiles/kml/shapes/placemark_circle.png','existing-power':'https://maps.google.com/mapfiles/kml/shapes/placemark_circle.png','new-pokestop':'https://maps.google.com/mapfiles/kml/pushpin/blue-pushpin.png','new-gym':'https://maps.google.com/mapfiles/kml/pushpin/ylw-pushpin.png','new-power':'https://maps.google.com/mapfiles/kml/pushpin/purple-pushpin.png'},exportColors={'existing-pokestop':'ffc9893f','existing-gym':'ff5454d8','existing-power':'ffb85686'};Object.entries(exportIcons).forEach(([k,href])=>{const style=makeEl(xml,'Style'),iconStyle=makeEl(xml,'IconStyle'),scale=makeEl(xml,'scale',k.startsWith('new-')?'1.15':'0.95'),icon=makeEl(xml,'Icon');style.setAttribute('id','creative-'+k);if(exportColors[k])iconStyle.appendChild(makeEl(xml,'color',exportColors[k]));icon.appendChild(makeEl(xml,'href',href));iconStyle.append(scale,icon);style.appendChild(iconStyle);doc.appendChild(style)})"
          if s.count(old)!=1:
              raise SystemExit(f'icon export block match count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('creative/index.html').read_text()
          m=re.search(r'<script>\s*(\(\(\)=>\{.*?\}\)\(\);)\s*</script>',s,re.S)
          if not m: raise SystemExit('inline app script not found')
          Path('/tmp/creative-app.js').write_text(m.group(1))
          PY
          node --check /tmp/creative-app.js
          git config user.name "creative-lab-bot"
          git config user.email "creative-lab-bot@users.noreply.github.com"
          git add creative/index.html
          git commit -m "Use Google circle icons for existing spots"
          git push origin HEAD:agent/creative-dev-patches
