<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREATIVE MODE Diagnostic</title><style>html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#log{position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:rgba(20,20,20,.92);color:#fff;padding:10px;border-radius:10px;font-size:12px;max-height:34vh;overflow:auto;white-space:pre-wrap}#log.ok{background:rgba(28,92,46,.94)}</style></head><body><div id="log">診断ページを準備中…</div><script>(async()=>{const log=document.getElementById('log');try{let html=await fetch('./index.html?diag='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('index.html HTTP '+r.status);return r.text()});const hook=`<script>window.addEventListener('error',e=>parent.postMessage({type:'creative-error',message:e.message,source:e.filename,line:e.lineno,col:e.colno},'*'));window.addEventListener('unhandledrejection',e=>parent.postMessage({type:'creative-error',message:String(e.reason&&e.reason.message||e.reason)},'*'));parent.postMessage({type:'creative-hook-ready'},'*');<\/script>`;html=html.replace('</head>',hook+'</head>');window.addEventListener('message',e=>{if(e.data?.type==='creative-error'){log.classList.remove('ok');log.textContent='JavaScriptエラー\n'+e.data.message+'\n'+(e.data.source||'')+':'+(e.data.line||'')+':'+(e.data.col||'')}else if(e.data?.type==='creative-hook-ready'){log.classList.add('ok');log.textContent='診断フック起動。ファイルを選択してください。エラーが出たらここに表示します。'}});const frame=document.createElement('iframe');frame.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0';document.body.prepend(frame);frame.contentWindow.document.open();frame.contentWindow.document.write(html);frame.contentWindow.document.close()}catch(err){log.textContent='診断ページ読込失敗: '+err.message}})();</script></body></html>
