<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>FIELD EXPLORATION | Next Lab</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
:root{--ink:#17342c;--muted:#60756d;--green:#1f7256;--green-dark:#14563f;--shadow:0 18px 50px rgba(25,54,44,.20)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#dfe9df;color:var(--ink)}
button{font:inherit}
#map{position:fixed;inset:0}
.maplibregl-ctrl-top-right{top:calc(78px + env(safe-area-inset-top));right:8px}
.maplibregl-ctrl-attrib{font-size:9px!important}
.topbar{position:fixed;z-index:30;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
.back,.status,.park-chip,.demo-button,.demo-panel,.poi-info{border:1px solid rgba(24,73,57,.14);background:rgba(255,255,250,.94);box-shadow:0 8px 22px rgba(27,57,47,.13);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.back{pointer-events:auto;border-radius:999px;padding:10px 13px;color:var(--green-dark);font-size:12px;font-weight:950}
.status{pointer-events:none;border-radius:999px;padding:9px 11px;font-size:10px;font-weight:900;color:#2f6c54;display:flex;align-items:center;gap:7px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#2f9b70;box-shadow:0 0 0 4px rgba(47,155,112,.16)}
.park-chip{position:fixed;z-index:24;left:12px;top:calc(64px + env(safe-area-inset-top));max-width:min(58vw,240px);border-radius:16px;padding:8px 11px}
.park-chip small{display:block;font-size:8px;font-weight:950;letter-spacing:.11em;color:#6a7f78}
.park-chip strong{display:block;margin-top:2px;font-size:15px;line-height:1.15}
.poi{width:30px;height:30px;border:0;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 5px 14px rgba(20,64,51,.25);font-size:9px;font-weight:1000;color:#fff;padding:0}
.poi.stop{background:#3387d6}.poi.gym{background:#d95f58}.poi.power{background:#8d66c9}
.poi.selected{width:36px;height:36px;box-shadow:0 0 0 4px rgba(255,255,255,.75),0 8px 20px rgba(20,64,51,.30)}
.user-dot{width:20px;height:20px;border-radius:50%;background:#1d76d2;border:4px solid #fff;box-shadow:0 0 0 5px rgba(29,118,210,.20),0 4px 12px rgba(20,64,105,.3)}
.demo-button{position:fixed;z-index:26;left:12px;bottom:calc(14px + env(safe-area-inset-bottom));border-radius:999px;padding:9px 12px;color:var(--green-dark);font-size:10px;font-weight:950}
.demo-panel{display:none;position:fixed;z-index:27;left:12px;bottom:calc(58px + env(safe-area-inset-bottom));width:min(78vw,290px);border-radius:16px;padding:11px 12px;font-size:9px;line-height:1.55;color:#5f726a}
.demo-panel.open{display:block}
.demo-panel b{display:block;margin-bottom:4px;color:var(--green-dark);font-size:10px}
.poi-info{display:none;position:fixed;z-index:28;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(76vw,310px);border-radius:16px;padding:10px 34px 10px 12px}
.poi-info.open{display:block}
.poi-info small{display:block;font-size:8px;font-weight:950;letter-spacing:.08em;color:#71837c}
.poi-info strong{display:block;margin-top:2px;font-size:13px;line-height:1.2}
.poi-info span{display:block;margin-top:3px;font-size:9px;color:#5d7068;font-weight:800}
.poi-close{position:absolute;right:8px;top:8px;border:0;background:transparent;color:#65766f;font-size:18px;line-height:1;padding:2px}
@media(max-width:380px){.park-chip strong{font-size:14px}.poi-info{width:min(80vw,290px)}}
</style>
</head>
<body>
<div id="map" aria-label="FIELD exploration map"></div>
<div class="topbar">
  <button id="backButton" class="back" type="button">← ブリーフィング</button>
  <div class="status"><span class="status-dot"></span>探索中 / DEMO</div>
</div>
<div class="park-chip">
  <small>FIELD EXPLORATION / DEMO</small>
  <strong id="parkName">候補公園</strong>
</div>
<button id="demoButton" class="demo-button" type="button">DEMO</button>
<div id="demoPanel" class="demo-panel">
  <b>UI確認用データ</b>
  緑線：公園境界（仮）。本番はGIS実データへ置換します。<br>
  色付き点：既存POI（仮）。<br>
  50m円：POIをタップした時だけ表示します。<br>
  AI / Bridge / R2 には接続していません。
</div>
<div id="poiInfo" class="poi-info" aria-live="polite">
  <button id="poiClose" class="poi-close" type="button" aria-label="閉じる">×</button>
  <small id="poiType">POI</small>
  <strong id="poiName">既存POI</strong>
  <span>この地点を中心に50m確認円を表示中</span>
</div>
<script>
(()=>{
  const q=new URLSearchParams(location.search);
  const park={
    name:q.get('park')||'候補公園',
    distance:Number(q.get('distance')||0),
    rank:q.get('rank')||'-',
    poi:Number(q.get('poi')||0),
    lng:Number(q.get('lng')||139.7740),
    lat:Number(q.get('lat')||35.7148)
  };
  const origin={lng:Number(q.get('originLng')||park.lng),lat:Number(q.get('originLat')||park.lat)};
  document.getElementById('parkName').textContent=park.name;

  function destination(point,distanceM,bearingDeg){
    const R=6371000,brng=bearingDeg*Math.PI/180,lat1=point.lat*Math.PI/180,lng1=point.lng*Math.PI/180,dr=distanceM/R;
    const lat2=Math.asin(Math.sin(lat1)*Math.cos(dr)+Math.cos(lat1)*Math.sin(dr)*Math.cos(brng));
    const lng2=lng1+Math.atan2(Math.sin(brng)*Math.sin(dr)*Math.cos(lat1),Math.cos(dr)-Math.sin(lat1)*Math.sin(lat2));
    return{lng:lng2*180/Math.PI,lat:lat2*180/Math.PI};
  }
  function circleGeoJSON(point,radiusM){
    const coords=[];
    for(let i=0;i<=96;i++){const p=destination(point,radiusM,i/96*360);coords.push([p.lng,p.lat]);}
    return{type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[coords]}};
  }
  function emptyGeoJSON(){return{type:'FeatureCollection',features:[]};}
  function boundaryGeoJSON(){
    const spec=[[0,145],[48,118],[95,155],[142,112],[190,148],[236,120],[285,158],[330,126]];
    const pts=spec.map(([b,d])=>destination(park,d,b));pts.push(pts[0]);
    return{type:'Feature',properties:{demo:true},geometry:{type:'Polygon',coordinates:[pts.map(p=>[p.lng,p.lat])]}};
  }

  const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[park.lng,park.lat],zoom:16.1,attributionControl:false});
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
  map.addControl(new maplibregl.AttributionControl({compact:true}),'top-right');

  const poiInfo=document.getElementById('poiInfo');
  const poiType=document.getElementById('poiType');
  const poiName=document.getElementById('poiName');
  let selectedPoiEl=null;

  function clearPoiSelection(){
    if(selectedPoiEl)selectedPoiEl.classList.remove('selected');
    selectedPoiEl=null;
    poiInfo.classList.remove('open');
    const src=map.getSource('circle-50');
    if(src)src.setData(emptyGeoJSON());
  }

  function selectPoi(poi,el){
    if(selectedPoiEl)selectedPoiEl.classList.remove('selected');
    selectedPoiEl=el;
    el.classList.add('selected');
    poiType.textContent=poi.typeName+' / DEMO';
    poiName.textContent=poi.name;
    poiInfo.classList.add('open');
    const src=map.getSource('circle-50');
    if(src)src.setData(circleGeoJSON(poi,50));
    map.easeTo({center:[poi.lng,poi.lat],duration:350});
  }

  map.on('load',()=>{
    map.addSource('demo-boundary',{type:'geojson',data:boundaryGeoJSON()});
    map.addLayer({id:'demo-boundary-fill',type:'fill',source:'demo-boundary',paint:{'fill-color':'#4a9d76','fill-opacity':0.08}});
    map.addLayer({id:'demo-boundary-line',type:'line',source:'demo-boundary',paint:{'line-color':'#267154','line-width':3,'line-opacity':0.82}});

    map.addSource('circle-50',{type:'geojson',data:emptyGeoJSON()});
    map.addLayer({id:'circle-50-fill',type:'fill',source:'circle-50',paint:{'fill-color':'#2f8d69','fill-opacity':0.06}});
    map.addLayer({id:'circle-50-line',type:'line',source:'circle-50',paint:{'line-color':'#246d50','line-width':2,'line-dasharray':[2,2]}});

    const user=document.createElement('div');
    user.className='user-dot';
    new maplibregl.Marker({element:user,anchor:'center'}).setLngLat([origin.lng,origin.lat]).addTo(map);

    const poiSpec=[
      [-42,38,'stop','P','PokéStop'],
      [72,61,'gym','G','Gym'],
      [150,79,'stop','P','PokéStop'],
      [218,55,'power','S','Power Spot'],
      [300,92,'stop','P','PokéStop'],
      [18,108,'gym','G','Gym']
    ];
    poiSpec.slice(0,Math.max(3,Math.min(6,park.poi||5))).forEach(([bearing,distance,type,label,typeName],i)=>{
      const pos=destination(park,distance,bearing);
      const poi={...pos,typeName,name:`既存POI ${i+1}（デモ）`};
      const el=document.createElement('button');
      el.type='button';el.className=`poi ${type}`;el.textContent=label;el.title=poi.name;
      el.addEventListener('click',e=>{e.stopPropagation();selectPoi(poi,el);});
      new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([pos.lng,pos.lat]).addTo(map);
    });

    const nw=destination(park,230,315),se=destination(park,230,135);
    map.fitBounds([[nw.lng,se.lat],[se.lng,nw.lat]],{padding:{top:110,bottom:70,left:35,right:35},duration:650,maxZoom:16.8});
  });

  map.on('click',()=>clearPoiSelection());
  document.getElementById('poiClose').addEventListener('click',clearPoiSelection);
  document.getElementById('demoButton').addEventListener('click',()=>document.getElementById('demoPanel').classList.toggle('open'));
  document.getElementById('backButton').addEventListener('click',()=>{if(history.length>1)history.back();else location.href='./';});
})();
</script>
</body>
</html>
