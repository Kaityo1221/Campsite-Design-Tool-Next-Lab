name: creative-map-license-bar

on:
  push:
    branches:
      - agent/creative-dev-patches

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-dev-patches

      - name: Add map license bar below the map
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('creative/index.html')
          s=p.read_text()

          old_css=".leaflet-control-zoom{display:none!important}.leaflet-control-attribution{font-size:7px!important;line-height:1.1!important;padding:1px 3px!important;margin:0 0 calc(64px + env(safe-area-inset-bottom)) 2px!important;background:rgba(255,255,255,.68)!important;color:#555!important;max-width:calc(100vw - 20px)!important;white-space:normal!important}.leaflet-control-attribution a{font-size:inherit!important;color:inherit!important}@media(max-width:520px){.leaflet-control-attribution{font-size:6px!important;max-width:76vw!important}}"
          new_css=".leaflet-control-zoom{display:none!important}.leaflet-control-attribution{display:none!important}.map-license{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:1090;min-height:16px;padding:2px 7px;background:rgba(255,255,255,.82);color:#555;font-size:8px;line-height:1.2;text-align:left;white-space:normal;pointer-events:auto}.map-license a{color:inherit;text-decoration:none}@media(max-width:520px){.map-license{font-size:7px;padding:2px 6px}}"
          if s.count(old_css)!=1:
              raise SystemExit(f'css match count={s.count(old_css)}')
          s=s.replace(old_css,new_css,1)

          old_html='<div id="map"></div><button id="back" class="topbtn back">← 戻る</button>'
          new_html='<div id="map"></div><div id="mapLicense" class="map-license"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></div><button id="back" class="topbtn back">← 戻る</button>'
          if s.count(old_html)!=1:
              raise SystemExit(f'html match count={s.count(old_html)}')
          s=s.replace(old_html,new_html,1)

          old_toggle="$('mapToggle').onclick=()=>{closeMenus();if(aerialOn){map.removeLayer(aerial);base.addTo(map);aerialOn=false}else{map.removeLayer(base);aerial.addTo(map);aerialOn=true}};"
          new_toggle="$('mapToggle').onclick=()=>{closeMenus();if(aerialOn){map.removeLayer(aerial);base.addTo(map);aerialOn=false;$('mapLicense').innerHTML='<a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\" rel=\"noopener\">© OpenStreetMap contributors</a>'}else{map.removeLayer(base);aerial.addTo(map);aerialOn=true;$('mapLicense').textContent='Tiles © Esri'}};"
          if s.count(old_toggle)!=1:
              raise SystemExit(f'toggle match count={s.count(old_toggle)}')
          s=s.replace(old_toggle,new_toggle,1)

          p.write_text(s)
          PY

          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('creative/index.html').read_text()
          m=re.search(r'<script>\s*(\(\(\)=>\{.*?\}\)\(\);)\s*</script>',s,re.S)
          if not m: raise SystemExit('inline app script not found')
          Path('/tmp/creative-app.js').write_text(m.group(1))
          PY
          node --check /tmp/creative-app.js

          git config user.name "creative-lab-bot"
          git config user.email "creative-lab-bot@users.noreply.github.com"
          git add creative/index.html
          git commit -m "Add responsive map license bar"
          git push origin HEAD:agent/creative-dev-patches
