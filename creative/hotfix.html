<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>CREATIVE MODE Hotfix v4</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17130f}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.hotfix-note{position:fixed;right:8px;bottom:8px;z-index:99999;padding:5px 8px;border-radius:8px;background:rgba(35,31,25,.82);color:#fff8e8;font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;pointer-events:none}.hotfix-note.err{background:rgba(130,35,25,.9)}</style></head><body><iframe id="app"></iframe><div id="note" class="hotfix-note">HOTFIX preview v4 / 起動中</div><script>(()=>{const frame=document.getElementById('app'),note=document.getElementById('note');const say=(t,err=false)=>{note.textContent='HOTFIX preview v4 / '+t;note.classList.toggle('err',err)};function loadScript(d,src){return new Promise((resolve,reject)=>{const s=d.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('load failed: '+src));d.head.appendChild(s)})}async function repair(){try{const w=frame.contentWindow,d=w.document;if(!d||!d.getElementById('entryFile'))return;if(typeof w.L==='undefined'){say('Leaflet再読込中');await loadScript(d,'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js')}if(typeof w.JSZip==='undefined'){say('JSZip再読込中');await loadScript(d,'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js')}const left=d.getElementById('leftHand'),right=d.getElementById('rightHand'),start=d.getElementById('startButton'),input=d.getElementById('entryFile'),name=d.getElementById('entryFileName'),state=d.getElementById('entryState');if(typeof left.onclick!=='function'||typeof right.onclick!=='function'||typeof start.onclick!=='function'){const main=[...d.scripts].find(s=>!s.src&&s.textContent.includes("next-lab-creative-v7"));if(!main)throw new Error('本体スクリプトを取得できません');say('本体JS再起動中');const rerun=d.createElement('script');rerun.textContent=main.textContent;d.body.appendChild(rerun);await new Promise(r=>setTimeout(r,250))}if(input&&!input.dataset.hotfixBound){input.dataset.hotfixBound='1';input.setAttribute('accept','.kmz,.kml,.zip,application/vnd.google-earth.kmz,application/vnd.google-earth.kml+xml,application/zip');const paint=()=>{const f=input.files&&input.files[0];if(!f)return;name.textContent=f.name;const ok=/\.(kmz|kml|zip)$/i.test(f.name);start.disabled=!ok;start.classList.toggle('ready',ok);if(state)state.textContent=ok?'ファイルを読み込めます。':'KMZ / KML / ZIP を選択してください。'};input.addEventListener('input',paint);input.addEventListener('change',paint)}if(typeof left.onclick==='function'&&typeof right.onclick==='function'&&typeof start.onclick==='function')say('起動OK');else throw new Error('入口ボタン初期化に失敗しました')}catch(e){console.error(e);say(e.message||String(e),true)}}frame.addEventListener('load',()=>setTimeout(repair,200));frame.src='./index.html?hotfix4='+Date.now()})();</script></body></html>
