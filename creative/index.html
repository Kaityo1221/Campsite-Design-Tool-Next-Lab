<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>CREATIVE MODE | Next Lab</title>
<style>html,body{margin:0;width:100%;height:100%;background:#17130f;color:#fff8e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}.boot small{display:block;margin-top:8px;opacity:.7}.error{white-space:pre-wrap;text-align:left;color:#ffd0c8;background:#3b1713;border:1px solid #87453d;border-radius:16px;padding:16px;max-width:720px;width:100%;box-sizing:border-box}</style>
</head>
<body>
<div id="boot" class="boot"><div><strong>CREATIVE MODE</strong><small>読み込み中…</small></div></div>
<script>
(async()=>{
  const VERSION='20260911-main39';
  const boot=document.getElementById('boot');
  const fail=(stage,e)=>{
    boot.innerHTML='';
    const box=document.createElement('div');box.className='error';
    box.textContent='CREATIVE MODE 読み込みエラー\n\n段階: '+stage+'\n'+(e&&e.stack?e.stack:(e&&e.message?e.message:String(e||'')));
    boot.appendChild(box);
  };
  try{
    const runtimeRes=await fetch('./runtime-vnext.html?v='+VERSION,{cache:'no-store'});
    if(!runtimeRes.ok)throw new Error('runtime HTTP '+runtimeRes.status);
    let runtime=await runtimeRes.text();

    const writeNeedle='document.open();document.write(html);document.close();';
    if(!runtime.includes(writeNeedle))throw new Error('runtime write target not found');

    const directPatch=`
  try{
    const patchUrls=[
      './creative-patches-v2.js?v=${VERSION}',
      './creative-patches-v3.js?v=${VERSION}',
      './creative-patches-v4.js?v=${VERSION}',
      './creative-patches-v5-design-check.js?v=${VERSION}',
      './creative-patches-v6-intuitive.js?v=${VERSION}',
      './creative-patches-v9-return-main.js?v=${VERSION}',
      './creative-patches-v10-save-labels.js?v=${VERSION}',
      './creative-patches-v13-draggable-fab.js?v=${VERSION}',
      './creative-patches-v14-layer-tap-layout.js?v=${VERSION}',
      './creative-patches-v18-preview-crosshair.js?v=${VERSION}',
      './creative-patches-v19-persistent-crosshair.js?v=${VERSION}',
      './creative-patches-v20-radius-gauge-save-return.js?v=${VERSION}',
      './creative-patches-v21-radius-swipe.js?v=${VERSION}',
      './creative-patches-v23-add-mode-close.js?v=${VERSION}',
      './creative-patches-v24-confirm-vertical-radius.js?v=${VERSION}',
      './creative-patches-v25-radius-handle-no-preview.js?v=${VERSION}',
      './creative-patches-v26-compact-radius-bar.js?v=${VERSION}',
      './creative-patches-v27-dot-handle-bar.js?v=${VERSION}',
      './creative-patches-v28-lever-handle.js?v=${VERSION}',
      './creative-patches-v29-lever-notches.js?v=${VERSION}',
      './creative-patches-v30-lever-gesture-lock.js?v=${VERSION}',
      './creative-patches-v32-poi-move-isolated.js?v=${VERSION}',
      './creative-patches-v33-action-wiring.js?v=${VERSION}',
      './creative-patches-v34-placement-core.js?v=${VERSION}',
      './creative-patches-v35-nearest-poi-warning.js?v=${VERSION}'
    ];
    window.applyCreativePatches=s=>s;
    for(const url of patchUrls){
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok)throw new Error(url+' HTTP '+r.status);
      Function(await r.text())();
      if(typeof window.applyCreativePatches!=='function')throw new Error(url+' registration failed');
    }
    html=window.applyCreativePatches(html);

    const bgOldMain='https://raw.githubusercontent.com/Kaityo1221/campsite-design-tool-adv-lab/main/creative/runtime/assets/creative-mode-opening.png';
    const bgOldPinned='https://raw.githubusercontent.com/Kaityo1221/campsite-design-tool-adv-lab/1c27ca3ef14f423688f755d350ecc602bee1c573/creative/runtime/assets/creative-mode-opening.png';
    const bgStable='https://media.githubusercontent.com/media/Kaityo1221/campsite-design-tool-adv-lab/1c27ca3ef14f423688f755d350ecc602bee1c573/creative/runtime/assets/creative-mode-opening.png';
    html=html.split(bgOldMain).join(bgStable).split(bgOldPinned).join(bgStable);

    html=html.replace(/<input\\b[^>]*\\bid=[\"']entryFile[\"'][^>]*>/i,m=>m.replace(/\\saccept\\s*=\\s*(?:\"[^\"]*\"|'[^']*'|[^\\s>]+)/i,''));
    html=html.replace('entryFile.onchange=()=>{',"entryFile.removeAttribute('accept');entryFile.accept='';entryFile.onchange=()=>{");
  }catch(e){
    document.body.style.cssText='margin:0;padding:24px;background:#17130f;color:#ffd0c8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;white-space:pre-wrap';
    document.body.textContent='CREATIVE MODE 読み込みエラー\\n\\n段階: final base patch\\n'+(e&&e.stack?e.stack:(e&&e.message?e.message:String(e||'')));
    return;
  }
  ${writeNeedle}`;

    runtime=runtime.replace(writeNeedle,directPatch);
    document.open();document.write(runtime);document.close();
  }catch(e){fail('bootstrap',e)}
})();
</script>
</body>
</html>
