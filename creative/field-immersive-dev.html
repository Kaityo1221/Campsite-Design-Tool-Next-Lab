<style>
:root{--ink:#fff8e8;--muted:#cfc4b2;--edge:rgba(255,239,200,.28);--glass:rgba(32,27,21,.92);--blue:#9ecfff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#17130f;color:var(--ink)}button,input{font:inherit}button{touch-action:manipulation}#map{position:fixed;inset:0;z-index:1}.leaflet-control-attribution{font-size:8px}.veil{position:fixed;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(15,12,9,.28),transparent 22%,transparent 76%,rgba(15,12,9,.34))}
.top{position:fixed;z-index:1000;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}.top>*{pointer-events:auto}.top button,.bonus{min-height:42px;border:1px solid var(--edge);border-radius:13px;background:rgba(28,24,19,.92);color:var(--ink);font-weight:900;box-shadow:0 6px 18px rgba(0,0,0,.2)}.top button{padding:0 12px}.bonus{display:grid;place-items:center;min-height:0;padding:7px 10px;color:#ffe19b;font-size:11px;letter-spacing:.08em}
.radarbar{position:fixed;z-index:999;top:calc(66px + env(safe-area-inset-top));left:10px;right:10px;padding:8px 10px;border:1px solid rgba(180,220,255,.28);border-radius:15px;background:rgba(20,25,30,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(0,0,0,.24)}.radarbar.collapsed{right:auto;padding:0;border:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}.radarpeek{display:none;min-height:40px;padding:0 12px;border:1px solid rgba(180,220,255,.32);border-radius:13px;background:rgba(20,25,30,.9);color:#eff8ff;font-weight:950;box-shadow:0 6px 18px rgba(0,0,0,.2)}.radarbar.collapsed .radarpeek{display:block}.radarbar.collapsed .radarbody{display:none}.radarhead{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}.radarhead button{min-height:34px;padding:0 10px;border:1px solid rgba(158,207,255,.38);border-radius:10px;background:rgba(55,92,128,.58);color:#eff8ff;font-size:11px;font-weight:900}.radartitle{font-size:11px;font-weight:950}.radartime{font-size:10px;color:#bfe2ff;text-align:right;white-space:nowrap}.radarrange{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:6px}.radarrange span{font-size:9px;color:#c7d5df}.radarrange input{width:100%;accent-color:#78bfff}.radarstatus{margin-top:3px;font-size:9px;color:#becbd4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{position:fixed;z-index:1000;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-height:60dvh;overflow:auto;padding:0 13px 13px;border:1px solid var(--edge);border-radius:20px;background:var(--glass);box-shadow:0 16px 45px rgba(0,0,0,.34);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:transform .24s ease;will-change:transform}.sheet.collapsed{transform:translateY(calc(100% - 58px));overflow:hidden}.sheet-handle{position:sticky;top:0;z-index:2;width:100%;min-height:56px;border:0;background:linear-gradient(180deg,rgba(32,27,21,.98),rgba(32,27,21,.92));color:var(--ink);font-weight:950;display:flex;align-items:center;justify-content:center;gap:8px}.sheet-handle:before{content:"";position:absolute;top:7px;width:48px;height:5px;border-radius:999px;background:rgba(255,255,255,.25)}.sheet-body{padding-top:2px}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.13em;color:var(--blue)}h1{margin:3px 0 5px;font-size:22px}.lead{margin:0;color:var(--muted);font-size:11px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.file{position:relative;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border:1px dashed rgba(158,207,255,.55);border-radius:13px;background:rgba(44,118,190,.10);font-weight:900;overflow:hidden}.file span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file input{position:absolute;inset:0;width:100%;height:100%;opacity:0}.action{min-height:48px;padding:0 12px;border:1px solid var(--edge);border-radius:13px;background:#fff8e6;color:#382d1d;font-weight:950}.action:disabled{opacity:.42}.status{margin-top:8px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.06);font-size:11px;line-height:1.5}.rain{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,239,200,.15)}.rain-head{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.rain-title{font-size:11px;font-weight:950}.rain button{min-height:42px;padding:0 14px;border:1px solid rgba(158,207,255,.55);border-radius:11px;background:#9ecfff;color:#15334e;font-weight:950}.rain button:disabled{opacity:.4}.timeline{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}.slot{flex:0 0 66px;padding:7px 5px;border:1px solid rgba(255,239,200,.16);border-radius:10px;background:rgba(255,255,255,.045);text-align:center}.slot time{display:block;font-size:9px;color:var(--muted)}.slot b{display:block;margin-top:4px;font-size:13px}.advice{margin-top:8px;font-size:11px;font-weight:850;line-height:1.5}.foot{margin-top:7px;color:#b9ae9c;font-size:9px;line-height:1.45}.poi-label{background:rgba(32,27,21,.9)!important;color:#fff8e8!important;border:0!important;border-radius:8px!important;box-shadow:none!important;padding:3px 6px!important;font-size:10px!important}.poi-label:before{display:none!important}.kml-popup{font-size:12px;line-height:1.45}.kml-popup b{display:block;font-size:13px}.kml-folder{margin-top:2px;color:#6d7780;font-size:10px}.kml-desc{margin-top:6px;white-space:pre-wrap;max-height:120px;overflow:auto}@media(max-width:520px){.grid{grid-template-columns:1fr}.action{width:100%}.radarbar:not(.collapsed){right:76px}.radarhead{grid-template-columns:auto 1fr auto}.radartime{grid-column:1/-1;text-align:left}.radarclose{grid-column:3}}

<body>
<div id="map"></div><div class="veil"></div>
<div class="top"><button type="button" onclick="location.href='./index.html'">← 戻る</button><span class="bonus">おまけ</span><button id="locate" type="button">◎ 現在地</button></div>
<div id="radarBar" class="radarbar collapsed">
  <button id="radarPanelToggle" class="radarpeek" type="button" aria-expanded="false">☔ 雨雲</button>
  <div class="radarbody">
    <div class="radarhead"><button id="radarToggle" type="button">☔ 雨雲 ON</button><div class="radartitle">全国 雨雲接近レーダー</div><div id="radarTime" class="radartime">取得中…</div><button id="radarClose" class="radarclose" type="button">▼</button></div>
    <div class="radarrange"><span>実況</span><input id="radarSlider" type="range" min="0" max="0" value="0" disabled><span>+60分</span></div>
    <div id="radarStatus" class="radarstatus">気象庁 高解像度降水ナウキャストを読み込み中</div>
  </div>
</div>
<section id="sheet" class="sheet collapsed">
  <button id="sheetToggle" class="sheet-handle" type="button" aria-expanded="false">▲ 現地メニュー</button>
  <div class="sheet-body">
    <div class="eyebrow">FIELD IMMERSIVE / WALK MODE</div>
    <h1>🧭 現地を歩く</h1>
    <p class="lead">完成したKMZ / KMLを読み込み、POI・ルート・活動範囲と現在地を重ねて歩く閲覧専用モードです。</p>
    <div class="grid"><label class="file">🗺️ <span id="fileLabel">KMZ / KMLを開く</span><input id="fileInput" type="file" accept=".kmz,.kml"></label><button id="fit" class="action" type="button" disabled>全体表示</button></div>
    <div class="grid"><button id="japan" class="action" type="button">🇯🇵 全国表示</button><button id="radarNow" class="action" type="button">☔ 実況へ</button></div>
    <div id="status" class="status">KMZ / KMLを開くか、現在地を表示してください。</div>
    <div class="rain">
      <div class="rain-head"><div class="rain-title">地点の降水量</div><button id="rainButton" type="button" disabled>雨を見る</button></div>
      <div id="rainTimeline" class="timeline"></div><div id="rainAdvice" class="advice"></div>
      <div class="foot">全国の雨雲は気象庁、現在地またはKMZ中心のmm/h確認はYahoo! JAPAN 気象情報APIを利用します。</div>
    </div>
  </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://azkshxjgsbtjgwbapcfw.supabase.co';
const JMA_TILE='https://www.jma.go.jp/bosai/jmatile/data/nowc';
const map=L.map('map',{zoomControl:false}).setView([35.6812,139.7671],10);L.control.zoom({position:'topright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
map.createPane('radarPane');map.getPane('radarPane').style.zIndex=410;map.getPane('radarPane').style.pointerEvents='none';
map.createPane('kmlPolygonPane');map.getPane('kmlPolygonPane').style.zIndex=430;
map.createPane('kmlLinePane');map.getPane('kmlLinePane').style.zIndex=440;
map.createPane('kmlPointPane');map.getPane('kmlPointPane').style.zIndex=450;
const sheet=document.getElementById('sheet'),sheetToggle=document.getElementById('sheetToggle'),fileInput=document.getElementById('fileInput'),fileLabel=document.getElementById('fileLabel'),fit=document.getElementById('fit'),status=document.getElementById('status'),locate=document.getElementById('locate'),japan=document.getElementById('japan'),radarNow=document.getElementById('radarNow'),rainButton=document.getElementById('rainButton'),rainTimeline=document.getElementById('rainTimeline'),rainAdvice=document.getElementById('rainAdvice'),radarBar=document.getElementById('radarBar'),radarPanelToggle=document.getElementById('radarPanelToggle'),radarClose=document.getElementById('radarClose'),radarToggle=document.getElementById('radarToggle'),radarSlider=document.getElementById('radarSlider'),radarTime=document.getElementById('radarTime'),radarStatus=document.getElementById('radarStatus');
const group=L.featureGroup().addTo(map);let kmzCenter=null,currentPoint=null,currentMarker=null,currentAccuracy=null,resourceUrls=[];
let radarFrames=[],radarLayer=null,radarEnabled=true,radarIndex=0;
function setSheet(open){sheet.classList.toggle('collapsed',!open);sheetToggle.setAttribute('aria-expanded',String(open));sheetToggle.textContent=open?'▼ 畳む':'▲ 現地メニュー';setTimeout(()=>map.invalidateSize(),260)}
sheetToggle.onclick=()=>setSheet(sheet.classList.contains('collapsed'));
function setRadarPanel(open){radarBar.classList.toggle('collapsed',!open);radarPanelToggle.setAttribute('aria-expanded',String(open))}
radarPanelToggle.onclick=()=>setRadarPanel(true);radarClose.onclick=()=>setRadarPanel(false);
function readyRain(){rainButton.disabled=!(currentPoint||kmzCenter)}
function parseJmaTime(s){return new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10),+s.slice(10,12),+s.slice(12,14)))}
function jstTime(s){return parseJmaTime(s).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false})}
function radarLabel(frame){if(!frame)return'未取得';const lead=Math.round((parseJmaTime(frame.validtime)-parseJmaTime(frame.basetime))/60000);return `${lead>0?`+${lead}分`:'実況'} ${jstTime(frame.validtime)}`}
function setRadarFrame(index){if(!radarFrames.length)return;radarIndex=Math.max(0,Math.min(index,radarFrames.length-1));radarSlider.value=String(radarIndex);const f=radarFrames[radarIndex];radarTime.textContent=radarLabel(f);if(radarLayer){map.removeLayer(radarLayer);radarLayer=null}if(!radarEnabled)return;const url=`${JMA_TILE}/${f.basetime}/none/${f.validtime}/surf/hrpns/{z}/{x}/{y}.png`;radarLayer=L.tileLayer(url,{pane:'radarPane',minNativeZoom:4,maxNativeZoom:10,maxZoom:20,opacity:.68,attribution:'気象データ © 気象庁'}).addTo(map);radarLayer.on('tileerror',()=>{radarStatus.textContent='一部の雨雲タイルを取得できませんでした。地図を少し縮小して確認してください。'})}
function buildFrames(data){const obs=(Array.isArray(data.observations)?data.observations:[]).slice().sort((a,b)=>a.validtime.localeCompare(b.validtime));const latest=obs[obs.length-1];if(!latest)return[];const fcAll=(Array.isArray(data.forecasts)?data.forecasts:[]),latestBase=fcAll.map(x=>x.basetime).sort().pop(),end=parseJmaTime(latest.validtime).getTime()+60*60000;const fc=fcAll.filter(x=>x.basetime===latestBase&&x.validtime>latest.validtime&&parseJmaTime(x.validtime).getTime()<=end).sort((a,b)=>a.validtime.localeCompare(b.validtime));const unique=new Map();[latest,...fc].forEach(x=>unique.set(x.validtime,x));return [...unique.values()]}
async function loadRadar(){radarStatus.textContent='気象庁の最新時刻を取得中…';try{const res=await fetch(`${SUPABASE_URL}/functions/v1/jma-radar-index`,{cache:'no-store'}),data=await res.json();if(!res.ok)throw new Error(data?.error||'取得失敗');radarFrames=buildFrames(data);if(!radarFrames.length)throw new Error('雨雲時刻データがありません。');radarSlider.max=String(radarFrames.length-1);radarSlider.disabled=false;radarStatus.textContent='気象庁 高解像度降水ナウキャスト / 全国';setRadarFrame(Math.min(radarIndex,radarFrames.length-1))}catch(e){radarStatus.textContent=e.message||'雨雲レーダーを取得できませんでした。';radarTime.textContent='取得失敗'}}
radarSlider.addEventListener('input',()=>setRadarFrame(Number(radarSlider.value)));
radarToggle.onclick=()=>{radarEnabled=!radarEnabled;radarToggle.textContent=radarEnabled?'☔ 雨雲 ON':'☁️ 雨雲 OFF';radarPanelToggle.textContent=radarEnabled?'☔ 雨雲':'☁️ 雨雲 OFF';if(radarEnabled)setRadarFrame(radarIndex);else if(radarLayer){map.removeLayer(radarLayer);radarLayer=null}};
radarNow.onclick=()=>{if(radarFrames.length)setRadarFrame(0);setRadarPanel(false);setSheet(false)};
japan.onclick=()=>{map.fitBounds([[24,122],[46,146]],{padding:[8,8]});setSheet(false)};

function cleanupResources(){resourceUrls.forEach(u=>URL.revokeObjectURL(u));resourceUrls=[]}
async function loadKmlPackage(file){cleanupResources();if(/\.kml$/i.test(file.name))return{text:await file.text(),resolveIcon:async href=>href};if(!/\.kmz$/i.test(file.name))throw new Error('KMZ / KMLを選択してください。');const zip=await JSZip.loadAsync(file),names=Object.keys(zip.files).filter(n=>/\.kml$/i.test(n)&&!zip.files[n].dir),kmlName=names.find(n=>/(^|\/)doc\.kml$/i.test(n))||names[0];if(!kmlName)throw new Error('KMZ内にKMLが見つかりません。');const base=kmlName.includes('/')?kmlName.slice(0,kmlName.lastIndexOf('/')+1):'';return{text:await zip.files[kmlName].async('text'),resolveIcon:async href=>{if(!href)return null;if(/^https?:\/\//i.test(href)||/^data:/i.test(href))return href;let p=decodeURIComponent(String(href).replace(/^\.\//,''));const candidates=[p,base+p,p.replace(/^\//,'')];const hit=candidates.find(x=>zip.files[x]&&!zip.files[x].dir);if(!hit)return null;const blob=await zip.files[hit].async('blob'),url=URL.createObjectURL(blob);resourceUrls.push(url);return url}}}
function kmlColor(raw,fallback='#d8b766',fallbackOpacity=.9){const s=String(raw||'').trim().replace(/^#/,'');if(!/^[0-9a-fA-F]{8}$/.test(s))return{color:fallback,opacity:fallbackOpacity};const a=parseInt(s.slice(0,2),16)/255,b=s.slice(2,4),g=s.slice(4,6),r=s.slice(6,8);return{color:`#${r}${g}${b}`,opacity:a}}
function directText(el,selector){const n=el?.querySelector(selector);return n?String(n.textContent||'').trim():''}
function styleFromElement(el){if(!el)return{};const line=el.querySelector(':scope > LineStyle'),poly=el.querySelector(':scope > PolyStyle'),icon=el.querySelector(':scope > IconStyle'),label=el.querySelector(':scope > LabelStyle');const lc=kmlColor(directText(line,'color'),'#e0bd62',.9),pc=kmlColor(directText(poly,'color'),'#d8b766',.22),ic=kmlColor(directText(icon,'color'),'#d8b766',.95);return{lineColor:lc.color,lineOpacity:lc.opacity,lineWidth:Math.max(1,Number(directText(line,'width'))||3),polyColor:pc.color,polyOpacity:pc.opacity,polyFill:directText(poly,'fill')!=='0',polyOutline:directText(poly,'outline')!=='0',iconColor:ic.color,iconOpacity:ic.opacity,iconHref:directText(icon,'Icon href'),iconScale:Math.max(.6,Math.min(2,Number(directText(icon,'scale'))||1)),labelScale:Math.max(.6,Math.min(2,Number(directText(label,'scale'))||1))}}
function mergeStyle(a,b){return Object.assign({},a||{},b||{})}
function buildStyleIndex(doc){const styles=new Map(),maps=new Map();doc.querySelectorAll('Style[id]').forEach(s=>styles.set(s.id,styleFromElement(s)));doc.querySelectorAll('StyleMap[id]').forEach(sm=>{const pair=[...sm.querySelectorAll(':scope > Pair')].find(p=>directText(p,'key')==='normal')||sm.querySelector(':scope > Pair');if(pair)maps.set(sm.id,directText(pair,'styleUrl').replace(/^#/,''))});return{styles,maps}}
function resolveStyle(pm,index){let ref=directText(pm,':scope > styleUrl').replace(/^#/,'');if(index.maps.has(ref))ref=index.maps.get(ref);const base=index.styles.get(ref)||{};const inline=pm.querySelector(':scope > Style');return inline?mergeStyle(base,styleFromElement(inline)):base}
function folderPath(pm){const names=[];let n=pm.parentElement;while(n&&n.tagName!=='kml'){if(n.tagName==='Folder'){const name=[...n.children].find(x=>x.tagName==='name')?.textContent?.trim();if(name)names.unshift(name)}n=n.parentElement}return names}
function coords(text){return String(text||'').trim().split(/\s+/).map(t=>{const p=t.split(',').map(Number);return[p[1],p[0]]}).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]))}
function popupNode(meta){const root=document.createElement('div');root.className='kml-popup';const title=document.createElement('b');title.textContent=meta.name||'POI';root.appendChild(title);if(meta.folders.length){const f=document.createElement('div');f.className='kml-folder';f.textContent=meta.folders.join(' › ');root.appendChild(f)}if(meta.description){const d=document.createElement('div');d.className='kml-desc';d.textContent=meta.description;root.appendChild(d)}return root}
function addCommon(layer,meta){layer.bindPopup(popupNode(meta));if(meta.name)layer.bindTooltip(meta.name,{className:'poi-label',direction:'top'});group.addLayer(layer)}
async function renderGeometry(node,meta,style,resolveIcon,stats,allPts){const tag=node.tagName;if(tag==='MultiGeometry'){for(const child of [...node.children])await renderGeometry(child,meta,style,resolveIcon,stats,allPts);return}
if(tag==='Point'){const ll=coords(directText(node,':scope > coordinates'))[0];if(!ll)return;allPts.push(ll);let layer=null;const iconUrl=await resolveIcon(style.iconHref);if(iconUrl){const size=Math.round(28*(style.iconScale||1));layer=L.marker(ll,{pane:'kmlPointPane',icon:L.icon({iconUrl,iconSize:[size,size],iconAnchor:[size/2,size],popupAnchor:[0,-size+4]})})}else layer=L.circleMarker(ll,{pane:'kmlPointPane',radius:7*(style.iconScale||1),weight:2,color:'#fff',fillColor:style.iconColor||'#d8b766',fillOpacity:style.iconOpacity??.95});addCommon(layer,meta);stats.points++;return}
if(tag==='LineString'||tag==='LinearRing'){const ll=coords(directText(node,':scope > coordinates'));if(ll.length<2)return;allPts.push(...ll);const layer=L.polyline(ll,{pane:'kmlLinePane',color:style.lineColor||'#e0bd62',opacity:style.lineOpacity??.9,weight:style.lineWidth||3});addCommon(layer,meta);stats.lines++;return}
if(tag==='Polygon'){const outer=node.querySelector(':scope > outerBoundaryIs LinearRing coordinates'),holes=[...node.querySelectorAll(':scope > innerBoundaryIs LinearRing coordinates')];const rings=[];const out=coords(outer?.textContent);if(out.length<3)return;rings.push(out);holes.forEach(h=>{const r=coords(h.textContent);if(r.length>=3)rings.push(r)});rings.forEach(r=>allPts.push(...r));const layer=L.polygon(rings,{pane:'kmlPolygonPane',color:style.polyOutline===false?'transparent':(style.lineColor||style.polyColor||'#e0bd62'),opacity:style.lineOpacity??.85,weight:style.lineWidth||2,fill:style.polyFill!==false,fillColor:style.polyColor||'#d8b766',fillOpacity:style.polyOpacity??.22});addCommon(layer,meta);stats.polygons++;return}}
async function parseKml(pkg){const doc=new DOMParser().parseFromString(pkg.text,'application/xml');if(doc.querySelector('parsererror'))throw new Error('KMLを解析できません。');const index=buildStyleIndex(doc),allPts=[],folders=new Set(),stats={points:0,lines:0,polygons:0};for(const pm of [...doc.querySelectorAll('Placemark')]){const meta={name:directText(pm,':scope > name')||'POI',folders:folderPath(pm),description:directText(pm,':scope > description')};if(meta.folders.length)folders.add(meta.folders.join(' › '));const style=resolveStyle(pm,index);const geometries=[...pm.children].filter(x=>['Point','LineString','Polygon','MultiGeometry','LinearRing'].includes(x.tagName));for(const g of geometries)await renderGeometry(g,meta,style,pkg.resolveIcon,stats,allPts)}if(!allPts.length)throw new Error('座標が見つかりません。');const bounds=L.latLngBounds(allPts);return{bounds,center:bounds.getCenter(),stats,folders:folders.size}}
fileInput.addEventListener('change',async()=>{const f=fileInput.files?.[0];if(!f)return;fileLabel.textContent=f.name;status.textContent='KMZを読み込み中…';group.clearLayers();fit.disabled=true;try{const r=await parseKml(await loadKmlPackage(f));kmzCenter={lat:r.center.lat,lng:r.center.lng};map.fitBounds(r.bounds,{padding:[30,30],maxZoom:18});fit.disabled=false;status.textContent=`${f.name}｜POI ${r.stats.points}・線 ${r.stats.lines}・範囲 ${r.stats.polygons}${r.folders?`・フォルダ ${r.folders}`:''}`;readyRain();setSheet(false)}catch(e){kmzCenter=null;status.textContent=e.message||'読み込み失敗';readyRain()}});
fit.onclick=()=>{if(group.getLayers().length)map.fitBounds(group.getBounds(),{padding:[30,30],maxZoom:18})};
locate.onclick=()=>{if(!navigator.geolocation){status.textContent='位置情報を利用できません。';return}status.textContent='現在地を取得中…';navigator.geolocation.getCurrentPosition(p=>{currentPoint={lat:p.coords.latitude,lng:p.coords.longitude};if(currentMarker)map.removeLayer(currentMarker);if(currentAccuracy)map.removeLayer(currentAccuracy);currentAccuracy=L.circle([currentPoint.lat,currentPoint.lng],{radius:p.coords.accuracy||0,color:'#6bb7f4',weight:1,fillColor:'#6bb7f4',fillOpacity:.08}).addTo(map);currentMarker=L.circleMarker([currentPoint.lat,currentPoint.lng],{pane:'kmlPointPane',radius:8,weight:3,color:'#fff',fillColor:'#2c76be',fillOpacity:1}).addTo(map);map.setView([currentPoint.lat,currentPoint.lng],12);status.textContent=`現在地 ±${Math.round(p.coords.accuracy||0)}m`;readyRain();setSheet(false)},()=>{status.textContent='現在地を取得できませんでした。'},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})};
function advice(max){if(max>=20)return'強い雨に注意。屋根付き退避地点と移動時間を先に確認。';if(max>=10)return'まとまった雨の可能性。雨宿り場所と滑りやすい区間を確認。';if(max>=5)return'このあと雨が強まる可能性あり。退避先を意識して歩く。';if(max>0)return'弱い雨の可能性あり。';return'60分以内は大きな降水シグナルなし。'}
async function fetchRain(point){const res=await fetch(`${SUPABASE_URL}/functions/v1/yahoo-rain`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(point)});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data?.error||`雨予報を取得できませんでした (${res.status})`);return Array.isArray(data.weather)?data.weather:[]}
rainButton.onclick=async()=>{const p=currentPoint||kmzCenter;if(!p)return;rainButton.disabled=true;rainButton.textContent='取得中';rainTimeline.innerHTML='';rainAdvice.textContent='';try{const rows=await fetchRain(p),future=rows.filter(x=>String(x.type||'').toLowerCase()!=='observation').slice(-13),shown=future.length?future:rows.slice(-13);if(!shown.length)throw new Error('雨予報データがありません。');rainTimeline.innerHTML=shown.map(x=>`<div class="slot"><time>${String(x.date).slice(8,10)}:${String(x.date).slice(10,12)}</time><b>${Number(x.rainfall).toFixed(1)}</b><small> mm/h</small></div>`).join('');const max=Math.max(0,...shown.map(x=>Number(x.rainfall)||0));rainAdvice.textContent=advice(max)}catch(e){rainAdvice.textContent=e.message||'取得に失敗しました。'}finally{rainButton.textContent='雨を見る';readyRain()}};
readyRain();loadRadar();setInterval(loadRadar,5*60*1000);
})();
