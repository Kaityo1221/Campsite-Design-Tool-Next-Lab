<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="googlebot" content="noindex,nofollow,noarchive">
  <title>FIELD MODE | Next Lab</title>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <style>
    :root{
      color-scheme:light;
      --ink:#17342c;
      --muted:#60756d;
      --cream:#fbfaf4;
      --panel:rgba(255,255,250,.94);
      --green:#1f7256;
      --green-dark:#14563f;
      --line:rgba(22,72,55,.16);
      --shadow:0 18px 50px rgba(25,54,44,.20);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#dfe9df;color:var(--ink)}
    button{font:inherit}
    #map{position:fixed;inset:0}
    .maplibregl-ctrl-top-right{top:calc(76px + env(safe-area-inset-top));right:8px}
    .maplibregl-ctrl-bottom-right{bottom:calc(236px + env(safe-area-inset-bottom))}
    .maplibregl-ctrl-attrib{font-size:9px!important}

    .topbar{position:fixed;z-index:20;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
    .mode-badge,.gps-chip,.back-button{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(255,255,250,.92);border:1px solid rgba(24,73,57,.14);box-shadow:0 8px 22px rgba(27,57,47,.13)}
    .mode-badge{pointer-events:auto;border-radius:18px;padding:10px 13px 9px;max-width:205px}
    .mode-badge strong{display:block;font-size:12px;letter-spacing:.08em;color:var(--green-dark)}
    .mode-badge span{display:block;margin-top:2px;font-size:10px;color:var(--muted)}
    .gps-chip{pointer-events:auto;display:flex;align-items:center;gap:7px;border-radius:999px;padding:8px 10px;color:#3f5c52;font-size:11px;font-weight:800;white-space:nowrap}
    .gps-dot{width:8px;height:8px;border-radius:50%;background:#d89f31;box-shadow:0 0 0 4px rgba(216,159,49,.15)}
    .gps-chip.ok .gps-dot{background:#2f9b70;box-shadow:0 0 0 4px rgba(47,155,112,.16)}

    .explore-wrap{position:fixed;z-index:18;left:50%;top:44%;transform:translate(-50%,-50%);width:min(82vw,360px);transition:.28s ease}
    .explore-button{width:100%;min-height:64px;border:0;border-radius:22px;background:linear-gradient(180deg,#2d8c69,#1c694f);color:#fff;padding:14px 20px;box-shadow:0 15px 35px rgba(20,83,61,.32);font-size:17px;font-weight:900;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:10px}
    .explore-button:active{transform:scale(.985)}
    .explore-button .radar{width:24px;height:24px;border:2px solid rgba(255,255,255,.9);border-radius:50%;position:relative}
    .explore-button .radar:before,.explore-button .radar:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.65);border-radius:50%;inset:4px}
    .explore-button .radar:after{inset:9px;background:#fff;border:0}
    .explore-note{text-align:center;margin-top:8px;color:#385b4e;font-size:11px;font-weight:800;text-shadow:0 1px 4px rgba(255,255,255,.95)}
    body.discovered .explore-wrap{top:auto;bottom:calc(252px + env(safe-area-inset-bottom));width:min(70vw,290px)}
    body.discovered .explore-button{min-height:46px;border-radius:999px;padding:10px 16px;font-size:13px}
    body.discovered .explore-button .radar{width:18px;height:18px}
    body.discovered .explore-note{display:none}

    .range-label{position:fixed;z-index:12;left:14px;top:calc(79px + env(safe-area-inset-top));display:none;padding:7px 10px;border-radius:999px;background:rgba(255,255,250,.90);border:1px solid rgba(31,114,86,.17);font-size:10px;font-weight:900;color:var(--green-dark);box-shadow:0 6px 18px rgba(30,65,52,.10);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    body.discovered .range-label{display:block}

    .candidate-stage{position:fixed;z-index:17;left:0;right:0;bottom:calc(196px + env(safe-area-inset-bottom));height:138px;display:none;align-items:flex-end;justify-content:center;overflow:visible;touch-action:pan-y;padding-bottom:2px}
    body.discovered .candidate-stage{display:flex}
    .candidate-row{display:flex;align-items:flex-end;justify-content:center;gap:10px;width:100%;padding:0 12px}
    .candidate{flex:0 0 88px;width:88px;height:88px;border-radius:50%;border:2px solid rgba(255,255,255,.92);background:rgba(255,255,250,.92);box-shadow:0 9px 25px rgba(28,62,50,.20);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);padding:9px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:transform .22s ease,width .22s ease,height .22s ease,background .22s ease}
    .candidate.center{flex-basis:118px;width:118px;height:118px;background:rgba(249,255,245,.97);border:3px solid #4a9b70;box-shadow:0 14px 34px rgba(28,90,63,.28);transform:translateY(-2px)}
    .candidate .park-name{font-size:10px;font-weight:900;line-height:1.2;max-width:76px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
    .candidate.center .park-name{font-size:12px;max-width:98px}
    .candidate .distance{font-size:10px;color:var(--muted);margin-top:3px;font-weight:800}
    .candidate .rank{display:grid;place-items:center;margin-top:4px;width:27px;height:27px;border-radius:50%;background:#e5efe8;color:#265e49;font-size:15px;font-weight:1000}
    .candidate.center .rank{width:32px;height:32px;font-size:18px;background:#2d805f;color:#fff}
    .swipe-hint{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);font-size:9px;color:#45675b;font-weight:800;white-space:nowrap;text-shadow:0 1px 3px #fff}

    .detail-sheet{position:fixed;z-index:16;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));min-height:188px;border:1px solid rgba(26,77,60,.14);border-radius:25px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:17px 17px 15px;transform:translateY(120%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
    body.discovered .detail-sheet{transform:translateY(0)}
    .sheet-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .sheet-kicker{font-size:9px;font-weight:900;letter-spacing:.12em;color:#5b746b}
    .sheet-name{font-size:19px;font-weight:1000;margin-top:2px;line-height:1.2}
    .rank-badge{flex:0 0 auto;display:flex;align-items:center;gap:6px;border-radius:999px;background:#e6f1e9;padding:7px 10px;color:#256348;font-weight:900;font-size:11px}
    .rank-badge b{font-size:18px;line-height:1}
    .facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .fact{padding:6px 9px;border-radius:10px;background:#f0f2ec;color:#52675f;font-size:10px;font-weight:800}
    .reason{margin-top:10px;padding:10px 11px;border-left:3px solid #67a680;border-radius:4px 11px 11px 4px;background:#f2f7f0;color:#3b574d;font-size:11px;line-height:1.45}
    .reason strong{display:block;color:#296048;font-size:9px;letter-spacing:.08em;margin-bottom:2px}
    .open-park{width:100%;margin-top:11px;border:0;border-radius:15px;min-height:47px;background:#173f32;color:#fff;font-size:14px;font-weight:950;box-shadow:0 8px 19px rgba(20,63,49,.22)}
    .open-park:active{transform:scale(.99)}

    .park-focus{position:fixed;z-index:21;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:none;background:rgba(255,255,250,.95);border:1px solid rgba(26,77,60,.14);border-radius:22px;padding:14px 15px;box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    body.park-open .candidate-stage,body.park-open .detail-sheet,body.park-open .explore-wrap,body.park-open .range-label{display:none!important}
    body.park-open .park-focus{display:block}
    .park-focus small{display:block;color:#5c756b;font-size:9px;font-weight:900;letter-spacing:.1em}
    .park-focus strong{display:block;font-size:18px;margin-top:3px}
    .park-focus p{margin:5px 0 0;color:#52675f;font-size:11px;line-height:1.45}
    .back-button{display:none;pointer-events:auto;border:0;border-radius:999px;padding:9px 12px;color:var(--green-dark);font-size:11px;font-weight:900}
    body.park-open .back-button{display:block}
    body.park-open .gps-chip{display:none}

    .user-dot{width:20px;height:20px;border-radius:50%;background:#1d76d2;border:4px solid #fff;box-shadow:0 0 0 5px rgba(29,118,210,.20),0 4px 12px rgba(20,64,105,.3)}
    .park-map-marker{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #3e8a66;box-shadow:0 5px 14px rgba(26,76,56,.23);font-size:10px;font-weight:1000;color:#256148}
    .park-map-marker.selected{width:36px;height:36px;background:#246d50;color:#fff;border-color:#fff}

    @media(max-width:380px){
      .candidate-row{gap:6px}.candidate{flex-basis:78px;width:78px;height:78px}.candidate.center{flex-basis:108px;width:108px;height:108px}
      .detail-sheet{min-height:184px;padding:15px}.sheet-name{font-size:17px}
      .candidate-stage{bottom:calc(190px + env(safe-area-inset-bottom))}
      body.discovered .explore-wrap{bottom:calc(242px + env(safe-area-inset-bottom))}
    }
  </style>
</head>
<body>
  <div id="map" aria-label="FIELD MODE map"></div>

  <div class="topbar">
    <div class="mode-badge">
      <strong>FIELD MODE / 現地モード</strong>
      <span>Next Lab prototype</span>
    </div>
    <div id="gpsChip" class="gps-chip"><span class="gps-dot"></span><span id="gpsText">GPS確認中</span></div>
    <button id="backButton" class="back-button" type="button">← 候補一覧</button>
  </div>

  <div class="range-label">探索範囲 1.5 km</div>

  <div class="explore-wrap">
    <button id="exploreButton" class="explore-button" type="button"><span class="radar"></span><span>この周辺を探索する</span></button>
    <div class="explore-note">現在地を起点に半径1.5kmを探索</div>
  </div>

  <section id="candidateStage" class="candidate-stage" aria-label="公園候補">
    <div id="candidateRow" class="candidate-row"></div>
    <div class="swipe-hint">左右にスワイプして候補を切り替え</div>
  </section>

  <section class="detail-sheet" aria-live="polite">
    <div class="sheet-top">
      <div>
        <div class="sheet-kicker">SELECTED PARK / DEMO DATA</div>
        <div id="detailName" class="sheet-name">候補公園 1</div>
      </div>
      <div class="rank-badge">優先度 <b id="detailRank">B</b></div>
    </div>
    <div class="facts">
      <span id="detailDistance" class="fact">現在地から 280m</span>
      <span id="detailPoi" class="fact">既存POI 8</span>
    </div>
    <div class="reason"><strong>評価理由 / DEMO</strong><span id="detailReason">現在地から近く、現地確認を始めやすい候補です。</span></div>
    <button id="openParkButton" class="open-park" type="button">この公園を開く</button>
  </section>

  <section class="park-focus">
    <small>FIELD EXPLORATION MAP / PHASE 1</small>
    <strong id="focusName">候補公園 1</strong>
    <p>公園専用の現地探索マップ入口です。POI・公園境界・写真・メモ等は次フェーズで接続します。</p>
  </section>

  <script>
  (()=>{
    const FALLBACK={lng:139.7740,lat:35.7148};
    const STYLE='https://tiles.openfreemap.org/styles/liberty';
    const parks=[
      {name:'候補公園 1',distance:280,rank:'B',poi:8,bearing:35,reason:'現在地から近く、現地確認を始めやすい候補です。'},
      {name:'候補公園 2',distance:620,rank:'A',poi:14,bearing:128,reason:'広い活動範囲を検討しやすく、既存POIも多い候補です。'},
      {name:'候補公園 3',distance:940,rank:'C',poi:5,bearing:246,reason:'候補として確認できますが、現地で見たい項目が多い公園です。'}
    ];
    let origin={...FALLBACK};
    let selected=0;
    let discovered=false;
    let userMarker=null;
    let parkMarkers=[];
    let touchStartX=0;

    const map=new maplibregl.Map({
      container:'map',
      style:STYLE,
      center:[origin.lng,origin.lat],
      zoom:14.2,
      attributionControl:true
    });
    map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');

    const gpsChip=document.getElementById('gpsChip');
    const gpsText=document.getElementById('gpsText');
    const candidateRow=document.getElementById('candidateRow');
    const exploreButton=document.getElementById('exploreButton');
    const openParkButton=document.getElementById('openParkButton');
    const backButton=document.getElementById('backButton');

    function destination(point,distanceM,bearingDeg){
      const R=6371000;
      const brng=bearingDeg*Math.PI/180;
      const lat1=point.lat*Math.PI/180;
      const lng1=point.lng*Math.PI/180;
      const dr=distanceM/R;
      const lat2=Math.asin(Math.sin(lat1)*Math.cos(dr)+Math.cos(lat1)*Math.sin(dr)*Math.cos(brng));
      const lng2=lng1+Math.atan2(Math.sin(brng)*Math.sin(dr)*Math.cos(lat1),Math.cos(dr)-Math.sin(lat1)*Math.sin(lat2));
      return{lng:lng2*180/Math.PI,lat:lat2*180/Math.PI};
    }

    function circleGeoJSON(point,radiusM){
      const coords=[];
      for(let i=0;i<=96;i++){
        const p=destination(point,radiusM,(i/96)*360);
        coords.push([p.lng,p.lat]);
      }
      return{type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[coords]}};
    }

    function updateOrigin(lng,lat,isReal){
      origin={lng,lat};
      parks.forEach(p=>Object.assign(p,destination(origin,p.distance,p.bearing)));
      if(userMarker)userMarker.remove();
      const dot=document.createElement('div');dot.className='user-dot';
      userMarker=new maplibregl.Marker({element:dot,anchor:'center'}).setLngLat([lng,lat]).addTo(map);
      gpsChip.classList.toggle('ok',isReal);
      gpsText.textContent=isReal?'GPS取得済み':'デモ位置';
      if(discovered){drawRange();drawParkMarkers();renderCandidates();}
      else map.easeTo({center:[lng,lat],zoom:14.2,duration:700});
    }

    function drawRange(){
      const data=circleGeoJSON(origin,1500);
      const source=map.getSource('search-range');
      if(source){source.setData(data);return;}
      map.addSource('search-range',{type:'geojson',data});
      map.addLayer({id:'search-range-fill',type:'fill',source:'search-range',paint:{'fill-color':'#4a9d76','fill-opacity':0.08}});
      map.addLayer({id:'search-range-line',type:'line',source:'search-range',paint:{'line-color':'#267154','line-width':2,'line-opacity':0.75,'line-dasharray':[2,2]}});
    }

    function drawParkMarkers(){
      parkMarkers.forEach(m=>m.remove());
      parkMarkers=parks.map((p,i)=>{
        const el=document.createElement('button');
        el.type='button';
        el.className='park-map-marker'+(i===selected?' selected':'');
        el.textContent=p.rank;
        el.title=p.name;
        el.addEventListener('click',()=>selectPark(i,true));
        return new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([p.lng,p.lat]).addTo(map);
      });
    }

    function renderCandidates(){
      const order=[(selected+2)%3,selected,(selected+1)%3];
      candidateRow.innerHTML='';
      order.forEach((idx,pos)=>{
        const p=parks[idx];
        const button=document.createElement('button');
        button.type='button';
        button.className='candidate'+(pos===1?' center':'');
        button.setAttribute('aria-label',`${p.name} ${p.distance}m 優先度${p.rank}`);
        button.innerHTML=`<span class="park-name">${p.name}</span><span class="distance">${p.distance}m</span><span class="rank">${p.rank}</span>`;
        button.addEventListener('click',()=>selectPark(idx,true));
        candidateRow.appendChild(button);
      });
      const p=parks[selected];
      document.getElementById('detailName').textContent=p.name;
      document.getElementById('detailRank').textContent=p.rank;
      document.getElementById('detailDistance').textContent=`現在地から ${p.distance}m`;
      document.getElementById('detailPoi').textContent=`既存POI ${p.poi}（デモ）`;
      document.getElementById('detailReason').textContent=p.reason;
      document.getElementById('focusName').textContent=p.name;
      drawParkMarkers();
    }

    function selectPark(index,moveMap=false){
      selected=(index+parks.length)%parks.length;
      renderCandidates();
      if(moveMap){
        const p=parks[selected];
        map.easeTo({center:[p.lng,p.lat],zoom:14.8,duration:550});
      }
    }

    function fitSearchArea(){
      const nw=destination(origin,1850,315);
      const se=destination(origin,1850,135);
      map.fitBounds([[nw.lng,se.lat],[se.lng,nw.lat]],{padding:{top:110,bottom:300,left:35,right:35},duration:850,maxZoom:14.4});
    }

    function discover(){
      discovered=true;
      document.body.classList.add('discovered');
      exploreButton.querySelector('span:last-child').textContent='この周辺を再探索';
      drawRange();
      renderCandidates();
      fitSearchArea();
    }

    function openPark(){
      const p=parks[selected];
      document.body.classList.add('park-open');
      document.getElementById('focusName').textContent=p.name;
      map.flyTo({center:[p.lng,p.lat],zoom:16.2,duration:800});
    }

    function closePark(){
      document.body.classList.remove('park-open');
      fitSearchArea();
    }

    exploreButton.addEventListener('click',discover);
    openParkButton.addEventListener('click',openPark);
    backButton.addEventListener('click',closePark);

    const stage=document.getElementById('candidateStage');
    stage.addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].clientX},{passive:true});
    stage.addEventListener('touchend',e=>{
      const dx=e.changedTouches[0].clientX-touchStartX;
      if(Math.abs(dx)<35)return;
      selectPark(selected+(dx<0?1:-1),true);
    },{passive:true});

    map.on('load',()=>{
      updateOrigin(origin.lng,origin.lat,false);
      if(!navigator.geolocation){gpsText.textContent='GPS非対応';return;}
      navigator.geolocation.getCurrentPosition(
        pos=>updateOrigin(pos.coords.longitude,pos.coords.latitude,true),
        ()=>{gpsText.textContent='デモ位置';},
        {enableHighAccuracy:true,timeout:7000,maximumAge:15000}
      );
    });
  })();
  </script>
</body>
</html>
